version: 1
plan:
  name: '修复 hermes-agent terminal 工具的 Windows cwd 处理'
  max_concurrency: 2
  max_consecutive_failures: 2
  max_cycles: 6
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  - id: fix-terminal-cwd
    title: '修复 _wrap_command 的 Windows cwd 处理,让 cd 在 Windows 路径上不挂'
    prompt: |
      ## 上下文

      项目根:`E:\Hermes Agent\`(workspace)
      源码根:`E:\Hermes Agent\hermes-agent-source\`(Hermes Agent 框架,Nous Research 上游版)
      系统:Windows 11,Git Bash + MSYS2 风格路径转换
      现场用户会话:`mq3zqf787907f7`(`C:\Users\PZS0X\.hermes\logs\gateway.log` 有这个 session 的实际日志)

      ## Bug

      `E:\Hermes Agent\hermes-agent-source\tools\environments\base.py:446`

      ```python
      parts.append(f"builtin cd -- {quoted_cwd} || exit 126")
      ```

      每次跑 terminal 命令前,wrapper 脚本强制 `cd <cwd>`。当 `cwd` 是 Windows 路径
      (例如 `E:\Hermes Agent\data\webui-new\app`,由 WebUI 的 `process.cwd()` 传过来),
      Git Bash 报:

      ```
      /bin/bash: line 2: cd: E:\Hermes Agent\data\webui-new\app: No such file or directory
      exit_code: 126
      ```

      ## 现场复现

      跑 `hermes task "总结这个 excel"` 让 model 用 terminal 读 xlsx 前 500 字节,会看到
      同样的 exit 126。模型拿到失败提示后会乱给路径(它编了一个
      "FileDialog路径: E:\Hermes Agent\data\webui-new\app\944422542e45b702.xlsx",
      真实路径是 `E:\Hermes Agent\data\webui-new\data\upload\default\944422542e45b702.xlsx`)。

      ## 你要改的东西

      1. **在 `tools/environments/base.py` 改 `_wrap_command`(以及相关 helper):**
         - 当 `cwd` 是 Windows 风格路径(含 `:\` 或以 `\\` 开头),且 **Python 视角下确实存在**
           (`os.path.isdir(cwd)` 为真)时,把它转成 Git Bash 能认的 POSIX 形式再 `cd`。
           Windows 路径 `E:\foo\bar` 在 Git Bash 里通常是 `/e/foo/bar`(`/` + 小写盘符 +
           正斜杠路径),可以用 `subprocess` 跑 `cygpath -w <path>` 反向验证,或者直接做
           `path.replace('\\', '/').replace(':', '')` 然后前面加 `/` 拼盘符。
         - 如果 Python 视角下 cwd **不存在**(极端情况),不要 hard-fail,
           用 `|| true` 跳过 cd,让命令在 bash 默认 cwd 里跑。
         - 现有 `quoted_cwd = self._quote_cwd_for_cd(cwd)`(line 444)对 `~` 有特殊处理,
           保留这个语义。

      2. **不要破坏现有 `cd` 行为:**
         - POSIX 路径(例如 `/home/user`、纯相对路径)继续走原逻辑。
         - 已经正常工作的 Linux/macOS 路径(单元测试可能跑在 Linux)不能 regress。

      3. **加单元测试:** `tools/environments/test_base_cd.py`(或合适位置),
         至少覆盖:
         - Windows 路径 `E:\foo\bar` → 转换后能 `cd`(用 mock `_run_bash` 不真跑 git bash,
           验证 wrap 出来的字符串里包含 POSIX 形式 `/e/foo/bar`)。
         - 不存在的 Windows 路径 → wrap 里是 `cd ... || true` 而不是 `cd ... || exit 126`。
         - POSIX 路径 → 不动,继续用 `shlex.quote` 包裹。
         - `~/foo` → 继续展开成 `$HOME/foo`。

      4. **回归已有测试:** 跑 `python -m pytest tools/environments/ -q` 看有没有挂。
         (用 `HERMES_ISOLATE_CHILD=1` 避免污染用户的 `~/.hermes`。)

      5. **不要碰:**
         - 改 `cwd` 怎么"被传进来"(那是上游的,这次不动)。
         - 改 `read_file` 工具逻辑(那是另一个 bug,本任务不涉及)。
         - 改 wrapper 脚本里其他部分(`source snapshot`、`eval`、`pwd -P` 输出 cwd marker 等)。

      ## 交付

      写一份简短的 `deliverable.md` 放 `E:\Hermes Agent\hermes-agent-source\deliverable-fix-terminal-cwd.md`,
      内容:
      - 改了哪几个函数(行号)
      - 新加的测试(文件名 + 测试名)
      - 跑过的命令 + 输出(`pytest` 的最后 10 行)
      - 现场复现的命令(用 `hermes task` 或等价的 +xlsx 复现),如果跑得起来就贴 exit 0 的证据;
        如果不能跑真 Git Bash,就贴 mock 验证的输出

      ## 不要做

      - 不要 spawn 新的 session / 不要 sleep 等待 CI / 不要 merge / 不要 push
      - 不要污染用户的 `C:\Users\PZS0X\.hermes\` 目录(用临时 HERMES_HOME)
    assigned_to: coder
    verified_by: verifier
    verify_prompt: |
      ## 你的任务:独立重新派生,不要复读 producer 的 diff

      ### 必做

      1. **重新读源码** `E:\Hermes Agent\hermes-agent-source\tools\environments\base.py`,
         找出 `_wrap_command`、`_quote_cwd_for_cd` 等被改动的函数。**不要看 producer 的
         diff 描述,自己读代码还原 producer 的修改**。

      2. **跑回归测试:** `cd E:\Hermes Agent\hermes-agent-source && python -m pytest
         tools/environments/ -q`,确认新加的测试和已有测试都过。
         注意用 `HERMES_ISOLATE_CHILD=1` 隔离。

      3. **真 Git Bash 验证(关键):** 模拟实际场景,写一个 Python 小脚本(放在
         `$TEMP` 里,用完即弃),调用 `subprocess.run(['bash', '-c', '<wrapper 输出>'],
         capture_output=True, text=True)`,把 wrapper 生成的脚本放进去跑,
         确认 `cd` 真的成功。三个 case 都过:
         - Windows 路径 `E:\Hermes Agent` (实际存在) → `cd` 成功,`pwd` 输出是 POSIX 形式
         - 不存在的 Windows 路径 `E:\does\not\exist` → `cd` 不挂(用了 `|| true`)
         - POSIX 路径 `/tmp` (实际存在) → `cd` 成功

      4. **复现原始 bug 链:** 用 `E:\Hermes Agent\portable-python\python.exe` 写一个
         简单的 harness:
         - 构造一个 mock 的 Environment 实例(继承 base class),
           cwd 设成 `E:\Hermes Agent\data\webui-new\app`(也就是现场挂掉的路径)
         - 调用 `env._wrap_command('pwd', cwd)` 拿到 wrapper 脚本
         - 跑 `bash -c <script>`,**确认 exit 0**(修复前是 exit 126)
         - **确认 stderr 不再有 `No such file or directory`**

      ### 报告格式

      `verifier-report.md` 必须以 `VERDICT: PASS` 或 `VERDICT: FAIL` 开第一行。
      FAIL 要明确指出哪一步没通过、缺什么。

      ### 不要做

      - 不要 spawn 新 session
      - 不要 merge / push
      - 不要只看 producer 的 deliverable.md 就 PASS
    timeout_ms: 1800000
