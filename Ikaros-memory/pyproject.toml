[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikaros-memory-v4"
version = "4.0.0-alpha.1"
description = "Ikaros memory system V4 — upgrade of V3 with explicit triggers, dynamic schema, and tests"
requires-python = ">=3.12"

# V4 不锁 chromadb 在这里, 因为:
#   - chromadb 1.5.2 已装在 portable-python (无需重装)
#   - 锁版本会让 U 盘场景下 pip install 失败
# 显式声明让"是否需要装"一目了然
dependencies = [
    "aiosqlite>=0.19",
    "chromadb>=1.5",
    "sqlite-vec>=0.1",
    "python-dotenv>=1.0",  # 哥哥 (2026-07-05): 自动从 .env 读 DEEPSEEK_API_KEY
    "httpx>=0.27",          # DeepSeek V4 flash API client
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
]

[project.scripts]
ikaros-mem-v4 = "v4.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["v4*"]

[tool.pytest.ini_options]
testpaths = ["v4/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.package-data]
v4 = ["py.typed"]
