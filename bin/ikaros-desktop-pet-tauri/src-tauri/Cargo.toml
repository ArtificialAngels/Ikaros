[package]
name = "icarus-desktop-pet"
version = "0.1.0"
description = "🪶 Ikaros Desktop Pet"
authors = ["Ikaros"]
edition = "2021"

[lib]
name = "icarus_desktop_pet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
