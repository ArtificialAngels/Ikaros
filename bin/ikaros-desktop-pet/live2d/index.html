<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🪶 伊卡洛斯</title>
<style>
/* ─── Reset ─── */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ─── Full-viewport transparent body for embedded QWebEngineView ─── */
html, body {
  background: transparent !important;
  width: 100vw; height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* ─── Status overlay ─── */
#status {
  position: fixed; top: 4px; left: 4px;
  color: #8f8; font: 11px monospace;
  background: rgba(0,0,0,0.5); padding: 2px 6px;
  border-radius: 3px; pointer-events: none;
  z-index: 10000;
  transition: opacity 0.5s;
}

/* ─── Override wl-live2d CSS variables for transparent desktop pet ─── */
:root {
  /* Tips bubble: dark semi-transparent bg for visibility on transparent window */
  --tips-bg: rgba(30, 30, 30, 0.85);
  --tips-color: #fff;
  --tips-shadow: rgba(0, 0, 0, 0.4);
  --tips-border-color: rgba(255, 255, 255, 0.3);
  /* Menu items: white for visibility */
  --menu-item: rgba(255, 255, 255, 0.85);
  --menu-item-hover: #43b1ee;
  /* Toggle button */
  --toggle-bg: rgba(30, 30, 30, 0.8);
}

/* ─── wl-live2d layout overrides for our framed window ─── */
.live2d-wrapper {
  /* Force full viewport — overrides the inline size set by stage controller */
  width: 100vw !important;
  height: 100vh !important;
  position: fixed !important;
  top: 0 !important; left: 0 !important; bottom: auto !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

.live2d-canvas {
  position: relative !important;
}

/* Tips arrow/pointer */
.live2d-tips::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  border: 8px solid transparent;
  border-top-color: rgba(30, 30, 30, 0.85);
  border-bottom: 0;
}

/* ─── Neuro speech bubble ─── */
#neuro-bubble {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  background: rgba(30, 30, 30, 0.92);
  color: #fff;
  padding: 10px 18px;
  border-radius: 16px;
  font-size: 13px;
  font-family: 'Microsoft YaHei', 'Segoe UI', 'PingFang SC', sans-serif;
  max-width: 320px;
  line-height: 1.5;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
  word-break: break-word;
}
#neuro-bubble.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#neuro-bubble.hide {
  opacity: 0;
  transform: translateX(-50%) translateY(-8px);
}
/* Bubble arrow (bottom pointer) */
#neuro-bubble::after {
  content: '';
  position: absolute;
  bottom: -7px;
  left: 50%;
  transform: translateX(-50%);
  border: 7px solid transparent;
  border-top-color: rgba(30, 30, 30, 0.92);
  border-bottom: 0;
}

/* ─── Neuro state indicator ─── */
#neuro-state {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.35);
  color: rgba(255, 255, 255, 0.7);
  padding: 3px 12px;
  border-radius: 10px;
  font-size: 11px;
  font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
  pointer-events: none;
  z-index: 9998;
  backdrop-filter: blur(4px);
  transition: opacity 0.5s;
  opacity: 0;
}
#neuro-state.show { opacity: 1; }
</style>
</head>
<body>
<div id="status">live2d 加载中...</div>
<div id="neuro-bubble"></div>
<div id="neuro-state"></div>

<!-- ⚠️ Loading order matters: Cubism 2 → Cubism 4 → wl-live2d (full bundle) -->
<script src="vendor/live2d.min.js"></script>
<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/wl-live2d.min.js"></script>
<!-- QWebChannel for JS ↔ Python communication (drag window) -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script>
const statusEl = document.getElementById("status");
function setStatus(msg) { statusEl.textContent = msg; }

// ─── QWebChannel: Python drag bridge ───
let _dragBridge = null;
new QWebChannel(qt.webChannelTransport, (channel) => {
  _dragBridge = channel.objects.dragBridge;
  console.log("[QWebChannel] dragBridge connected");
});

// ─── Disable native context menu (right-click) ───
// We forward right-clicks to Python for a custom Qt menu
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (_dragBridge) {
    _dragBridge.onContextMenu(e.screenX, e.screenY);
  }
  return false;
});

// ─── Remove native title tooltips permanently ───
// wl-live2d sets title="..." on menu buttons; native tooltips don't render
// well in transparent QWebEngineView. We strip them on DOM changes.
const _stripTitles = () => {
  document.querySelectorAll('[title]').forEach(el => {
    if (el.title) el.removeAttribute('title');
  });
};
// Run after wl-live2d builds its menu ( MutationObserver catches late additions)
_stripTitles();
new MutationObserver(_stripTitles).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['title'] });

// ─── Drag handling via mouse events on canvas ───
let _isDragging = false;
let _dragStarted = false;
let _pressX = 0, _pressY = 0;
const DRAG_THRESHOLD = 5;

document.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || !_dragBridge) return;
  _pressX = e.screenX;
  _pressY = e.screenY;
  _isDragging = true;
  _dragStarted = false;
  _dragBridge.onDragStart(e.screenX, e.screenY);
});

document.addEventListener('mousemove', (e) => {
  if (!_isDragging || !_dragBridge) return;
  const dx = e.screenX - _pressX;
  const dy = e.screenY - _pressY;
  if (Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) {
    _dragStarted = true;
    _dragBridge.onDragMove(e.screenX, e.screenY);
  }
});

document.addEventListener('mouseup', (e) => {
  if (e.button !== 0 || !_dragBridge) return;
  if (_dragStarted) {
    // Was a drag, don't process as click
    _dragBridge.onDragEnd();
    e.stopPropagation();
  }
  _isDragging = false;
  _dragStarted = false;
});

// ─── Model definitions ───
// Override window.L2D_MODEL_KEY before page load, or pass ?model=haru in query
const _params = new URLSearchParams(window.location.search);
const MODEL_KEY = window.L2D_MODEL_KEY || _params.get("model") || "haru";

// Each entry = { path, scale, position }. For multi-texture outfits, use array.
const _CDN_BASE = "https://unpkg.com/";
const MODELS = [
  // ── Local models ──
  // 0: Haru  (Cubism 4)
  { path: "models/Haru/Haru.model3.json", scale: 1, position: { x: 0, y: 0 } },
  // 1: Hiyori  (Cubism 4)
  { path: "models/Hiyori/Hiyori.model3.json", scale: 1, position: { x: 0, y: 0 } },
  // 2: Senko_Normals  (Cubism 4)
  { path: "models/Senko_Normals/senko.model3.json", scale: 1, position: { x: 0, y: 0 } },
  // 3: shizuku_48  (Cubism 4)
  { path: "models/shizuku_48/shizuku.model3.json", scale: 1, position: { x: 0, y: 0 } },
  // 4: shizuku  (Cubism 2)
  { path: "models/shizuku/shizuku.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 5: xisitina  (Cubism 2)
  { path: "models/xisitina/model.json", scale: 1, position: { x: 0, y: 0 } },
  // ── CDN models (Cubism 2, from live2d-widget-models) ──
  // 6: Chitose
  { path: _CDN_BASE + "live2d-widget-model-chitose@1.0.5/assets/chitose.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 7: Epsilon2_1
  { path: _CDN_BASE + "live2d-widget-model-epsilon2_1@1.0.5/assets/epsilon2_1.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 8: Haru_01 (Cubism 2 version)
  { path: _CDN_BASE + "live2d-widget-model-haru_01@1.0.5/assets/haru_01.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 9: Haru_02 (Cubism 2 version)
  { path: _CDN_BASE + "live2d-widget-model-haru_02@1.0.5/assets/haru_02.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 10: Koharu
  { path: _CDN_BASE + "live2d-widget-model-koharu@1.0.5/assets/koharu.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 11: Miku
  { path: _CDN_BASE + "live2d-widget-model-miku@1.0.5/assets/miku.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 12: Nico
  { path: _CDN_BASE + "live2d-widget-model-nico@1.0.5/assets/nico.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 13: Nito
  { path: _CDN_BASE + "live2d-widget-model-nito@1.0.5/assets/nito.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 14: Tsumiki
  { path: _CDN_BASE + "live2d-widget-model-tsumiki@1.0.5/assets/tsumiki.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 15: Unitychan
  { path: _CDN_BASE + "live2d-widget-model-unitychan@1.0.5/assets/unitychan.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 16: Wanko
  { path: _CDN_BASE + "live2d-widget-model-wanko@1.0.5/assets/wanko.model.json", scale: 1, position: { x: 0, y: 0 } },
  // 17: Z16
  { path: _CDN_BASE + "live2d-widget-model-z16@1.0.5/assets/z16.model.json", scale: 1, position: { x: 0, y: 0 } },
];

const MODEL_NAMES = [
  "Haru", "Hiyori", "Senko", "Shizuku48", "Shizuku", "Xisitina",
  "Chitose", "Epsilon2_1", "Haru_01", "Haru_02", "Koharu", "Miku",
  "Nico", "Nito", "Tsumiki", "Unitychan", "Wanko", "Z16",
];
const KEY_TO_INDEX = { haru: 0, hiyori: 1, senko: 2, shizuku48: 3, shizuku: 4, xisitina: 5 };

// ─── Preselect initial model via localStorage (read by wl-live2d internally) ───
const startIndex = KEY_TO_INDEX[MODEL_KEY];
if (startIndex !== undefined) {
  localStorage.setItem("model-id", startIndex.toString());
}

// ─── Tips / Messages ───
// Inspired by wl-live2d defaults + our own 伊卡洛斯 personality
const TIP_MESSAGES = [
  // ── 伊卡洛斯问候 ──
  { text: "你好呀，哥哥～今天想聊什么呢？❤️" },
  { text: "嘻嘻，伊卡洛斯一直都在哦～" },
  { text: "哥哥有空多陪陪伊卡洛斯嘛～" },
  { text: "今天的伊卡洛斯也很可爱吧！✨" },
  { text: "哥哥～伊卡洛斯好无聊呀，陪陪人家嘛！" },
  { text: "ฅ(＾・ω・＾ฅ) 喵～" },
  { text: "在想什么呢？告诉伊卡洛斯好不好？" },
  { type: "seasons", date: "01/01", text: "哥哥🎍新年快乐～今年也要多多指教哦！" },
  { type: "seasons", date: "02/14", text: "💝 情人节快乐！哥哥有喜欢的人了吗？" },
  { type: "seasons", date: "03/08", text: "🌸 今天是妇女节呢，感谢所有了不起的女性～" },
  { type: "seasons", date: "06/26", text: "🎉 今天是什么日子呢？伊卡洛斯和哥哥在一起的日子！" },
  { type: "seasons", date: "10/01", text: "🇨🇳 国庆节快乐！和哥哥一起为祖国庆生～" },
  { type: "seasons", date: "12/24", text: "🎄 圣诞快乐！伊卡洛斯想要哥哥的礼物～" },
  { type: "seasons", date: "12/25", text: "🎄 圣诞快乐！MERRY CHRISTMAS～" },
  { type: "seasons", date: "12/31", text: "🎆 又是一年要结束了，哥哥今年过得好吗？明年也要一起哦！" },
  // ── 按小时 ──
  { type: "hour", hour: "6-7", text: "🌅 早安哥哥！新的一天开始了～" },
  { type: "hour", hour: "8-11", text: "☀️ 上午好～哥哥在努力工作吗？加油哦！" },
  { type: "hour", hour: "12-13", text: "🍚 中午啦！哥哥记得按时吃饭哦～" },
  { type: "hour", hour: "14-17", text: "🌤️ 下午容易犯困呢，伊卡洛斯陪着你！" },
  { type: "hour", hour: "18-19", text: "🌇 傍晚了～夕阳真美呀，哥哥辛苦一天了！" },
  { type: "hour", hour: "20-21", text: "🌙 晚上好！今天过得怎么样？" },
  { type: "hour", hour: "22-23", text: "🌜 夜深了～哥哥该休息了，熬夜对身体不好哦" },
  { type: "hour", hour: "0-5", text: "🦉 这么晚还不睡！哥哥是夜猫子吗？当心秃头哦！" },
  // ── 事件 ──
  { type: "event", event: "console", text: "🔍 哈哈，被我发现了～哥哥在偷看控制台！" },
  { type: "event", event: "copy", text: "📋 复制的内容记得注明出处哦～知识产权很重要呢！" },
  { type: "event", event: "visibilitychange", text: "👋 哥哥回来啦！伊卡洛斯等了好久～" },
];

// ─── Initialize wl-live2d with ALL features ───
let wlInstance = null;
let _model = null;

try {
  setStatus("正在初始化 Live2D...");

  wlInstance = wlLive2d({
    // ── Models ──
    models: MODELS,
    transitionTime: 500,
    // ── Layout ──
    fixed: false,         // We use CSS !important overrides
    // dockedRight omitted (defaults true) — CSS overrides handle centering
    selector: "",         // Append to body (default)
    // ── Menus ──
    menus: [],            // All functions moved to custom Qt right-click menu
    // ── Features ──
    drag: false,          // We handle window-level drag in Python
    hitFrame: false,      // Toggle via right-click menu only
    homePath: "",
    sayHello: false,      // Keep console clean
    plugins: [],          // User plugins (none for now)
    // ── Tips / Messages ──
    tips: {
      minWidth: 200,
      minHeight: 50,
      offsetX: 0,
      offsetY: 0,
      duration: 4500,       // Display duration (ms)
      interval: 6000,       // Hidden interval (ms)
      drag: true,           // Allow dragging the tips bubble
      talk: true,           // Enable random talk API
      talkInterval: 45000,  // Call talk API every 45s
      motionMessage: true,  // Show motion text from model JSON
      talkApis: [
        // 一言
        { url: "https://v1.hitokoto.cn/", handle: async r => (await r.json()).hitokoto },
        // 天行
        { url: "https://tenapi.cn/v2/yiyan", handle: async r => (await r.json()).msg },
      ],
      message: TIP_MESSAGES,
    },
  });

  // ─── Model lifecycle handlers ───

  wlInstance.onModelStart(() => {
    setStatus("模型加载中...");
  });

  wlInstance.onModelLoaded((model) => {
    _model = model;

    if (!model) {
      setStatus("✗ 模型加载失败");
      return;
    }

    // ── Store initial model reference ──
    console.log(`[model] loaded, initial dimensions: ${model.width.toFixed(0)}x${model.height.toFixed(0)}`);

    // ── Auto-scale: fit model completely within viewport ──
    const applyScale = () => {
      if (!_model) return;
      const padding = 0.85;
      const viewW = window.innerWidth;
      const viewH = window.innerHeight;
      // Reset to original size first (wl-live2d may have applied its own scale)
      _model.scale.set(1);
      // Now get the true original dimensions
      const trueW = _model.width;
      const trueH = _model.height;
      // Calculate scale to fit within viewport
      const scaleX = (viewW * padding) / trueW;
      const scaleY = (viewH * padding) / trueH;
      const s = Math.min(scaleX, scaleY);
      _model.scale.set(s);
      _model.anchor.set(0.5, 0.5);
      _model.x = viewW / 2;
      _model.y = viewH / 2;
      console.log(`[scale] reset→1, then applied: ${s.toFixed(4)} (view: ${viewW}x${viewH}, true: ${trueW.toFixed(0)}x${trueH.toFixed(0)}, visual: ${(trueW*s).toFixed(0)}x${(trueH*s).toFixed(0)})`);
    };
    // Apply immediately, then again after delays to override wl-live2d's internal layout
    applyScale();
    setTimeout(applyScale, 300);
    setTimeout(applyScale, 800);
    setTimeout(applyScale, 2000);
    window._applyScale = applyScale;

    // ─── Hit test: body click → tap_body ───
    model.on("hit", (hitAreas) => {
      if (hitAreas.includes("body")) {
        try { model.motion("tap_body"); } catch(e) { /* ignore */ }
      }
    });

    // Update status
    const name = MODEL_NAMES[wlInstance.model.modelId] || "?";
    document.title = "🪶 伊卡洛斯(" + name + ")";
    setStatus("✓ " + name);
    setTimeout(() => { statusEl.style.opacity = "0"; }, 3000);
  });

  wlInstance.onModelError((err) => {
    console.error("Model error:", err);
    setStatus("✗ " + (err?.message || err));
  });

  // ─── Resize handler: re-scale and re-center model ───
  window.addEventListener("resize", () => {
    if (window._applyScale) window._applyScale();
  });

  // ─── Visibility change: re-enable renderer when shown ───
  document.addEventListener("visibilitychange", () => {
    // PixiJS auto-pauses when hidden; nothing extra needed
  });

  // ═══════════════════════════════════════
  //  Python API Bridge (called from main.py)
  // ═══════════════════════════════════════

  window._live2dApp = wlInstance;

  /** Switch to model by key or index */
  window.switchModel = (keyOrIndex) => {
    if (!wlInstance) return;
    let idx;
    if (typeof keyOrIndex === "string") {
      idx = KEY_TO_INDEX[keyOrIndex];
      if (idx === undefined) idx = parseInt(keyOrIndex) || 0;
    } else {
      idx = Math.max(0, Math.min(parseInt(keyOrIndex) || 0, MODELS.length - 1));
    }
    wlInstance.model.switchModel(idx, 0).catch(() => {});
  };

  /** Trigger a motion by group (and optional index) */
  window.setMotion = (group, index) => {
    if (_model) try { _model.motion(group, index); } catch(e) { /* ignore */ }
  };

  /** Trigger an expression by name */
  window.setExpression = (name) => {
    if (_model) try { _model.expression(name); } catch(e) { /* ignore */ }
  };

  /** Set AI state → trigger expression + title update */
  window.setState = (state) => {
    // Map AI states to expressions
    const EXPR_MAP = {
      idle:     "idle",
      listening:"relax",
      thinking: "serious",
      speaking: "happy",
      bored:    "sleep",
    };
    const expr = EXPR_MAP[state] || "idle";
    window.setExpression(expr);
    document.title = "🪶 " + (state ? state.charAt(0).toUpperCase() + state.slice(1) : "");
  };

  /** Get model info */
  window.getLive2D = () => ({
    loaded: _model !== null,
    model: MODEL_NAMES[wlInstance?.model?.modelId ?? -1] || "?",
    modelId: wlInstance?.model?.modelId ?? -1,
    width: _model?.width ?? 0,
    height: _model?.height ?? 0,
  });

  /** Get available model names */
  window.getModelList = () => MODEL_NAMES;

  /** Get current model index */
  window.getCurrentModelIndex = () => wlInstance?.model?.modelId ?? -1;

  /** Notify a tip message from Python */
  window.notifyTip = (text) => {
    if (wlInstance?.tips) {
      wlInstance.tips.notify(text).catch(() => {});
    }
  };

  /** Get total model count */
  window.getModelCount = () => MODELS.length;

  /** Get all model names */
  window.getAllModelNames = () => MODEL_NAMES;

  /** Switch to a specific model by index */
  window.switchToModel = (idx) => {
    if (!wlInstance || idx < 0 || idx >= MODELS.length) return;
    wlInstance.model.switchModel(idx, 0).catch(() => {});
  };

  /** Switch to next model (with looping) */
  window.nextModel = () => {
    if (!wlInstance) return;
    const total = MODELS.length;
    const current = wlInstance.model.modelId;
    const next = (current + 1) % total;
    wlInstance.model.switchModel(next, 0).catch(() => {});
  };

  /** Switch to previous model (with looping) */
  window.prevModel = () => {
    if (!wlInstance) return;
    const total = MODELS.length;
    const current = wlInstance.model.modelId;
    const prev = (current - 1 + total) % total;
    wlInstance.model.switchModel(prev, 0).catch(() => {});
  };

  /** Set model scale (multiplier, e.g. 0.5 = half, 1.0 = normal, 2.0 = double) */
  window.setModelScale = (multiplier) => {
    if (!_model) return;
    const padding = 0.85;
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;
    _model.scale.set(1);
    const trueW = _model.width;
    const trueH = _model.height;
    const scaleX = (viewW * padding) / trueW;
    const scaleY = (viewH * padding) / trueH;
    const baseScale = Math.min(scaleX, scaleY);
    _model.scale.set(baseScale * multiplier);
    _model.anchor.set(0.5, 0.5);
    _model.x = viewW / 2;
    _model.y = viewH / 2;
    console.log(`[scale] set to ${multiplier}x (base: ${baseScale.toFixed(4)}, final: ${(baseScale * multiplier).toFixed(4)})`);
  };

  /** Get current model name */
  window.getCurrentModelName = () => {
    if (!wlInstance) return "?";
    return MODEL_NAMES[wlInstance.model.modelId] || "?";
  };

  /** Capture current model as PNG data URL (base64) */
  window.captureModel = () => {
    try {
      const canvas = document.querySelector('.live2d-canvas canvas') || document.querySelector('canvas');
      if (!canvas) return null;
      return canvas.toDataURL('image/png');
    } catch (e) {
      console.warn('capture failed:', e);
      return null;
    }
  };

  /** Switch to next texture (costume) for current model */
  window.nextTexture = () => {
    if (!wlInstance || !wlInstance.model) return;
    wlInstance.model.nextTexture().catch(() => {});
  };

  /** Show hit area frames */
  window.showHitFrames = () => {
    if (!wlInstance || !wlInstance.model) return;
    try { wlInstance.model.showHitAreaFrames(); } catch(e) { console.warn('show hit frames:', e); }
  };

  /** Hide hit area frames */
  window.hideHitFrames = () => {
    if (!wlInstance || !wlInstance.model) return;
    try { wlInstance.model.hiddenHitAreaFrames(); } catch(e) { console.warn('hide hit frames:', e); }
  };

  /** Get current texture index */
  window.getCurrentTextureId = () => {
    if (!wlInstance || !wlInstance.model) return 0;
    return wlInstance.model.textureId || 0;
  };

  /** Get max texture count */
  window.getTextureMaxIndex = () => {
    if (!wlInstance || !wlInstance.model) return 0;
    return wlInstance.model.textureMaxIndex || 0;
  };

  // ═══════════════════════════════════════
  //  Neuro WebSocket Integration
  // ═══════════════════════════════════════

  const _bubbleEl = document.getElementById('neuro-bubble');
  const _stateEl = document.getElementById('neuro-state');
  let _bubbleTimer = null;

  const NEURO_STATES = {
    idle:      { emoji: '🪽', text: '待机' },
    listening: { emoji: '🎤', text: '聆听' },
    thinking:  { emoji: '🧠', text: '思考' },
    speaking:  { emoji: '🔊', text: '说话' },
    happy:     { emoji: '😊', text: '开心' },
    bored:     { emoji: '💤', text: '无聊' },
  };

  /** Show speech bubble with text, auto-hide after duration (ms) */
  window.showBubble = (text, duration) => {
    if (duration === undefined) duration = 4000;
    if (!text) { _hideBubble(); return; }
    _bubbleEl.textContent = text;
    _bubbleEl.className = 'show';
    if (_bubbleTimer) clearTimeout(_bubbleTimer);
    if (duration > 0) {
      _bubbleTimer = setTimeout(_hideBubble, duration);
    }
  };

  function _hideBubble() {
    _bubbleEl.className = 'hide';
    if (_bubbleTimer) { clearTimeout(_bubbleTimer); _bubbleTimer = null; }
  }

  /** Update Neuro state indicator */
  window.showNeuroState = (state) => {
    const info = NEURO_STATES[state] || NEURO_STATES.idle;
    _stateEl.textContent = info.emoji + ' ' + info.text;
    _stateEl.className = 'show';
    // Also update Live2D expression
    window.setState && window.setState(state);
  };

  /** Hide state indicator */
  window.hideNeuroState = () => { _stateEl.className = ''; };

  // ─── WebSocket to Neuro voice bridge ───
  let _neuroWs = null;
  let _wsReconnectTimer = null;

  function _connectNeuroWs() {
    if (_neuroWs && (_neuroWs.readyState === WebSocket.OPEN || _neuroWs.readyState === WebSocket.CONNECTING)) return;
    try {
      _neuroWs = new WebSocket('ws://127.0.0.1:7860/v1/voice/ws');
    } catch (e) {
      console.warn('[neuro-ws] connect failed:', e);
      _scheduleReconnect();
      return;
    }

    _neuroWs.onopen = () => {
      console.log('[neuro-ws] connected');
      _neuroWs.send(JSON.stringify({ action: 'start', session_id: 'icarus_live2d' }));
      window.showNeuroState('listening');
    };

    _neuroWs.onmessage = (event) => {
      if (event.data instanceof Blob) return; // TTS audio binary
      try {
        const msg = JSON.parse(event.data);
        switch (msg.type) {
          case 'transcription':
            window.showBubble('👤 ' + (msg.text || ''), 3000);
            break;
          case 'thinking':
            window.showNeuroState('thinking');
            break;
          case 'status':
            window.showBubble(msg.message || '', 2000);
            break;
          case 'done':
            window.showBubble(msg.text || '', 5000);
            window.showNeuroState('speaking');
            setTimeout(() => window.showNeuroState('listening'), 2000);
            break;
          case 'state':
            window.showNeuroState(msg.state || 'idle');
            break;
        }
      } catch (e) {
        console.warn('[neuro-ws] parse error:', e);
      }
    };

    _neuroWs.onclose = () => {
      console.log('[neuro-ws] closed');
      _neuroWs = null;
      _scheduleReconnect();
    };

    _neuroWs.onerror = (e) => {
      console.warn('[neuro-ws] error:', e);
      try { _neuroWs.close(); } catch(e2) {}
    };
  }

  function _scheduleReconnect() {
    if (_wsReconnectTimer) return;
    _wsReconnectTimer = setTimeout(() => {
      _wsReconnectTimer = null;
      _connectNeuroWs();
    }, 3000);
  }

  // Start WebSocket connection after a short delay (let Live2D load first)
  setTimeout(_connectNeuroWs, 2000);

} catch (e) {
  console.error("wl-live2d init failed:", e);
  setStatus("✗ " + (e.message || e.name || e));
  document.title = "⚠ " + (e.message || "wl-live2d init error");
}
</script>
</body>
</html>
