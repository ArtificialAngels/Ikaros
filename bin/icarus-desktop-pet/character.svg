<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
<defs>
  <radialGradient id="skin" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff8f8"/>
    <stop offset="100%" stop-color="#fce4e8"/>
  </radialGradient>
  <linearGradient id="hair" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#ff9ab0"/>
    <stop offset="60%" stop-color="#f88"/>
    <stop offset="100%" stop-color="#f07090"/>
  </linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fff"/>
    <stop offset="100%" stop-color="#dde4f0"/>
  </linearGradient>
  <radialGradient id="eye" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#a8d8ff"/>
    <stop offset="60%" stop-color="#5aa8e0"/>
    <stop offset="100%" stop-color="#2a78b8"/>
  </radialGradient>
  <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff"/>
    <stop offset="100%" stop-color="#e8f0fa"/>
  </linearGradient>
</defs>

<!-- HALO -->
<ellipse cx="100" cy="20" rx="28" ry="7" fill="none" stroke="#f0c850" stroke-width="3" opacity="0.95"/>
<ellipse cx="100" cy="20" rx="32" ry="10" fill="none" stroke="#f0c850" stroke-width="1" opacity="0.4"/>

<!-- WINGS (back) -->
<g id="wings">
  <!-- Left wing -->
  <g transform="translate(75,100)">
    <path d="M5,15 C-15,-5 -25,-35 -15,-50 C-10,-58 5,-58 10,-50 C5,-62 18,-72 25,-62 C28,-55 25,-45 20,-38 C30,-40 40,-32 35,-20 C30,-8 18,8 5,15Z"
          fill="url(#wing)" stroke="#cdd5e0" stroke-width="0.5"/>
    <path d="M-5,5 Q-15,-15 -18,-30" stroke="#c8d0dc" stroke-width="0.6" fill="none" opacity="0.5"/>
    <path d="M0,12 Q-10,-5 -14,-22" stroke="#c8d0dc" stroke-width="0.6" fill="none" opacity="0.5"/>
  </g>
  <!-- Right wing -->
  <g transform="translate(125,100) scale(-1,1)">
    <path d="M5,15 C-15,-5 -25,-35 -15,-50 C-10,-58 5,-58 10,-50 C5,-62 18,-72 25,-62 C28,-55 25,-45 20,-38 C30,-40 40,-32 35,-20 C30,-8 18,8 5,15Z"
          fill="url(#wing)" stroke="#cdd5e0" stroke-width="0.5"/>
    <path d="M-5,5 Q-15,-15 -18,-30" stroke="#c8d0dc" stroke-width="0.6" fill="none" opacity="0.5"/>
    <path d="M0,12 Q-10,-5 -14,-22" stroke="#c8d0dc" stroke-width="0.6" fill="none" opacity="0.5"/>
  </g>
</g>

<!-- BODY / DRESS -->
<path d="M80,148 L77,160 L75,200 L78,235 L82,250 L100,257 L118,250 L122,235 L125,200 L123,160 L120,148 Z"
      fill="url(#dress)" stroke="#d0d8e8" stroke-width="0.8"/>
<!-- Shading -->
<path d="M88,150 Q100,210 112,150 Q114,180 100,250 Q86,180 88,150Z"
      fill="#f4f8ff" opacity="0.6"/>
<!-- Ribbon collar -->
<path d="M86,145 Q100,150 114,145 Q108,158 100,160 Q92,158 86,145Z"
      fill="#ff8aa5" stroke="#e87088" stroke-width="0.5"/>
<ellipse cx="100" cy="155" rx="13" ry="5" fill="#ff9ab0" opacity="0.6"/>

<!-- ARMS (pink skin tone) -->
<path d="M82,152 Q70,170 65,190" stroke="#fce4e8" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M118,152 Q130,170 135,190" stroke="#fce4e8" stroke-width="6" fill="none" stroke-linecap="round"/>
<circle cx="64" cy="193" r="5" fill="#fce4e8"/>
<circle cx="136" cy="193" r="5" fill="#fce4e8"/>

<!-- LEGS -->
<path d="M90,250 Q92,268 88,275" stroke="#fce4e8" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M110,250 Q108,268 112,275" stroke="#fce4e8" stroke-width="6" fill="none" stroke-linecap="round"/>
<!-- Boots -->
<ellipse cx="86" cy="278" rx="11" ry="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
<ellipse cx="114" cy="278" rx="11" ry="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
<path d="M82,278 Q86,275 90,278" stroke="#ff8aa5" stroke-width="2" fill="none"/>
<path d="M110,278 Q114,275 118,278" stroke="#ff8aa5" stroke-width="2" fill="none"/>

<!-- HEAD -->
<ellipse cx="100" cy="92" rx="42" ry="44" fill="url(#skin)"/>

<!-- HAIR (pink, Ikaros signature) -->
<path d="M58,85 Q55,55 70,38 Q88,26 100,25 Q118,26 130,40 Q145,55 142,85 Q145,118 138,128 Q125,138 110,140 Q90,138 75,128 Q58,118 58,85Z"
      fill="url(#hair)" stroke="#e87088" stroke-width="0.5"/>
<!-- Hair shine -->
<path d="M75,45 Q90,38 105,38 Q120,40 128,50" stroke="#ffc0d0" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
<path d="M80,50 Q90,46 100,46" stroke="#ffe0e8" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
<!-- SIDE STRANDS (signature Ikaros) -->
<path d="M58,88 Q50,108 60,130 Q52,128 46,108 Q44,90 54,75Z" fill="#f07090"/>
<path d="M142,88 Q150,108 140,130 Q148,128 154,108 Q156,90 146,75Z" fill="#f07090"/>
<!-- BANGS (front hair) -->
<path d="M68,50 Q82,62 100,58 Q120,58 132,50 Q126,68 100,72 Q74,70 68,50Z" fill="#e87088"/>
<path d="M75,52 Q88,60 100,58 Q115,58 125,52" stroke="#ff8aa5" stroke-width="0.5" fill="none" opacity="0.6"/>
<!-- AHOGE (the iconic antenna hair) -->
<path d="M100,26 Q105,12 110,18" stroke="#f07090" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M105,15 Q109,11 113,16" stroke="#ff8aa5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<!-- Small ribbon on side -->
<ellipse cx="62" cy="68" rx="3" ry="2" fill="#fff" opacity="0.7"/>

<!-- EYES (big anime blue, signature) -->
<!-- Left eye -->
<g>
  <ellipse cx="80" cy="90" rx="11" ry="13" fill="url(#eye)"/>
  <ellipse cx="80" cy="92" rx="6" ry="8" fill="#2a78b8" opacity="0.3"/>
  <!-- Top highlight (big) -->
  <ellipse cx="77" cy="83" rx="4" ry="4" fill="white" opacity="0.95"/>
  <!-- Bottom highlight (small) -->
  <ellipse cx="83" cy="96" rx="2" ry="2.5" fill="white" opacity="0.7"/>
  <!-- Sparkle -->
  <circle cx="84" cy="92" r="0.8" fill="white"/>
</g>
<!-- Right eye -->
<g>
  <ellipse cx="120" cy="90" rx="11" ry="13" fill="url(#eye)"/>
  <ellipse cx="120" cy="92" rx="6" ry="8" fill="#2a78b8" opacity="0.3"/>
  <ellipse cx="117" cy="83" rx="4" ry="4" fill="white" opacity="0.95"/>
  <ellipse cx="123" cy="96" rx="2" ry="2.5" fill="white" opacity="0.7"/>
  <circle cx="124" cy="92" r="0.8" fill="white"/>
</g>

<!-- EYELASHES -->
<path d="M69,78 Q72,74 75,76" stroke="#2a2030" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<path d="M75,76 Q80,73 85,77" stroke="#2a2030" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<path d="M115,77 Q120,73 125,76" stroke="#2a2030" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<path d="M125,76 Q128,74 131,78" stroke="#2a2030" stroke-width="1.5" fill="none" stroke-linecap="round"/>

<!-- EYEBROWS -->
<path d="M68,76 Q80,70 92,76" stroke="#e87080" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<path d="M108,76 Q120,70 132,76" stroke="#e87080" stroke-width="1.8" fill="none" stroke-linecap="round"/>

<!-- NOSE -->
<path d="M100,100 Q101,103 99,104" stroke="#f0a0b0" stroke-width="0.8" fill="none" stroke-linecap="round"/>

<!-- MOUTH (small, anime) -->
<ellipse cx="100" cy="112" rx="3.5" ry="2.5" fill="#e87080" opacity="0.6" id="mouth"/>
<path d="M97,115 Q100,117 103,115" stroke="#e87080" stroke-width="0.8" fill="none" opacity="0.5"/>

<!-- BLUSH -->
<ellipse cx="68" cy="103" rx="9" ry="4.5" fill="#ffa0b0" opacity="0.35"/>
<ellipse cx="132" cy="103" rx="9" ry="4.5" fill="#ffa0b0" opacity="0.35"/>
</svg>
