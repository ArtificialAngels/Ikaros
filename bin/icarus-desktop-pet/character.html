<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>🪶 伊卡洛斯</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 280px; height: 380px;
  overflow: hidden;
  background: transparent;
  user-select: none;
  font-family: 'Segoe UI', sans-serif;
}
#pet {
  position: relative;
  width: 280px; height: 380px;
  display: flex; align-items: center; justify-content: center;
}
#character-svg {
  width: 200px; height: 280px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Halo */
#halo {
  position: absolute; top: 8px; left: 50%;
  transform: translateX(-50%);
  width: 52px; height: 14px;
  border: 2.5px solid #f0c850;
  border-radius: 50%;
  box-shadow: 0 0 18px rgba(240, 200, 80, 0.7), 0 0 40px rgba(240, 200, 80, 0.3);
  transition: all 0.5s;
  z-index: 10;
}
#halo.thinking { animation: spin 1s linear infinite; }
#halo.listening { box-shadow: 0 0 30px rgba(240, 200, 80, 1), 0 0 60px rgba(240, 200, 80, 0.5); }
#halo.sleeping { opacity: 0.2; box-shadow: none; }
@keyframes spin { 0% { transform: translateX(-50%) rotate(0deg); } 100% { transform: translateX(-50%) rotate(360deg); } }

/* Wings */
.wing { position: absolute; z-index: 0; transition: all 0.6s ease; }
.wing-left { left: -15px; top: 70px; }
.wing-right { right: -15px; top: 70px; }
.wing svg { width: 100px; height: 140px; }

body.idle .wing-left { transform: rotate(-10deg); }
body.idle .wing-right { transform: rotate(10deg); }
body.listening .wing-left { transform: rotate(-30deg); }
body.listening .wing-right { transform: rotate(30deg); }
body.thinking .wing-left { transform: rotate(-35deg); }
body.thinking .wing-right { transform: rotate(35deg); }
body.speaking .wing-left { animation: flapL 0.5s ease-in-out infinite alternate; }
body.speaking .wing-right { animation: flapR 0.5s ease-in-out infinite alternate; }
body.happy .wing-left { animation: flapL 0.3s ease-in-out infinite alternate; }
body.happy .wing-right { animation: flapR 0.3s ease-in-out infinite alternate; }
body.sleeping .wing-left { transform: rotate(30deg) translateX(-20px); }
body.sleeping .wing-right { transform: rotate(-30deg) translateX(20px); }

@keyframes flapL { 0% { transform: rotate(-30deg); } 100% { transform: rotate(-20deg); } }
@keyframes flapR { 0% { transform: rotate(30deg); } 100% { transform: rotate(20deg); } }

/* Status */
#status {
  position: absolute; bottom: 5px;
  font-size: 11px; color: rgba(255,255,255,0.6);
  background: rgba(0,0,0,0.25);
  padding: 3px 12px; border-radius: 10px;
  letter-spacing: 0.5px;
  backdrop-filter: blur(4px);
}

/* Speech bubble */
#bubble {
  position: absolute; top: -12px; right: -10px;
  background: rgba(20,20,30,0.92);
  color: #eee;
  padding: 8px 14px; border-radius: 14px;
  font-size: 12px; max-width: 180px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.3);
  opacity: 0; transition: opacity 0.4s;
  pointer-events: none;
  backdrop-filter: blur(8px);
  z-index: 20;
}
#bubble.show { opacity: 1; }
#bubble::after {
  content: ''; position: absolute; bottom: -5px; left: 25px;
  width: 10px; height: 10px;
  background: rgba(20,20,30,0.92);
  transform: rotate(45deg); border-radius: 2px;
}
</style>
</head>
<body class="idle">

<div id="pet">
  <div id="halo" class=""></div>
  <div id="bubble"></div>

  <!-- Wings SVG -->
  <div class="wing wing-left">
    <svg viewBox="0 0 120 160">
      <defs>
        <linearGradient id="wingGradL" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
          <stop offset="60%" stop-color="#f0f4ff" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#e0e8f0" stop-opacity="0.6"/>
        </linearGradient>
      </defs>
      <path d="M80,140 C20,120 0,60 10,30 C15,15 35,10 50,20 C40,5 55,-10 75,0 C85,5 85,20 75,35 C95,25 115,30 110,50 C105,70 95,100 80,140Z"
            fill="url(#wingGradL)" stroke="#e0e8f0" stroke-width="0.5" opacity="0.9"/>
      <!-- Feather details -->
      <path d="M50,50 Q65,65 70,90" stroke="#d0d8e8" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M35,70 Q55,80 65,105" stroke="#d0d8e8" stroke-width="0.8" fill="none" opacity="0.5"/>
    </svg>
  </div>

  <div class="wing wing-right">
    <svg viewBox="0 0 120 160">
      <defs>
        <linearGradient id="wingGradR" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
          <stop offset="60%" stop-color="#f0f4ff" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#e0e8f0" stop-opacity="0.6"/>
        </linearGradient>
      </defs>
      <path d="M40,140 C100,120 120,60 110,30 C105,15 85,10 70,20 C80,5 65,-10 45,0 C35,5 35,20 45,35 C25,25 5,30 10,50 C15,70 25,100 40,140Z"
            fill="url(#wingGradR)" stroke="#e0e8f0" stroke-width="0.5" opacity="0.9"/>
      <path d="M70,50 Q55,65 50,90" stroke="#d0d8e8" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M85,70 Q65,80 55,105" stroke="#d0d8e8" stroke-width="0.8" fill="none" opacity="0.5"/>
    </svg>
  </div>

  <!-- Character SVG (chibi Ikaros-style) -->
  <div id="character-svg">
    <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="skin" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fee"/>
          <stop offset="100%" stop-color="#fce4e8"/>
        </radialGradient>
        <radialGradient id="eyeGrad" cx="40%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#8ac4ff"/>
          <stop offset="60%" stop-color="#4a90d9"/>
          <stop offset="100%" stop-color="#3a78c0"/>
        </radialGradient>
      </defs>

      <!-- Body / Dress -->
      <path d="M80,145 Q100,215 120,145 Q140,150 135,210 Q130,250 100,255 Q70,250 65,210 Q60,150 80,145Z"
            fill="white" stroke="#e8e8f0" stroke-width="1"/>
      <!-- Dress shading -->
      <path d="M85,150 Q100,210 115,150 Q120,180 100,220 Q80,180 85,150Z"
            fill="#f8faff" opacity="0.5"/>
      <!-- Collar ribbon -->
      <path d="M88,145 Q100,152 112,145 Q108,155 100,158 Q92,155 88,145Z"
            fill="#ff88a0"/>

      <!-- Arms -->
      <path d="M82,152 Q68,170 65,190" stroke="#f5d0d0" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M118,152 Q132,170 135,190" stroke="#f5d0d0" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- Hands -->
      <circle cx="65" cy="192" r="5" fill="#fce4e8"/>
      <circle cx="135" cy="192" r="5" fill="#fce4e8"/>

      <!-- Legs -->
      <path d="M92,252 Q94,268 90,275" stroke="#f5d0d0" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M108,252 Q106,268 110,275" stroke="#f5d0d0" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- Shoes -->
      <ellipse cx="88" cy="276" rx="8" ry="4" fill="#ffa0b0"/>
      <ellipse cx="112" cy="276" rx="8" ry="4" fill="#ffa0b0"/>

      <!-- Head -->
      <ellipse cx="100" cy="90" rx="42" ry="44" fill="url(#skin)"/>

      <!-- Hair (Ikaros pink style) -->
      <path d="M58,80 Q56,55 68,40 Q88,28 100,28 Q118,28 132,40 Q144,55 142,80 Q145,110 135,125 Q120,140 100,143 Q80,140 65,125 Q55,110 58,80Z"
            fill="#ff8fa5" stroke="#f07a90" stroke-width="0.5"/>
      <!-- Hair shine -->
      <path d="M68,50 Q80,42 100,40 Q115,42 125,55"
            stroke="#ffb0c0" stroke-width="3" fill="none" opacity="0.5"/>
      <!-- Side hair -->
      <path d="M58,85 Q52,100 58,120 Q50,115 48,100 Q45,85 55,75Z" fill="#ff8fa5"/>
      <path d="M142,85 Q148,100 142,120 Q150,115 152,100 Q155,85 145,75Z" fill="#ff8fa5"/>
      <!-- Ahoge (antenna) -->
      <path d="M98,28 Q100,15 106,20" stroke="#ff7a90" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Tiny hair ornament -->
      <circle cx="65" cy="58" r="4" fill="#ff6680" opacity="0.6"/>

      <!-- Bangs -->
      <path d="M65,48 Q75,58 100,55 Q120,56 130,50 Q125,65 100,68 Q75,67 65,48Z"
            fill="#ff7088"/>

      <!-- Eyes (big blue anime style) -->
      <!-- Left eye -->
      <ellipse cx="82" cy="88" rx="10" ry="12" fill="url(#eyeGrad)" class="eye"/>
      <ellipse cx="82" cy="86" rx="7" ry="9" fill="#6aace8" opacity="0.3"/>
      <ellipse cx="82" cy="90" rx="3" ry="4" fill="#3a78c0" opacity="0.4"/>
      <!-- Eye shine -->
      <ellipse cx="79" cy="82" rx="3.5" ry="3" fill="white" opacity="0.9"/>
      <circle cx="84" cy="90" r="1.5" fill="white" opacity="0.5"/>

      <!-- Right eye -->
      <ellipse cx="118" cy="88" rx="10" ry="12" fill="url(#eyeGrad)" class="eye"/>
      <ellipse cx="118" cy="86" rx="7" ry="9" fill="#6aace8" opacity="0.3"/>
      <ellipse cx="118" cy="90" rx="3" ry="4" fill="#3a78c0" opacity="0.4"/>
      <ellipse cx="115" cy="82" rx="3.5" ry="3" fill="white" opacity="0.9"/>
      <circle cx="120" cy="90" r="1.5" fill="white" opacity="0.5"/>

      <!-- Eyebrows -->
      <path d="M72,76 Q82,72 92,76" stroke="#e87080" stroke-width="1.5" fill="none"/>
      <path d="M108,76 Q118,72 128,76" stroke="#e87080" stroke-width="1.5" fill="none"/>

      <!-- Nose -->
      <path d="M100,96 Q101,100 100,101" stroke="#f0a0b0" stroke-width="0.8" fill="none"/>

      <!-- Mouth (anime small) -->
      <ellipse cx="100" cy="108" rx="5" ry="3.5" fill="#f07080" opacity="0.6" id="mouth"/>

      <!-- Blush -->
      <ellipse cx="72" cy="100" rx="7" ry="4" fill="#ffa0b0" opacity="0.3"/>
      <ellipse cx="128" cy="100" rx="7" ry="4" fill="#ffa0b0" opacity="0.3"/>
    </svg>
  </div>

  <div id="status">🪽 待机中</div>
</div>

<script>
const states = {
  IDLE:     { e: '🪽', l: '待机中' },
  LISTENING:{ e: '🎤', l: '聆听中' },
  THINKING: { e: '🧠', l: '思考中' },
  SPEAKING: { e: '🔊', l: '说话中' },
  SLEEPING: { e: '💤', l: '休息中' },
  HAPPY:    { e: '😊', l: '开心~' },
};

const body = document.body;
const statusEl = document.getElementById('status');
const bubble = document.getElementById('bubble');

function setState(s) {
  body.className = s.toLowerCase();
  const st = states[s] || states.IDLE;
  statusEl.textContent = `${st.e} ${st.l}`;
}

function showBubble(text, dur) {
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubble._t);
  if (dur !== 0) bubble._t = setTimeout(() => bubble.classList.remove('show'), dur || 3000);
}

function hideBubble() { bubble.classList.remove('show'); }

window.setPetState = setState;
window.showBubble = showBubble;
window.hideBubble = hideBubble;

setState('IDLE');
</script>
</body>
</html>
