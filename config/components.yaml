# Ikaros 组件清单 (components registry)
#
# Single source of truth for component metadata: lifecycle scripts, ports,
# healthcheck, dependencies, and (for dsh) cordis overlay / MCP bindings.
#
# All paths in this file are RELATIVE to $IKAROS_ROOT (bin/ikaros-env.bat|sh
# is the authoritative root discoverer; this YAML must not hardcode drive
# letters). Ports track docs/ARCHITECTURE.md §1.2.
#
# Schema: see core/components/registry.py::ComponentSpec. Loader validates
# required fields (id/name/category/port/process_marker) and round-trips
# through ComponentSpec.from_dict / to_dict.
#
# Lifecycle.watchdog values:
#   self    -- script embeds its own watchdog loop
#   none    -- no watchdog (manual start/stop)
#   central -- legacy central watchdog (retired 2026-08-XX; new components
#              must use 'self' -- see embed below)
#
# Last updated: 2026-08-23 (pi/herdr 底座退役, 组件收敛为 3: dsh / conversation-tree / embedding)
components:
  # ------------------------------------------------------------------
  # 1) DeepSeek Harness (dsh) -- 工作引擎 (L3/L1)
  # ------------------------------------------------------------------
  - id: dsh
    name: DeepSeek Harness
    category: tool
    port: 3080
    process_marker: dsh
    dependencies: [embedding]
    config_schema: {}
    healthcheck:
      type: port
      endpoint: 3080
    lifecycle:
      # 2026-09-05 重构: 改用 ikaros.bat 统一入口 (原来 3 个 start-dsh-ikaros.bat
      # / restart-dsh-ikaros.ps1 / ikaros-launcher.bat 合并到 ikaros.bat).
      # ikaros.bat 检测 web 子命令: start=ikaros web, restart=ikaros dsh restart.
      # start_script 直接调 ikarosctl (绕过 bat 透传, 减少 1 层进程).
      start_script: python core/ikarosctl.py web
      stop_script: null   # 暂无优雅 stop (Ctrl-C / kill 兜底)
      restart_script: python core/ikarosctl.py dsh restart
      watchdog: self     # dsh 进程无外部 watchdog, 重启走 ikaros dsh restart
    dsh_integration:
      overlay: core/ikaros-dsh/cordis.patch.yml
      mcp_servers: [ikaros-v5-memory]

  # ------------------------------------------------------------------
  # 2) Conversation Tree -- 树形对话面板 (L3)
  # ------------------------------------------------------------------
  - id: conversation-tree
    name: Conversation Tree Panel
    category: ui
    port: null          # 动态端口: --port 0 由 OS 分配, 实际端口写 tmp/ct-port.json
    process_marker: conversation_tree
    dependencies: [memory_v5]
    config_schema: {}
    healthcheck:
      type: port_file   # 从 tmp/ct-port.json 读实际端口再探测
      endpoint: tmp/ct-port.json
    lifecycle:
      start_script: python core/conversation-tree/server.py --port 0
      stop_script: null
      restart_script: null
      watchdog: self     # server.py 内嵌端口拉起 (未来扩展)
    dsh_integration:
      overlay: null
      mcp_servers: []

  # ------------------------------------------------------------------
  # 3) Embedding -- bge-m3 本地 (L1)
  # ------------------------------------------------------------------
  - id: embedding
    name: Embedding (bge-m3, local)
    category: embedding
    port: 8587
    process_marker: embed
    dependencies: []
    config_schema: {}
    healthcheck:
      type: port
      endpoint: 8587
    lifecycle:
      # 启动由各上层组件脚本自带 watchdog (历史: 集中 watchdog 已退役 2026-08-XX)。
      # 这里仅登记元数据，不作为独立进程被本表直接拉起。
      start_script: null
      stop_script: null
      restart_script: null
      watchdog: self
    dsh_integration:
      overlay: null
      mcp_servers: []