[package]
name = "hermes-bridge-rs"
version = "0.1.0"
edition = "2021"
description = "Rust bridge PoC — axum + tokio reverse proxy for llama-server"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
# HTTP framework
axum = { version = "0.8", features = ["ws"] }
# HTTP client (for proxy)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Streaming
futures = "0.3"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling
thiserror = "2.0"
# Time
chrono = { version = "0.4", features = ["serde"] }
# Glob (module scanning)
glob = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
