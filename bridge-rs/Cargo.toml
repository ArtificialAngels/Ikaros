[package]
name = "hermes-bridge-rs"
version = "0.1.0"
edition = "2021"
description = "Rust bridge — axum + tokio. Self-contained (no Python bridge fallback)."

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
# HTTP framework
axum = { version = "0.8", features = ["ws"] }
# HTTP client (for proxy)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Streaming
futures = "0.3"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling
thiserror = "2.0"
# Time
chrono = { version = "0.4", features = ["serde"] }
# Glob (module scanning)
glob = "0.3"
# Base64 (audio data encoding for voice worker)
base64 = "0.22"
# Regex (intent_router)
regex = "1.10"
# Once_cell (lazy statics)
once_cell = "1.19"
# Parking_lot (faster Mutex/RwLock)
parking_lot = "0.12"
sherpa-onnx = { version = "1.13.3", default-features = false, features = ["shared"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
