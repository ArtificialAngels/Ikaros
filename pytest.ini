[pytest]
testpaths = tests core/memory_v5/tests
pythonpath = core
# 排除"不合群/过时"文件：
#   _debug_test.py               — 调试残留，顶层连 8587/8589 端口，非 pytest 测试
#   test_taskbus.py              — 依赖特定 PYTHONPATH，合并收集时 from taskbus import 失败
#   test_herdr_supervisor_api.py — 与 test_chat_v5_integration.py 顺序耦合：
#                                  两者 spec_from_file_location 加载同一 server.py 的
#                                  _bus 全局，合并跑被污染 → 'object' has no attribute
#                                  subscribe。单独跑 6 passed。
# 以上各自用文件头注明的方式单独运行。
# 2026-08-18: 原被排除的 test_hermes.py / test_phase1_cleanup.py /
# test_ikaros_dojo_daily.py 已随 hermes 底座退役删除。
addopts =
    --ignore=tests/_debug_test.py
    --ignore=tests/test_taskbus.py
    --ignore=tests/test_herdr_supervisor_api.py