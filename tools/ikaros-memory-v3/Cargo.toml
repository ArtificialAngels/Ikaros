[package]
name = "ikaros-memory-v3"
version = "0.1.0"
edition = "2021"
description = "伊卡洛斯记忆模块 v3 (DNA Memory 借鉴设计, Rust 封装)"
license = "Apache-2.0"
authors = ["Ikaros <gege@ikaros>"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "ikaros-memory-v3"
path = "src/main.rs"

[[bin]]
name = "ikaros-memory-v3-think"
path = "src/bin/think.rs"
