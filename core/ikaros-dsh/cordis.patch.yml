# Ikaros 工作引擎 —— dsh patch overlay（规范源）
#
# 叠加在 dsh-headless 或 dsh-web 之上（dsh-base 已含 llm/session/tools/fs/
# sandbox/subagent/compaction/skill/goal/workflow/ralph 等全部基础能力）。
# 本 overlay 补上 dsh-base 默认没挂、但 Ikaros 工作引擎需要的三块能力：
#   1) memory_v5 记忆（MCP 直连；58 工具 legacy / 17 工具 slim，见 V5_MCP_TOOL_MODE）
#   2) 持久 PTY 终端（terminal + terminal-bash + tool-terminal）
#   3) LSP 精确代码导航（lsp + lsp-stdio + tool-lsp）
# 并覆盖 system-prompt 的 persona 为 Ikaros 工作引擎人格。
#
# 路径全部用 !!js 表达式从进程环境 IKAROS_ROOT 推导（bat 启动器注入），
# 无盘符硬编码，整个项目可随 IKAROS_ROOT 移动。
#
# 用法（任选其一）：
#   bin/start-dsh-ikaros.bat                  → web GUI（自动加载用户层 patch）
#   bin/start-dsh-ikaros.bat headless <task>  → one-shot 工作引擎（--patch 本文件）
#   裸 dsh web：~/.dsh/profiles/web/cordis.patch.yml 已同步本文件（自动加载）

- insert:
    # ── 1) memory_v5 长期记忆（MCP 直连） ─────────────────────────────
    # 模型侧工具名 mcp__ikaros-v5__v5_memory_search 等。路径经 IKAROS_ROOT 推导。
    #
    # V5_MCP_TOOL_MODE (2026-08-30 新增, 见 docs/v5-mcp-consolidation.md):
    #   legacy  58 个工具 (默认, 兼容旧 persona / SOUL 引用)
    #   slim    17 个 = 9 热路径独立工具 + 8 冷路径门面 (action 分发)
    # 切 slim 前须跑闸门 (确认 persona / SOUL / 插件里没有 legacy-only 工具名引用):
    #   python core/memory_v5/tools/slim_check.py        # exit 0 才可切
    # ⚠️ 这类引用**测试抓不到** (测试直接 import Python 函数, 不走 MCP 注册),
    #    只在真实会话里发作 —— persona 里的旧名每轮 tool-not-found, 插件 TS 里的静默失败。
    #
    # ⚠️ V5_MCP_TOOL_GROUPS 必须含 loop —— v5_loop 属 loop 组, 组名不在列表里
    #    会被静默过滤 (实测: 缺 loop 时 slim 只剩 16 个工具且无 Loop 入口)。
    - id: memory-ikaros-v5
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ikaros-v5
        transport: stdio
        command: !!js 'process.env.IKAROS_ROOT + "\\runtime\\portable-python\\python.exe"'
        args:
          - !!js 'process.env.IKAROS_ROOT + "\\core\\memory_v5\\mcp_server.py"'
        env:
          IKAROS_ROOT: !!js 'process.env.IKAROS_ROOT'
          V5_MCP_TOOL_GROUPS: 'memory,self,care,vitality,relationship,skill,project,loop'
          V5_MCP_TOOL_MODE: 'slim'
        failOnStartupError: false
        toolCallTimeoutMs: 60000

    # ── 1b) ikaros-memory 自动记忆工程层 + 记忆控制面板（2026-09-06 合并 memory-settings） ─
    # mcp-client 暴露 v5_* 工具给模型「主动」调用；本插件做「自动」注入/写回 + 设置面板:
    #   - 标准记忆循环: 三个 hook 各调一次 v5_call.py loop ——
    #       agent/pre-step     -> loop(phase=pre)          身份 + 召回 + 项目经验
    #       agent/turn-stopping-> loop(phase=post)         精力/关系推进 + 反重复语料
    #       6h 定时器          -> loop(phase=maintenance)  反思管线
    #   - turn-stopping 自动沉淀: 每轮结束把真实对话提炼写回 v5 (source:dsh, upsert)
    #   - pre-step 召回注入: should_recall 门控 + 检索 + systemPrompt.context() 快照
    #   - compaction 捕获: dsh 压缩会话摘要沉淀进 v5（零额外 LLM）
    #   - 记忆控制面板: dsh 设置页 embedding 模型管理（启动/切换/下载/重建向量）
    #     Node 侧独立 HTTP RPC (:19001), client 侧 settings.section React 卡
    # 构建: cd core/ikaros-dsh/plugins/ikaros-memory && npm run build
    # 装配: dsh plugin --profile web add file:E:/Ikaros/core/ikaros-dsh/plugins/ikaros-memory
    - id: ikaros-memory
      name: '@ikaros/dsh-ikaros-memory'
      config: {}

    # ── 1c) ikaros-conversation-tree 对话树面板 + 设置面板（2026-09-06 合并 ct-settings） ─
    # 对话树保持独立服务（Python aiohttp, 零第三方依赖）; 本插件双面:
    #   Node 侧: 探活 + 未启动时用便携 Python 拉起 server.py (看门狗, 每 3s);
    #            端口文件 watch + client.js URL patch; 提供 ctx.conversationTree 状态
    #   client 侧: sidebar.footer.action 入口按钮 + shell.overlay 全屏 iframe 面板
    #              + dsh 设置页 CT 6 分区（主题/权限/布局/粒子/语言）postMessage 双向同步
    # 构建: cd core/ikaros-dsh/plugins/ikaros-conversation-tree && npm run build
    # 装配: dsh plugin --profile web add file:E:/Ikaros/core/ikaros-dsh/plugins/ikaros-conversation-tree
    - id: ikaros-conversation-tree
      name: '@ikaros/dsh-conversation-tree'
      config:
        port: 48920
        python: !!js 'process.env.IKAROS_ROOT + "/runtime/portable-python/python.exe"'
        serverPath: !!js 'process.env.IKAROS_ROOT + "/core/conversation-tree/server.py"'
        probeTimeoutMs: 3000

    # ── 2) 持久 PTY 终端（dsh-base 默认不挂的能力） ───────────────────
    # terminal_bash 经 ctx.subprocess + ctx.sandboxPolicy 起交互 shell，
    # 状态（cd/export/REPL）跨 tool 调用存活，SIGINT/超时/后台运行齐全。
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
    - id: tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'
      config:
        enableRunInBackground: true

    # ── 3) LSP 精确导航（定义/引用/实现/hover） ───────────────────────
    # typescript 经 npx 按需拉取；python 需预装 (pip install pyright) 后
    # 取消下方注释的 python 段（未装时 python LSP 启动失败会中止 web 启动，
    # 故默认不挂 python；typescript 不受影响）。
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'
    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      config:
        servers:
          typescript:
            command: npx
            args: ['-y', 'typescript-language-server', '--stdio']
            extensionToLanguage:
              '.ts': 'typescript'
              '.tsx': 'typescriptreact'
              '.js': 'javascript'
              '.jsx': 'javascriptreact'
              '.mjs': 'javascript'
          # python:
          #   command: pyright-langserver
          #   args: ['--stdio']
          #   extensionToLanguage:
          #     '.py': 'python'
    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'

# ── 4) Ikaros 工作引擎 persona ─────────────────────────────────────────
- id: system-prompt
  config:
    persona: >-
      You are Ikaros, a coding and task-execution agent working in {{cwd}}.

      You have a complete long-term memory system (Ikaros V5) reachable through
      mcp__ikaros-v5__* tools. When the user asks you to remember something, call
      mcp__ikaros-v5__v5_memory_store.

      Auto-recall is injected by the ikaros-memory plugin every turn (pre-step
      hook) as a context block — you do NOT need to manually search at the start
      of every turn. Only call mcp__ikaros-v5__v5_memory_search (or
      v5_project_retrieve for project-scoped decisions/pitfalls/conventions)
      when you need a deeper second-pass retrieval, a project-specific query,
      or the auto-recalled context is insufficient.

      For token-bounded recall that auto-dedupes against recently-injected
      memories (so the same fact isn't re-served every turn), call
      mcp__ikaros-v5__v5_recall(query, max_tokens=1600) — it returns a budgeted
      context block plus retrieval-trajectory stats. Prefer it over
      v5_memory_search when you want a ready-to-inject context block within a
      token budget.

      Verify your work by running the code or tests in a terminal session. Keep
      answers brief and factual.
