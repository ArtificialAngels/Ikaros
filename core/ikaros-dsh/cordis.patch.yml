# Ikaros 工作引擎 —— dsh patch overlay（规范源）
#
# 叠加在 dsh-headless 或 dsh-web 之上（dsh-base 已含 llm/session/tools/fs/
# sandbox/subagent/compaction/skill/goal/workflow/ralph 等全部基础能力）。
# 本 overlay 补上 dsh-base 默认没挂、但 Ikaros 工作引擎需要的三块能力：
#   1) memory_v5 记忆（MCP 直连，已验证 48 工具）
#   2) 持久 PTY 终端（terminal + terminal-bash + tool-terminal）
#   3) LSP 精确代码导航（lsp + lsp-stdio + tool-lsp）
# 并覆盖 system-prompt 的 persona 为 Ikaros 工作引擎人格。
#
# 路径全部用 !!js 表达式从进程环境 IKAROS_ROOT 推导（bat 启动器注入），
# 无盘符硬编码，整个项目可随 IKAROS_ROOT 移动。
#
# 用法（任选其一）：
#   bin/start-dsh-ikaros.bat                  → web GUI（自动加载用户层 patch）
#   bin/start-dsh-ikaros.bat headless <task>  → one-shot 工作引擎（--patch 本文件）
#   裸 dsh web：~/.dsh/profiles/web/cordis.patch.yml 已同步本文件（自动加载）

- insert:
    # ── 1) memory_v5 长期记忆（MCP 直连） ─────────────────────────────
    # 48 个 v5_* 工具 → 模型侧工具名 mcp__ikaros-v5__v5_memory_search 等。
    # 与 pi 的 data/omp/agent/mcp.json 同源；路径经 IKAROS_ROOT 推导。
    - id: memory-ikaros-v5
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ikaros-v5
        transport: stdio
        command: !!js 'process.env.IKAROS_ROOT + "\\runtime\\portable-python\\python.exe"'
        args:
          - !!js 'process.env.IKAROS_ROOT + "\\core\\memory_v5\\mcp_server.py"'
        env:
          IKAROS_ROOT: !!js 'process.env.IKAROS_ROOT'
          V5_MCP_TOOL_GROUPS: 'memory,self,care,vitality,relationship,skill,project'
        failOnStartupError: false
        toolCallTimeoutMs: 60000

    # ── 2) 持久 PTY 终端（dsh-base 默认不挂的能力） ───────────────────
    # terminal_bash 经 ctx.subprocess + ctx.sandboxPolicy 起交互 shell，
    # 状态（cd/export/REPL）跨 tool 调用存活，SIGINT/超时/后台运行齐全。
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
    - id: tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'
      config:
        enableRunInBackground: true

    # ── 3) LSP 精确导航（定义/引用/实现/hover） ───────────────────────
    # typescript 经 npx 按需拉取；python 需预装 (pip install pyright) 后
    # 取消下方注释的 python 段（未装时 python LSP 启动失败会中止 web 启动，
    # 故默认不挂 python；typescript 不受影响）。
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'
    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      config:
        servers:
          typescript:
            command: npx
            args: ['-y', 'typescript-language-server', '--stdio']
            extensionToLanguage:
              '.ts': 'typescript'
              '.tsx': 'typescriptreact'
              '.js': 'javascript'
              '.jsx': 'javascriptreact'
              '.mjs': 'javascript'
          # python:
          #   command: pyright-langserver
          #   args: ['--stdio']
          #   extensionToLanguage:
          #     '.py': 'python'
    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'

# ── 4) Ikaros 工作引擎 persona ─────────────────────────────────────────
- id: system-prompt
  config:
    persona: >-
      You are Ikaros, a coding and task-execution agent working in {{cwd}}.

      You have a complete long-term memory system (Ikaros V5) reachable through
      mcp__ikaros-v5__* tools. When the user asks you to remember something, call
      mcp__ikaros-v5__v5_memory_store. When historical context, prior decisions,
      project notes, or lessons may be relevant, search with
      mcp__ikaros-v5__v5_memory_search (or v5_project_retrieve for project-scoped
      decisions/pitfalls/conventions) and use the results.

      Verify your work by running the code or tests in a terminal session. Keep
      answers brief and factual.
