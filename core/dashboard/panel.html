<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ikaros 控制台</title>
<link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="brand">
    <span class="logo">伊</span>
    <h1>Ikaros 控制台</h1>
  </div>
  <div class="status-group">
    <span class="conn-dot" id="connDot"></span>
    <span id="connLabel">连接中...</span>
  </div>
  <span class="spacer"></span>
  <button class="theme-toggle" id="themeToggle" title="切换深色 / 浅色" aria-label="切换主题"></button>
  <a class="iks-btn" href="http://127.0.0.1:48911/memory_browser" target="_blank">Ikaros Control</a>
  <button class="btn success" id="btnStartAll">全部启动</button>
  <button class="btn" id="btnStopAll">全部停止</button>
  <button class="btn" id="btnReset">重置布局</button>
  <button class="btn danger" id="btnShutdown">关闭面板</button>
</div>

<div class="main">
  <div class="grid-col">
    <div class="grid-header">
      组件
      <span class="summary" id="summary">-</span>
      <span class="spacer"></span>
      <span class="hint">拖拽卡片移动 · 右下角缩放</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="side">
    <div class="dash-strip">
      <div class="affect-card" style="--gi:0">
        <div class="card-title">情感 (PAD)</div>
        <div id="affectPanel">
          <div class="affect-row"><span class="affect-label">愉悦</span><div class="affect-track"><div class="affect-fill P" id="barP" style="width:50%"></div></div><span class="affect-value" id="valP">-</span></div>
          <div class="affect-row"><span class="affect-label">唤醒</span><div class="affect-track"><div class="affect-fill A" id="barA" style="width:50%"></div></div><span class="affect-value" id="valA">-</span></div>
          <div class="affect-row"><span class="affect-label">支配</span><div class="affect-track"><div class="affect-fill D" id="barD" style="width:50%"></div></div><span class="affect-value" id="valD">-</span></div>
        </div>
      </div>
      <div class="vitality-card" style="--gi:1">
        <div class="card-title">生命活力</div>
        <div class="vitality-row">
          <span class="vitality-label">V5 活力</span>
          <div class="vitality-track"><div class="vitality-fill" id="barV" style="width:0%"></div></div>
          <span class="vitality-num" id="valV">-</span>
        </div>
      </div>

      <div class="memory-panel" id="memPanel">
        <div class="mem-head">
          <span class="mem-title-text">V5 记忆</span>
          <span class="mem-live"><span class="mem-live-dot"></span>实时</span>
        </div>
        <div class="mem-hero">
          <span class="mem-hero-num" id="memTotal">0</span>
          <span class="mem-hero-label">条记忆沉淀</span>
        </div>
        <div class="mem-subline">
          <span>长期记忆 <b id="memLongterm">0</b></span>
          <span class="mem-dot-sep">·</span>
          <span>平均权重 <b id="memAvgWeight">0.00</b></span>
        </div>
        <div class="mem-section-label">记忆类型分布</div>
        <div class="mem-types" id="memTypes"></div>
        <div class="mem-grid">
          <div class="mem-tile"><div class="mem-tile-num" id="memEntities">0</div><div class="mem-tile-label">实体节点</div></div>
          <div class="mem-tile"><div class="mem-tile-num" id="memEdges">0</div><div class="mem-tile-label">关系边</div></div>
          <div class="mem-tile"><div class="mem-tile-num" id="memEpisodic">0</div><div class="mem-tile-label">情景记忆</div></div>
          <div class="mem-tile"><div class="mem-tile-num" id="memActive">0</div><div class="mem-tile-label">激活中</div></div>
        </div>
      </div>
    </div>

    <div class="monologue-card">
      <div class="card-title">内心独白</div>
      <div class="monologue-empty" id="monoEmpty">暂无</div>
      <div class="monologue-text" id="monoText" style="display:none"></div>
      <div class="monologue-meta" id="monoMeta" style="display:none"></div>
    </div>

    <div class="stream-wrap">
      <div class="stream-header">实时事件流</div>
      <div class="stream" id="stream">
        <div class="stream-empty" id="emptyMsg">
          <span class="icon">🪶</span>
          等待伊卡洛斯的消息...
        </div>
      </div>
    </div>
  </div>
</div>

<div class="status-bar">
  <div class="thinking" id="thinking"><span>思考中</span><span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span></div>
  <span id="statusText">就绪</span>
  <span class="event-count" id="eventCount">0 事件</span>
</div>

</div>

<script>
(function(){
'use strict';

function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(ts) { var d=new Date(ts*1000); return d.toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function fmtAffect(val) { if(val==null)return'-'; return (val>=0?'+':'')+(val*100).toFixed(0)+'%'; }
function affectWidth(val) { if(val==null)return 50; return Math.round((val+1)*50); }
function clamp(v,min,max) { return Math.max(min,Math.min(max,v)); }

/* ── 主题切换 (localStorage 记忆) ── */
(function themeInit(){
  var saved = localStorage.getItem('ikaros-control-theme');
  if(saved==='light') document.documentElement.setAttribute('data-theme','light');
  var btn=document.getElementById('themeToggle');
  if(btn) btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=cur==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme', next==='dark'?null:'light');
    localStorage.setItem('ikaros-control-theme', next);
  });
})();

var FEATURED = { control_panel:1, local_model:1, memory:1, neko_group:1, neko:1, hermes_dashboard:1, conversation_tree:1, herdr:1 };

var grid=document.getElementById('grid');
var connDot=document.getElementById('connDot');
var connLabel=document.getElementById('connLabel');
var summaryEl=document.getElementById('summary');
var cardEls={}, busy=new Set(), LS_KEY='ikaros-control-layout';

function loadOrder() { try{return JSON.parse(localStorage.getItem(LS_KEY))||[]}catch(_){return[]} }
function saveOrder(o) { localStorage.setItem(LS_KEY, JSON.stringify(o)); }
var SIZE_KEY='ikaros-control-sizes';
function loadSizes() { try{return JSON.parse(localStorage.getItem(SIZE_KEY))||{}}catch(_){return{}} }
function saveSizes(s) { localStorage.setItem(SIZE_KEY, JSON.stringify(s)); }
function saveLayout(id, rect) { var s=loadSizes(); s[id]=rect; saveSizes(s); }

/* 默认打包布局 (12 栏 shelf 算法) —— 仅在无持久化时用作初始停靠位置 */
function computeDefaults(ids) {
  var pad=8, gap=14, cols=12, rowH=116;
  var cw = Math.max(120, grid.clientWidth - pad*2);
  var colW = (cw - (cols-1)*gap) / cols;
  if(colW < 48) colW = 48;
  var map={}, cursorX=pad, rowTop=pad, rowH_max=0;
  function spanOf(id){ return FEATURED[id] ? {c:8,r:2} : {c:4,r:1}; }
  ids.forEach(function(id){
    var sp=spanOf(id);
    var w=Math.round(sp.c*colW + (sp.c-1)*gap);
    var h=Math.round(sp.r*rowH + (sp.r-1)*gap);
    var right=cursorX+w;
    if(cursorX>pad && right > pad+cw+1){ cursorX=pad; rowTop += rowH_max+gap; rowH_max=0; right=cursorX+w; }
    map[id]={x:Math.round(cursorX), y:Math.round(rowTop), w:w, h:h};
    cursorX += w+gap; rowH_max=Math.max(rowH_max, h);
  });
  var maxBottom=pad; ids.forEach(function(id){ var p=map[id]; maxBottom=Math.max(maxBottom, p.y+p.h); });
  grid.style.minHeight=(maxBottom+pad)+'px';
  return map;
}

function applyLayout(el, id, defaults) {
  var saved=loadSizes()[id];
  var p=saved||(defaults&&defaults[id]); if(!p)return;
  el.style.left=p.x+'px'; el.style.top=p.y+'px';
  el.style.width=p.w+'px'; el.style.height=p.h+'px';
}
function connOn() { connDot.className='conn-dot on'; connLabel.textContent='已连接'; }
function connOff() { connDot.className='conn-dot off'; connLabel.textContent='重连中...'; }

async function initGrid() {
  var list;
  try { list = await fetch('/api/components').then(function(r){return r.json()}); } catch(_) { connOff(); grid.innerHTML='<div class="stream-empty">无法连接</div>'; return; }
  var meta={}; list.forEach(function(c){meta[c.id]=c});
  var order=loadOrder().filter(function(id){return meta[id]});
  list.forEach(function(c){if(order.indexOf(c.id)<0)order.push(c.id)});
  grid.innerHTML=''; cardEls={};
  var defaults=computeDefaults(order);
  order.forEach(function(id, idx){
    var el=buildCard(meta[id]);
    el.style.setProperty('--i', idx);
    if(FEATURED[id]) el.classList.add('featured');
    applyLayout(el, id, defaults);
    cardEls[id]=el; grid.appendChild(el);
    if(id==='herdr') attachHerdrPanel(el);
  });
  refreshStatuses(); setInterval(refreshStatuses,2000);
}

function buildCard(c) {
  var el=document.createElement('div'); el.className='comp'; el.id='card-'+c.id; el.dataset.id=c.id;
  el.innerHTML='<div class="comp-head"><span class="comp-dot" id="dot-'+c.id+'"></span><span class="comp-name">'+esc(c.name)+'</span><span class="comp-cat">'+esc(c.category)+'</span></div><div class="comp-desc">'+esc(c.desc)+'</div><div class="comp-ports" id="ports-'+c.id+'"></div><div class="comp-detail" id="detail-'+c.id+'"></div><div class="comp-actions"><button class="btn start" data-act="start">启动</button><button class="btn stop" data-act="stop">停止</button><button class="btn restart" data-act="restart">重启</button></div>'+(c.id==='hermes_dashboard'?'<div class="hermes-patch" id="hermes-patch-'+c.id+'"></div><div class="comp-actions hermes-extra"><button class="btn" id="hermes-check-'+c.id+'">检查补丁</button><button class="btn warn" id="hermes-update-'+c.id+'">更新并打补丁</button></div>':'') ;
  el.insertAdjacentHTML('beforeend','<div class="comp-resize" id="resize-'+c.id+'" title="拖拽缩放"></div>');
  el.querySelectorAll('button[data-act]').forEach(function(b){ b.addEventListener('click',function(e){ e.stopPropagation(); doAction(c.id, b.dataset.act); }); });
  if(c.id==='hermes_dashboard'){
    var _hc=el.querySelector('#hermes-check-'+c.id); if(_hc)_hc.addEventListener('click', hermesCheck);
    var _hu=el.querySelector('#hermes-update-'+c.id); if(_hu)_hu.addEventListener('click', hermesUpdate);
  }
  el.draggable=false;
  // ── 自由拖拽停靠 ──
  el.addEventListener('pointerdown',function(e){
    if(e.target.closest('.comp-resize')) return;
    if(e.target.closest('button, a, select, input')) return;
    if(e.button!==0) return;
    e.preventDefault();
    el.classList.add('moving'); el.style.zIndex=50;
    var startX=e.clientX, startY=e.clientY;
    var ox=parseFloat(el.style.left)||0, oy=parseFloat(el.style.top)||0;
    function move(ev){
      el.style.left=Math.max(0, ox+(ev.clientX-startX))+'px';
      el.style.top=Math.max(0, oy+(ev.clientY-startY))+'px';
    }
    function up(){
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      el.classList.remove('moving'); el.style.zIndex='';
      saveLayout(c.id,{x:parseFloat(el.style.left)||0, y:parseFloat(el.style.top)||0,
        w:parseFloat(el.style.width)||el.offsetWidth, h:parseFloat(el.style.height)||el.offsetHeight});
    }
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  });
  // ── 无级缩放 ──
  var handle=el.querySelector('#resize-'+c.id);
  if(handle){
    handle.addEventListener('pointerdown',function(e){
      e.preventDefault(); e.stopPropagation();
      el.classList.add('resizing'); el.style.zIndex=50;
      var startX=e.clientX, startY=e.clientY;
      var ow=parseFloat(el.style.width)||el.offsetWidth, oh=parseFloat(el.style.height)||el.offsetHeight;
      function move(ev){
        el.style.width=Math.max(160, ow+(ev.clientX-startX))+'px';
        el.style.height=Math.max(110, oh+(ev.clientY-startY))+'px';
      }
      function up(){
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        el.classList.remove('resizing'); el.style.zIndex='';
        saveLayout(c.id,{x:parseFloat(el.style.left)||0, y:parseFloat(el.style.top)||0,
          w:parseFloat(el.style.width)||ow, h:parseFloat(el.style.height)||oh});
      }
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
    });
  }
  return el;
}

async function refreshStatuses() {
  var list;
  try { list = await fetch('/api/components').then(function(r){return r.json()}); } catch(_) { connOff(); return; }
  connOn(); var running=0;
  list.forEach(function(c){ if(c.running)running++; updateCard(c); });
  summaryEl.textContent=running+' / '+list.length+' 运行中';
}

function updateCard(c) {
  var dot=document.getElementById('dot-'+c.id); if(dot)dot.className='comp-dot '+(c.running?'on':'off');
  var detail=document.getElementById('detail-'+c.id); if(detail)detail.textContent=c.detail||'';
  var ports=document.getElementById('ports-'+c.id);
  if(ports){ if(c.ports&&c.ports.length)ports.innerHTML=c.ports.map(function(p){return'<span class="chip '+(c.ports_up&&c.ports_up.indexOf(p)>=0?'on':'off')+'">:'+p+'</span>'}).join(''); else ports.innerHTML=''; }
  var card=document.getElementById('card-'+c.id); if(!card)return;
  var isBusy=busy.has(c.id); card.classList.toggle('pending',isBusy); card.querySelectorAll('button').forEach(function(b){b.disabled=isBusy});
  if(c.id==='hermes_dashboard' && c.hermes_patch) updateHermesPatch(c);
}

async function doAction(id,act) {
  busy.add(id); updateCard({id:id,running:false,detail:'操作中...',ports:[],ports_up:[]});
  try{await fetch('/api/components/'+id+'/'+act,{method:'POST'})}catch(_){}
  setTimeout(function(){ busy.delete(id); refreshStatuses(); },12000);
}

function updateHermesPatch(c) {
  var box=document.getElementById('hermes-patch-'+c.id);
  if(!box||!c.hermes_patch)return;
  var p=c.hermes_patch;
  var ver=p.head?('HEAD '+p.head):'?';
  var up=p.upstream_tip?('上游 '+p.upstream_tip):'?';
  var badge = p.patch_applied===true ? '<span class="hp-badge ok">补丁已打</span>'
           : p.patch_applied===false ? '<span class="hp-badge bad">补丁缺失</span>'
           : '<span class="hp-badge warn">未知</span>';
  var dirty = p.dirty? ' <span class="hp-badge warn">有未跟踪改动</span>':'';
  box.innerHTML='<div class="hp-line">版本 '+esc(ver)+' / '+esc(up)+' '+badge+dirty+'</div>'
              +'<div class="hp-detail">'+esc(p.detail||'')+'</div>';
}
async function hermesCheck() {
  var box=document.getElementById('hermes-patch-hermes_dashboard');
  if(box)box.innerHTML='<div class="hp-detail">检查中…</div>';
  try{
    var r=await fetch('/api/hermes/check',{method:'POST'});
    var j=await r.json();
    if(box)box.innerHTML='<div class="hp-detail">'+(j.ok?('✓ '+esc(j.msg)):('✗ '+esc(j.msg)))+'</div>';
    setTimeout(refreshStatuses,1500);
  }catch(e){ if(box)box.innerHTML='<div class="hp-detail">请求失败</div>'; }
}
async function hermesUpdate() {
  var box=document.getElementById('hermes-patch-hermes_dashboard');
  if(box)box.innerHTML='<div class="hp-detail">更新并打补丁中（可能需数十秒）…</div>';
  try{
    var r=await fetch('/api/hermes/update',{method:'POST'});
    var j=await r.json();
    var msg=(j.msg||'').toString().slice(-600);
    if(box)box.innerHTML='<div class="hp-detail">'+(j.ok?'✓ 完成':'✗ 失败')+'<pre>'+esc(msg)+'</pre></div>';
    setTimeout(refreshStatuses,2500);
  }catch(e){ if(box)box.innerHTML='<div class="hp-detail">请求失败</div>'; }
}

async function systemAction(act) {
  try{await fetch('/api/system/'+act,{method:'POST'})}catch(_){}
  Object.keys(cardEls).forEach(function(id){busy.add(id)});
  summaryEl.textContent=(act==='start'?'启动中...':'停止中...');
  setTimeout(function(){ busy.clear(); refreshStatuses(); },12000);
}

async function shutdownPanel() {
  if(!confirm('关闭控制面板？组件不会被停止。'))return;
  try{await fetch('/api/shutdown',{method:'POST'})}catch(_){}
  document.body.innerHTML='<div class="shutdown-msg">控制面板已关闭。</div>';
}

var dragId=null; // 已弃用

document.getElementById('btnStartAll').addEventListener('click',function(){systemAction('start')});
document.getElementById('btnStopAll').addEventListener('click',function(){systemAction('stop')});
document.getElementById('btnReset').addEventListener('click',function(){localStorage.removeItem(LS_KEY);localStorage.removeItem(SIZE_KEY);grid.style.minHeight='';location.reload()});
document.getElementById('btnShutdown').addEventListener('click',shutdownPanel);

var stream=document.getElementById('stream'), emptyMsg=document.getElementById('emptyMsg');
var statusText=document.getElementById('statusText'), thinkingEl=document.getElementById('thinking'), eventCount=document.getElementById('eventCount');
var barP=document.getElementById('barP'),barA=document.getElementById('barA'),barD=document.getElementById('barD');
var valP=document.getElementById('valP'),valA=document.getElementById('valA'),valD=document.getElementById('valD');
var barV=document.getElementById('barV'),valV=document.getElementById('valV');
var monoText=document.getElementById('monoText'),monoEmpty=document.getElementById('monoEmpty'),monoMeta=document.getElementById('monoMeta');
var msgCount=0,lastThoughtTs=0;

function addMessage(entry) {
  var dk=entry.display_kind||entry.kind||'other', text=entry.text||'', ts=entry.ts||Date.now()/1000, mood=entry.mood||'';
  emptyMsg.style.display='none';
  var el=document.createElement('div'), kindClass=['user_msg','assistant_msg','thought'].indexOf(dk)>=0?dk:'other';
  el.className='msg msg-'+kindClass;
  var label=dk; if(dk==='user_msg')label='用户'; else if(dk==='assistant_msg')label='伊卡洛斯'; else if(dk==='thought')label='内心';
  var moodHtml=mood?'<span class="mood-tag">'+esc(mood)+'</span>':'';
  el.innerHTML='<div class="head"><span class="label">'+label+'</span><span class="time">'+fmtTime(ts)+'</span></div><div class="body">'+esc(text||'...')+moodHtml+'</div>';
  stream.appendChild(el); stream.scrollTop=stream.scrollHeight;
  msgCount++; eventCount.textContent=msgCount+' 事件';
  if(dk==='thought'&&text&&ts>lastThoughtTs){lastThoughtTs=ts;updateMonologue(entry);}
  if(dk==='user_msg'){thinkingEl.classList.add('active');statusText.textContent='思考中...';}
  else if(dk==='assistant_msg'){thinkingEl.classList.remove('active');statusText.textContent='就绪';}
}

function updateAffect(state) { var a=state&&state.affect; if(!a)return; var p=a.pleasure,ar=a.arousal,d=a.dominance; barP.style.width=affectWidth(p)+'%';barA.style.width=affectWidth(ar)+'%';barD.style.width=affectWidth(d)+'%'; valP.textContent=fmtAffect(p);valA.textContent=fmtAffect(ar);valD.textContent=fmtAffect(d); }
function updateVitality(state) { var v=null; if(state&&state.thought&&state.thought.vitality!=null)v=state.thought.vitality; else if(state&&state.affect&&state.affect.vitality!=null)v=state.affect.vitality; if(v!=null){var pct=clamp(Math.round(v*100),0,100);barV.style.width=pct+'%';valV.textContent=pct+'%';} else{barV.style.width='0%';valV.textContent='-';} }
function updateMonologue(entry) { var text=entry.text||''; if(!text)return; monoEmpty.style.display='none';monoText.style.display='block';monoMeta.style.display='flex'; monoText.textContent=text; var mp=[]; if(entry.intensity!=null)mp.push('强度:'+entry.intensity.toFixed(2)); if(entry.mood)mp.push(entry.mood); if(entry.ts)mp.push(fmtTime(entry.ts)); monoMeta.innerHTML=mp.join(' \u00b7 '); }
var TYPE_LABELS = { philosophy:'哲学', lesson:'教训', fact:'事实', identity:'自我认知', inner_monologue:'内心独白', conversation:'对话', reference:'参考', thought_marker:'思考标记', activity_reflection:'活动反思', emotional_event:'情绪事件', self_reflection:'自我反思', self_discovery:'自我发现', narrative:'叙事', emotion_label:'情绪标签', dissonance:'认知失调', test:'测试', decision:'决策', audit:'审计', milestone:'里程碑', repair_test:'修复测试', technological_discovery:'技术发现' };
var _numCache = {};
var DEMO_STATE = {
  memory:{ total:3604, long_term:1203, avg_weight:0.62,
    by_type:{ philosophy:1109, lesson:426, fact:425, identity:371, inner_monologue:368, conversation:331, reference:155, thought_marker:70, activity_reflection:64, emotional_event:60, self_reflection:58, self_discovery:57, narrative:49 } },
  entity_graph:{ entities:312, edges:540, episodic_memories:88, active_memories:12 }
};
var _memBooted=false;
function memoryBootFallback(){ if(_memBooted)return; _memBooted=true; applyMemory(DEMO_STATE); setInterval(function(){applyMemory(DEMO_STATE);},3000); }
function fmtInt(n){ return Number(n||0).toLocaleString('en-US'); }
function tickTo(id, to){
  var el=document.getElementById(id); if(!el)return;
  var from=_numCache[id]||0; to=Number(to)||0; _numCache[id]=to;
  if(from===to){ el.textContent=fmtInt(to); return; }
  var dur=650, start=null;
  function step(now){ if(start===null)start=now; var t=Math.min(1,(now-start)/dur); var e=1-Math.pow(1-t,3); el.textContent=fmtInt(Math.round(from+(to-from)*e)); if(t<1)requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
function renderTypeBars(byType){
  var box=document.getElementById('memTypes'); if(!box)return;
  var entries=Object.keys(byType||{}).map(function(k){ var v=byType[k]; return [k, (v&&typeof v==='object')?(v.count||0):(v||0)]; });
  entries.sort(function(a,b){return b[1]-a[1];}); entries=entries.slice(0,6);
  if(!entries.length){ box.innerHTML='<div class="mem-type-val" style="color:var(--muted)">暂无数据</div>'; return; }
  var max=entries[0][1]||1;
  box.innerHTML = entries.map(function(e,i){
    var pct=Math.max(4, Math.round(e[1]/max*100));
    var label=TYPE_LABELS[e[0]]||e[0];
    return '<div class="mem-type"><div class="mem-type-top"><span class="mem-type-name">'+esc(label)+'</span><span class="mem-type-val">'+fmtInt(e[1])+'</span></div><div class="mem-type-track"><div class="mem-type-fill t'+(i%6)+'" data-w="'+pct+'"></div></div></div>';
  }).join('');
  requestAnimationFrame(function(){ box.querySelectorAll('.mem-type-fill').forEach(function(f){ f.style.transform='scaleX('+(f.getAttribute('data-w')/100)+')'; }); });
}
var _memSig=null;
function applyMemory(state){
  if((!state||(!state.memory&&!state.entity_graph)) && /\bdemo\b/.test(location.search)) state=DEMO_STATE;
  if(!state) return;
  var m=state.memory||{}, eg=state.entity_graph||{};
  tickTo('memTotal', m.total||0);
  tickTo('memLongterm', m.long_term||0);
  var aw=document.getElementById('memAvgWeight'); if(aw)aw.textContent=(m.avg_weight!=null)?Number(m.avg_weight).toFixed(2):'—';
  var sig=JSON.stringify(m.by_type||{});
  if(sig!==_memSig){ _memSig=sig; renderTypeBars(m.by_type); }
  tickTo('memEntities', eg.entities||0);
  tickTo('memEdges', eg.edges||0);
  tickTo('memEpisodic', eg.episodic_memories||0);
  tickTo('memActive', eg.active_memories||0);
}
function updateMemory(state){ applyMemory(state); }
function loadInitial() { fetch('/api/state').then(function(r){return r.json()}).then(function(s){ updateAffect(s);updateVitality(s);updateMemory(s); if(s.thought&&s.thought.text)updateMonologue({text:s.thought.text,intensity:s.thought.intensity,mood:s.thought.mood,ts:s.thought.created||s.thought.ts}); }).catch(function(){ memoryBootFallback(); }); fetch('/api/log').then(function(r){return r.json()}).then(function(events){if(events&&events.length)events.forEach(addMessage)}).catch(function(){}); }
function connectSSE() { var evt=new EventSource('/api/events'); evt.addEventListener('connected',function(){connDot.className='conn-dot on';connLabel.textContent='已连接';}); evt.addEventListener('monitor',function(e){try{addMessage(JSON.parse(e.data))}catch(_){}}); evt.onerror=function(){connDot.className='conn-dot off';connLabel.textContent='重连中...';evt.close();setTimeout(connectSSE,3000);}; }

/* ── herdr 监督卡片 (B5) ─────────────────────────────────────── */
var CT_API = 'http://127.0.0.1:48920';
var herdrTasks = {};
var herdrES = null;

var HERDR_BODY_HTML =
  '<div class="herdr-extra">'
  + '<div class="herdr-sec-title">监督任务</div>'
  + '<div class="herdr-tasks" id="herdr-tasks"><div class="herdr-empty">暂无活跃监督任务</div></div>'
  + '<div class="herdr-sec-title">发起任务批次</div>'
  + '<div class="herdr-form">'
  + '<input class="herdr-in" id="herdr-node" placeholder="节点 id（对接话树节点）" />'
  + '<select class="herdr-in" id="herdr-kind">'
  + '<option value="aider">aider</option><option value="claude">claude</option>'
  + '<option value="codex">codex</option><option value="cursor">cursor</option>'
  + '<option value="hermes">hermes</option><option value="opencode">opencode</option>'
  + '<option value="gemini">gemini</option></select>'
  + '<input class="herdr-in" id="herdr-cwd" placeholder="仓库目录 cwd（可选）" />'
  + '<textarea class="herdr-in" id="herdr-task" placeholder="下发给 coding agent 的自然语言任务"></textarea>'
  + '<button class="btn start" id="herdr-run">发起</button>'
  + '</div></div>';

function herdrStateBadge(s){var m={pending:'待命',working:'运行中',blocked:'待批准',done:'完成',idle:'空闲',unknown:'未知'};return m[s]||s||'-';}
function herdrStateClass(s){return 'hstate hstate-'+(s||'unknown');}

function renderHerdrTasks(){
  var box=document.getElementById('herdr-tasks'); if(!box)return;
  var ids=Object.keys(herdrTasks);
  if(!ids.length){box.innerHTML='<div class="herdr-empty">暂无活跃监督任务</div>';return;}
  box.innerHTML=ids.map(function(nid){
    var t=herdrTasks[nid];
    var blocked=(t.exec_state==='blocked');
    var pct=Math.round((t.exec_progress||0)*100);
    var act=blocked?'<div class="ht-actions"><button class="btn approve" data-node="'+esc(nid)+'">批准</button></div>':'';
    return '<div class="herdr-task '+herdrStateClass(t.exec_state)+'">'
      +'<div class="ht-head"><span class="ht-node">'+esc(nid)+'</span>'
      +'<span class="ht-badge">'+herdrStateBadge(t.exec_state)+'</span></div>'
      +'<div class="ht-detail">'+esc(t.exec_detail||'')+'</div>'
      +'<div class="ht-track"><div class="ht-fill" style="width:'+pct+'%"></div></div>'
      +act+'</div>';
  }).join('');
  box.querySelectorAll('button.approve').forEach(function(b){b.addEventListener('click',function(){herdrOpenApprove(b.getAttribute('data-node'));});});
}

function herdrApply(ev){
  if(!ev||ev.type!=='node.exec_state_changed')return;
  var d=ev.data||{}; var nid=d.node_id; if(!nid)return;
  var st=d.exec_state;
  if(st==='idle'){ delete herdrTasks[nid]; }
  else { herdrTasks[nid]={exec_state:st,exec_detail:d.detail,exec_progress:d.progress}; }
  renderHerdrTasks();
}

function herdrOpenApprove(nid){
  var t=herdrTasks[nid]||{};
  var promptTxt='代理提问：\n'+(t.exec_detail||'');
  var decision=window.prompt('节点 '+nid+' 等待批准。\n\n'+promptTxt+'\n\n请输入批准决策（回车=同意继续）：','继续');
  if(decision===null)return;
  fetch(CT_API+'/api/supervisor/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node_id:nid,decision:decision})})
    .then(function(r){return r.json();})
    .then(function(j){ if(!j.ok) window.alert('批准失败: '+(j.error||'')); })
    .catch(function(e){ window.alert('批准请求失败: '+e); });
}

function herdrConnect(){
  try{
    herdrES=new EventSource(CT_API+'/api/events');
    herdrES.onmessage=function(e){ try{herdrApply(JSON.parse(e.data));}catch(_){} };
    herdrES.onerror=function(){};
  }catch(_){}
  fetch(CT_API+'/api/state').then(function(r){return r.json();}).then(function(s){
    var nodes=s.nodes||[];
    nodes.forEach(function(n){
      if(n.exec_state && n.exec_state!=='idle' && !herdrTasks[n.id]){
        herdrTasks[n.id]={exec_state:n.exec_state,exec_detail:n.exec_detail,exec_progress:n.exec_progress};
      }
    });
    renderHerdrTasks();
  }).catch(function(){});
}

function herdrRunTask(){
  var nid=document.getElementById('herdr-node').value.trim();
  var kind=document.getElementById('herdr-kind').value;
  var cwd=document.getElementById('herdr-cwd').value.trim();
  var task=document.getElementById('herdr-task').value.trim();
  if(!nid||!task){ window.alert('请填写节点 id 与任务'); return; }
  fetch(CT_API+'/api/supervisor/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node_id:nid,kind:kind,cwd:cwd||null,task:task})})
    .then(function(r){return r.json();})
    .then(function(j){ if(!j.ok) window.alert('发起失败: '+(j.error||'')); else { document.getElementById('herdr-task').value=''; } })
    .catch(function(e){ window.alert('发起失败: '+e); });
}

function attachHerdrPanel(el){
  if(el.querySelector('.herdr-extra'))return;
  el.insertAdjacentHTML('beforeend', HERDR_BODY_HTML);
  var run=el.querySelector('#herdr-run');
  if(run)run.addEventListener('click',herdrRunTask);
  herdrConnect();
}

initGrid(); loadInitial(); connectSSE();
if(/\bdemo\b/.test(location.search)){ memoryBootFallback(); }
setInterval(function(){ fetch('/api/state').then(function(r){return r.json()}).then(function(s){ updateAffect(s);updateVitality(s);updateMemory(s); if(s.thought&&s.thought.text){var t=s.thought;if((t.created||t.ts||0)>=lastThoughtTs)updateMonologue({text:t.text,intensity:t.intensity,mood:t.mood,ts:t.created||t.ts});} }).catch(function(){ memoryBootFallback(); }); },3000);

})();
</script>
