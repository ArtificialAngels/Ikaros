/* ===== Theme: 跟随系统 / Dark / Warm / Midnight / Forest + 自定义强调色 ===== */
const THEME_KEY='conv-tree-theme';
const ACCENT_KEY='conv-tree-accent';
const THEMES=[
  {id:'system',name:'跟随系统'},
  {id:'dark',name:'Dark'},
  {id:'warm',name:'Warm'},
  {id:'midnight',name:'Midnight'},
  {id:'forest',name:'Forest'},
];
let _themeMql=null,_themePref='dark';
function _getMql(){if(!_themeMql)_themeMql=window.matchMedia('(prefers-color-scheme: dark)');return _themeMql}
function systemTheme(){return _getMql().matches?'dark':'warm'}  // 系统深色→dark, 系统浅色→warm
function applyTheme(pref){
  _themePref=pref;
  try{localStorage.setItem(THEME_KEY,pref)}catch(e){}  // 持久化: 不跟随系统时默认读取此处
  const resolved=pref==='system'?systemTheme():pref;
  document.documentElement.setAttribute('data-theme',resolved);
  document.documentElement.style.colorScheme=resolved==='dark'||resolved==='midnight'||resolved==='forest'?'dark':'light';
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===pref));
  // 恢复自定义强调色（覆盖主题默认 brand）
  let acc=null;try{acc=localStorage.getItem(ACCENT_KEY)}catch(e){}
  if(acc){document.documentElement.style.setProperty('--brand',acc);document.documentElement.style.setProperty('--brand-secondary',acc);}
}
function renderThemeSwitcher(){
  const el=document.getElementById('themeSwitcher');
  el.innerHTML=THEMES.map(t=>`<button class="theme-btn" data-theme="${t.id}" onclick="applyTheme('${t.id}')">${t.name}</button>`).join('');
}
function onSystemThemeChange(){if(_themePref==='system')applyTheme('system')}  // 仅跟随系统时才随系统切换
function switchTheme(t){applyTheme(t)}  // 兼容旧调用
function setAccent(color){
  document.documentElement.style.setProperty('--brand',color);
  document.documentElement.style.setProperty('--brand-secondary',color);
  try{localStorage.setItem(ACCENT_KEY,color)}catch(e){}
  toast('强调色已更新');
}
function resetAccent(){
  document.documentElement.style.removeProperty('--brand');
  document.documentElement.style.removeProperty('--brand-secondary');
  try{localStorage.removeItem(ACCENT_KEY)}catch(e){}
  document.getElementById('accentPicker').value='#13E425';
  toast('强调色已重置');
}
// 立即应用已保存主题(避免初始闪烁) + 注册系统主题监听
(function initTheme(){
  const mql=_getMql();
  if(typeof mql.addEventListener==='function')mql.addEventListener('change',onSystemThemeChange);
  else if(typeof mql.addListener==='function')mql.addListener(onSystemThemeChange);  // 旧 Safari
  let pref=null;try{pref=localStorage.getItem(THEME_KEY)}catch(e){}
  renderThemeSwitcher();
  applyTheme(pref||'dark');  // 无保存记录时默认 dark
  // 强调色选择器初始化
  const ap=document.getElementById('accentPicker');
  if(ap){
    let acc=null;try{acc=localStorage.getItem(ACCENT_KEY)}catch(e){}
    if(acc)ap.value=acc;
    ap.addEventListener('input',()=>setAccent(ap.value));
  }
})();

/* Streaming animations (from reference) */
const style=document.createElement('style');
style.textContent=`
@keyframes spin{0%{transform:rotate(0deg)}to{transform:rotate(1turn)}}
@keyframes dotFlashing{0%{background-color:var(--text-tertiary)}50%,to{background-color:var(--brand-opposite)}}
@keyframes highlight-fade{0%{background-color:transparent;color:inherit}10%{background-color:rgba(19,228,37,.3);color:var(--brand)}80%{background-color:rgba(19,228,37,.3);color:var(--brand)}to{background-color:transparent;color:inherit}}
.streaming-border-effect{position:relative}
.streaming-border-effect:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;padding:2px;
background:conic-gradient(from 0deg,transparent 30%,var(--text-primary) 40%,var(--text-primary) 60%,transparent 70%);
-webkit-mask:linear-gradient(var(--text-primary) 0 0) content-box,linear-gradient(var(--text-primary) 0 0);
-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3s linear infinite;pointer-events:none}
.streaming-border-effect.favorite:before{background:conic-gradient(from 0deg,transparent 30%,var(--brand) 40%,var(--brand) 60%,transparent 70%)}
.highlight-text-flash{animation:highlight-fade 3s ease-in-out;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.dot-flashing{display:inline-flex;gap:4px;padding:4px 0}
.dot-flashing span{width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);animation:dotFlashing 1s linear infinite alternate}
.dot-flashing span:nth-child(2){animation-delay:.5s}.dot-flashing span:nth-child(3){animation-delay:1s}

/* ── B2: 执行状态徽标 (herdr exec_state 内化) ── */
.exec-state-wrap{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.exec-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;line-height:1.5}
.badge-idle{display:none}
.badge-pending{background:rgba(120,120,120,.18);color:var(--text-secondary)}
.badge-working{background:rgba(19,228,37,.18);color:var(--brand);animation:pulseBadge 1.2s ease-in-out infinite}
.badge-blocked{background:rgba(245,158,11,.22);color:#f59e0b}
.badge-done{background:rgba(19,228,37,.14);color:var(--brand)}
.badge-unknown{background:rgba(120,120,120,.18);color:var(--text-secondary)}
@keyframes pulseBadge{0%,100%{opacity:1}50%{opacity:.4}}
.exec-progress{height:4px;border-radius:3px;background:rgba(120,120,120,.22);overflow:hidden}
.exec-progress-fill{height:100%;border-radius:3px;background:var(--brand);transition:width .25s ease}
.exec-detail{font-size:9px;color:var(--text-tertiary);opacity:.85;word-break:break-word}

/* ── 模型选择 (2026-08-03): 自定义圆角下拉, 照搬 explore.poker 的 rounded-2xl + shadow-card 风格 ── */
.model-picker{margin-left:8px;max-width:260px;padding:3px 10px;font-size:10.5px;color:var(--text-secondary);
  background:var(--bg-floating);border:1.5px solid var(--border-std);border-radius:var(--radius-sm);cursor:pointer;
  outline:none;transition:border-color .2s var(--ease-out),box-shadow .2s var(--ease-out);font-family:inherit;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-picker:hover{border-color:var(--brand);box-shadow:0 0 10px rgba(19,228,37,.15)}
.model-picker:focus-visible{border-color:var(--brand);box-shadow:0 0 0 2px rgba(19,228,37,.10)}
/* 遮罩: 点击关闭, 淡入 */
.model-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250;
  opacity:0;transition:opacity .2s ease-in-out}
.model-overlay.show{opacity:1}
/* 面板: 统一到面板弹层语言 (ctx-menu/modal 同款 1.5px 边框 + radius-md + 同阴影), scale/opacity 显隐动画 */
.model-dropdown{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);
  width:320px;max-width:90vw;background:var(--bg-floating);color:var(--text-primary);
  border:1.5px solid var(--border-std);border-radius:var(--radius-md);overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:251;
  opacity:0;transition:opacity .2s ease-in-out,transform .2s ease-in-out;
  font-family:inherit}
.model-dropdown.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.model-dropdown-head{padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-secondary);
  border-bottom:1px solid var(--border-divider);background:var(--bg-btn)}
.model-dropdown-body{max-height:384px;overflow-y:auto;padding:6px}
.model-dropdown-item{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 12px;font-size:12.5px;color:var(--text-primary);border-radius:var(--radius-sm);
  cursor:pointer;transition:background .12s ease;min-width:0}
.model-dropdown-item:hover{background:var(--bg-item-hover)}
.model-dropdown-item.active{background:rgba(19,228,37,.12);color:var(--brand)}
.model-dd-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-dd-ctx{font-size:10px;color:var(--text-tertiary);flex-shrink:0}

/* ═══ 特效层 v3.1: 卡片过度用 transition (照搬 explore.poker, 无无限浮动) ═══ */
/* 粒子 canvas 层 (48920 新增) */
#fx-canvas-ct{position:fixed;inset:0;pointer-events:none;z-index:9998}

/* 消息入场动画 */
@keyframes msgSlideUp{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.turn .bubble-wrap,.turn .ai-card,.turn .ai-extras{animation:msgSlideUp .32s var(--ease-out, cubic-bezier(.22,1,.36,1)) both}
.turn .ai-card{animation-delay:.04s}
.turn .ai-extras{animation-delay:.08s}

/* 流式生成中的 AI 卡: 微妙呼吸 + 顶部高光流动 */
.ai-card.answer-live::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--brand),transparent);background-size:200% 100%;
  animation:liveSweep 2.2s linear infinite;pointer-events:none}
.ai-card.answer-live{box-shadow:0 0 0 1px rgba(19,228,37,.15),0 8px 32px rgba(0,0,0,.5),0 0 28px rgba(19,228,37,.10)}
@keyframes liveSweep{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── 卡片 hover: 纯 transition (退场平滑跟随, 不用 animation) ── */
/* (悬浮 lift + 阴影聚焦已在 .ai-card / .node-card 主定义里用 transition:transform 处理,
   鼠标离开时缓动回原样, 无闪烁。此处不再注入无限浮动 animation。) */

/* 输入区获焦时: 顶部高光流 (类似 streaming sweep)。
   两端缩进到圆角直线段内 (border-radius 14px), 避免条悬在圆角弧线之外 */
.input-wrapper:focus-within::before{content:'';position:absolute;top:-1px;left:13px;right:13px;height:2px;
  background:linear-gradient(90deg,transparent,var(--brand),transparent);
  background-size:200% 100%;animation:liveSweep 3s linear infinite;pointer-events:none;z-index:2}
.input-wrapper{position:relative;overflow:visible}

/* 工具卡片 running 态: 流光边框增强 */
.tool-card.running{border-color:var(--brand);box-shadow:0 0 12px rgba(19,228,37,.12),0 0 0 1px rgba(19,228,37,.08)}
.tool-card.running::after{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--brand),transparent);background-size:200% 100%;
  animation:liveSweep 1.8s linear infinite;pointer-events:none}
.tool-card{position:relative;overflow:hidden}

/* 会话搜索框: 获焦光晕 */
.session-search:focus-within{border-color:var(--brand);box-shadow:0 0 10px rgba(19,228,37,.10)}

/* 代码块: 复制按钮 */
.code-copy-btn{position:absolute;top:6px;right:8px;padding:2px 9px;border:1.5px solid var(--border-std);
  border-radius:5px;background:var(--bg-floating);color:var(--text-tertiary);font-size:10.5px;
  cursor:pointer;opacity:0;transition:opacity .15s,color .15s,border-color .15s;font-family:inherit;z-index:2}
.card-body pre{position:relative}
.card-body pre:hover .code-copy-btn{opacity:1}
.code-copy-btn:hover{color:var(--brand);border-color:var(--brand)}
.code-copy-btn.copied{color:var(--brand);border-color:var(--brand);opacity:1}

/* 按钮涟漪 */
.ripple-ink{position:fixed;border-radius:50%;pointer-events:none;z-index:9997;
  background:radial-gradient(circle,rgba(19,228,37,.28) 0%,transparent 70%);
  transform:scale(0);animation:rippleOut .55s var(--ease-out, cubic-bezier(.22,1,.36,1)) forwards}
@keyframes rippleOut{to{transform:scale(1);opacity:0}}

/* 思考块 details 平滑展开 */
.think-block{transition:border-color .2s}
.think-block .think-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease-out, cubic-bezier(.22,1,.36,1))}
.think-block[open] .think-body{grid-template-rows:1fr}
.think-block .think-body>div{overflow:hidden}
.think-block .think-body>div>div{max-height:340px;overflow-y:auto}

/* 主题切换过渡 */
body,.sidebar,.tree-panel,.main,.ai-card,.bubble-user,.input-wrapper{transition:background .35s var(--ease-out, cubic-bezier(.22,1,.36,1)),color .35s var(--ease-out, cubic-bezier(.22,1,.36,1)),border-color .35s var(--ease-out, cubic-bezier(.22,1,.36,1))}

/* 节点卡片: hover 光晕 + 当前节点呼吸光 (transition 单一来源在 .node-card 主定义, 勿重复) */
.node-card:hover{box-shadow:0 0 24px rgba(19,228,37,.14),var(--shadow-card)}
.node-card.current{animation:nodeBreathe 2.8s ease-in-out infinite}
@keyframes nodeBreathe{0%,100%{box-shadow:0 0 14px rgba(19,228,37,.18)}50%{box-shadow:0 0 30px rgba(19,228,37,.34)}}

/* 会话项 hover 滑动指示条 */
.session-item::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;border-radius:2px;
  background:var(--brand);transform:scaleY(0);transition:transform .18s var(--ease-out, cubic-bezier(.22,1,.36,1))}
.session-item:hover::before{transform:scaleY(1)}
.session-item.active::before{transform:scaleY(1)}

/* 状态栏 token 数字跳动 */
@keyframes numPop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.usage-tokens b{display:inline-block}
.usage-tokens b.pop{animation:numPop .3s var(--ease-out, cubic-bezier(.22,1,.36,1))}
`;
document.head.appendChild(style);

boot();
</script>
