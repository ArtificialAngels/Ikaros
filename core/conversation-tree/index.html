  layer.style.width=w+'px';layer.style.height=h+'px';
  const es=document.getElementById('edgesSvg'),ts=document.getElementById('tempSvg');
  es.setAttribute('width',w);es.setAttribute('height',h);
  es.setAttribute('viewBox','0 0 '+w+' '+h);
  ts.setAttribute('width',w);ts.setAttribute('height',h);
  ts.setAttribute('viewBox','0 0 '+w+' '+h);
  // Node positions (absolute within layer)
  // 先清空旧键 — 折叠/剪枝后消失的节点不能残留位置 (否则 renderNodes 仍会渲染它们)
  Object.keys(nodePositions).forEach(k=>delete nodePositions[k]);
  // x = leaf_x * (NODE_W + H_GAP) + offset (horizontal = sibling spread, left→right)
  // y = depth * V_GAP + offset (vertical = depth, top→bottom)
  Object.keys(pos).forEach(id=>{
    const manual=manualPositions[id];
    nodePositions[id]=manual
      ? {x:manual.x,y:manual.y}
      : {x:pos[id].x*(NODE_W+H_GAP)+NODE_W/2+30, y:pos[id].depth*V_GAP+NODE_H/2+30};
  });
  Object.assign(_subCounts, subCount);
  return {maxX:w, maxY:h};
}

/* ===== Canvas Transform ===== */
function applyTransform(){
  const layer=document.getElementById('canvasLayer');
  layer.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById('zoomInfo').textContent=Math.round(zoom*100)+'%';
  miniUpdateViewport();
}
function screenToCanvas(sx,sy){
  const rect=document.getElementById('canvasWrap').getBoundingClientRect();
  return {x:(sx-rect.left-panX)/zoom, y:(sy-rect.top-panY)/zoom};
}

/* ===== Rendering: Nodes ===== */
function renderNodes(){
  // DOM 复用: 已有节点只更新 style/class/内容 (元素保留 -> transform transition 平滑过渡),
  // 新节点 append 并带 node-enter 入场动画; 消失节点移除
  const layer=document.getElementById('nodesLayer');
  const existing=new Map();
  Array.from(layer.children).forEach(el=>existing.set(el.dataset.id,el));
  const frag=document.createDocumentFragment();
  tree.nodes.forEach(n=>{
    const p=nodePositions[n.id];if(!p)return;
    const isCur=n.id===tree.currentId;
    const isSel=n.id===selectedNode;
    const label=nodeText(n);
    const typeCls=n.nodeType||'trunk';
    const validCls=n.isValid!==false?'is-valid':'';
    // 视觉编码 (借鉴 stello star-map): 深度→尺寸(浅层大), 创建时间→亮度(新亮旧暗)
    const depthScale=Math.max(0.82,1-(n.depth||0)*0.03);
    const age=(n.created_at?Math.max(0,Date.now()/1000-n.created_at):0)/86400; // 天数
    const act=isCur?1:Math.max(0.45,Math.min(1,0.95-age*0.04));
    // 定位走 CSS 变量 -> transform 单一来源, transition 可动画化
    const colCls=`col-${(n.depth||0)%6}`;
    const cls=`node-card ${colCls} ${typeCls} ${validCls} ${isCur?'current':''} ${isSel?'selected':''}`;
    const style=`--nx:${p.x}px;--ny:${p.y}px;--scale:${depthScale};opacity:${act}`;
    let tags='';
    if(!n.isValid)tags+='<span class="node-tag tag-abandoned">abandoned</span>';
    if(n.nodeType==='conclusion')tags+='<span class="node-tag tag-conclusion">conclusion</span>';
    if(n.mergeTarget)tags+='<span class="node-tag tag-merged">merged</span>';
    if(isCur)tags+='<span class="node-tag tag-current">current</span>';
    // 折叠按钮: 有子节点的节点才显示; 折叠态显示 +N (子树内其他节点数)
    const hasKids=n.children&&n.children.some(c=>tree.nodes.has(c));
    const folded=collapsedIds.has(n.id);
    const foldBtn=hasKids?`<div class="node-fold ${folded?'collapsed':''}" title="${folded?'展开子树':'折叠子树'}"
      onmousedown="event.stopPropagation();event.preventDefault();toggleFold('${n.id}')">${folded?'+':'−'}${folded?`<span class="fold-count">${subCountById(n.id)-1}</span>`:''}</div>`:'';
    const inner=`
      ${foldBtn}
      <div class="node-handle target" data-node="${n.id}" data-side="target"
        onmousedown="onHandleMouseDown(event,'${n.id}','target')"></div>
      <div class="node-depth">#${n.depth} · ${n.branchLabel||'main'} · <span class="agent-${n.agent==='hermes'?'hermes':'ikaros'}">${n.agent==='hermes'?'⚙ Hermes':'✦ Ikaros'}</span></div>
      <div class="node-label" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
      ${tags?`<div class="node-tags">${tags}</div>`:''}
      ${execWrap(n)}
      <div class="node-handle source" data-node="${n.id}" data-side="source"
        onmousedown="onHandleMouseDown(event,'${n.id}','source')"></div>`;
    const old=existing.get(n.id);
    if(old){
      if(old.className!==cls)old.className=cls;
      if(old.style.cssText!==style)old.style.cssText=style;
      if(old.innerHTML!==inner)old.innerHTML=inner;
      existing.delete(n.id);
    }else{
      const div=document.createElement('div');
      div.className=cls+' node-enter';
      div.dataset.id=n.id;
      div.style.cssText=style;
      div.innerHTML=inner;
      div.setAttribute('onmousedown',`onNodeMouseDown(event,'${n.id}')`);
      div.setAttribute('oncontextmenu',`onNodeContextMenu(event,'${n.id}')`);
      frag.appendChild(div);
    }
  });
  existing.forEach(el=>el.remove());
  layer.appendChild(frag);
}

function nodeText(n){
  if(n.depth===0)return 'ROOT';
  if(n.meta&&n.meta.title)return n.meta.title;   // 重命名覆盖
  // M1: inline=0 时 messages 可能未内联, 优先用始终存在的 summary 作标签
  if(n.summary&&n.summary.trim()){let s=n.summary;if(s.length>18)s=s.slice(0,18)+'...';return s;}
  const um=(n.messages||[]).find(m=>m.role==='user');
  let s=um?um.content:'turn '+n.depth;
  if(s.length>18)s=s.slice(0,18)+'...';
  if(n.conclusions&&n.conclusions.length){
    s=n.conclusions[0];
    if(s.length>22)s=s.slice(0,22)+'...';
  }
  return s;
}

/* ===== B2: 执行状态徽标 (herdr exec_state 内化) ===== */
const EXEC_LABEL={idle:'idle',pending:'pending',working:'working',blocked:'blocked',done:'done',unknown:'unknown'};
function execInner(n){
  const st=n.execState||'idle';
  let h=`<span class="exec-badge badge-${st}">${EXEC_LABEL[st]||st}</span>`;
  if(st==='working'||st==='blocked'){
    const p=Math.max(0,Math.min(100,(n.execProgress||0)*100));
    h+=`<div class="exec-progress"><div class="exec-progress-fill" style="width:${p}%"></div></div>`;
  }
  if(n.execDetail){h+=`<div class="exec-detail">${escapeHtml(n.execDetail)}</div>`;}
  return h;
}
function execWrap(n){
  const st=n.execState||'idle';
  if(st==='idle')return '';
  return `<div class="exec-state-wrap" data-state="${st}">${execInner(n)}</div>`;
}

/* ===== Rendering: Edges (Bezier) ===== */
function renderEdges(){
  const svg=document.getElementById('edgesSvg');
  let paths='';
  // Parent-child edges (vertical: parent bottom-center → child top-center)
  tree.nodes.forEach(n=>{
    if(!n.parentId)return;
    const sp=nodePositions[n.parentId],tp=nodePositions[n.id];
    if(!sp||!tp)return;
    const startY=sp.y+NODE_H/2, endY=tp.y-NODE_H/2;
    const midY=startY+(endY-startY)*0.4;
    const d=`M${sp.x},${startY} C${sp.x},${midY} ${tp.x},${midY} ${tp.x},${endY}`;
    const m=edgeMidpoint(sp.x,startY,tp.x,endY,midY);
    paths+=edgeGroup(n.parentId,n.id,d,m,'parent',(tree.nodes.get(n.parentId)||{}).depth||0);
  });
  // Merge edges (vertical arc: source bottom-center → target top-center)
  tree.nodes.forEach(n=>{
    if(!n.mergeTarget)return;
    const sp=nodePositions[n.id],tp=nodePositions[n.mergeTarget];
    if(!sp||!tp)return;
    const startY=sp.y+NODE_H/2, endY=tp.y-NODE_H/2;
    const midY=(startY+endY)/2;
    const d=`M${sp.x},${startY} C${sp.x},${midY} ${tp.x},${midY} ${tp.x},${endY}`;
    const m=edgeMidpoint(sp.x,startY,tp.x,endY,midY);
    paths+=edgeGroup(n.id,n.mergeTarget,d,m,'merge');
  });
  svg.innerHTML=svg.querySelector('defs').outerHTML+paths;
}
// 贝塞尔 t=0.5 中点 (C1=C2 水平对称): x=两端平均, y=0.125*y0+0.75*midY+0.125*y1
function edgeMidpoint(x0,y0,x1,y1,midY){
  return {x:(x0+x1)/2, y:0.125*y0+0.75*midY+0.125*y1};
}
// 边组: 透明宽热区(触发 hover) + 主路径 + 中点'+'快捷分支按钮
// depth 用于列配色 (父节点深度列), merge 边保持语义紫
function edgeGroup(fromId,toId,d,m,kind,depth){
  const marker=kind==='merge'?'url(#arrowhead-merge)':'url(#arrowhead)';
  const cls=(kind==='merge'?'edge-path merge-line':'edge-path parent-edge')+(kind==='parent'?` col-${(depth||0)%6}`:'');
  return `<g class="edge-group" data-from="${fromId}" data-to="${toId}">
    <path class="edge-hotzone" d="${d}"/>
    <path class="${cls}" data-from="${fromId}" data-to="${toId}" d="${d}" marker-end="${marker}"/>
    <g class="edge-add" transform="translate(${m.x},${m.y})" data-from="${fromId}" data-to="${toId}"
      onmousedown="event.stopPropagation();event.preventDefault();onEdgeAdd(event,'${fromId}','${toId}')">
      <circle r="9"/>
      <path class="edge-add-plus" d="M0,-4.5V4.5M-4.5,0H4.5"/>
    </g>
  </g>`;
}
// 折叠子树计数 (calcLayout 时计算, 渲染徽标用)
const _subCounts={};
function subCountById(id){return _subCounts[id]||0;}
function toggleFold(id){
  const n=tree.nodes.get(id);if(!n||!n.children.some(c=>tree.nodes.has(c)))return;
  if(collapsedIds.has(id))collapsedIds.delete(id);else collapsedIds.add(id);
  calcLayout();renderNodes();renderEdges();
}
// 边中点'+': 从边的父节点开新分支 (复用 branchFromNode 聚焦输入流程)
function onEdgeAdd(e,fromId,toId){
  if(e&&e.button!==0)return;
  const n=tree.nodes.get(fromId);if(!n)return;
  branchFromNode(fromId);
  toast('↳ 从 「'+nodeText(n)+'」 分支 — 输入内容后回车');
}

/* ===== Drag to Connect ===== */
function onHandleMouseDown(e,nodeId,side){
  e.stopPropagation();e.preventDefault();
  if(side!=='source')return;
  const p=nodePositions[nodeId];if(!p)return;
  connecting={fromId:nodeId, fromX:p.x, fromY:p.y+NODE_H/2, toX:p.x, toY:p.y+NODE_H/2};
  updateTempLine();
  document.getElementById('tempLine').style.display='';
  const handle=document.querySelector(`.node-card[data-id="${nodeId}"] .node-handle.source`);
  if(handle)handle.classList.add('dragging');
}

function onNodeMouseDown(e,nodeId){
  if(e.button!==0)return;
  cancelAutoAnim();
  e.preventDefault(); // prevent text selection / browser drag
  selectedNode=nodeId;
  renderNodes();renderEdges();
  // Start node drag
  const p=nodePositions[nodeId];if(!p)return;
  const startX=e.clientX,startY=e.clientY,startPX=p.x,startPY=p.y;
  document.body.style.userSelect='none';
  document.body.classList.add('dragging-node');
  document.body.style.webkitUserSelect='none';
  function onMove(ev){
    ev.preventDefault();
    const dx=(ev.clientX-startX)/zoom,dy=(ev.clientY-startY)/zoom;
    p.x=startPX+dx;p.y=startPY+dy;
    renderNodes();renderEdges();
    miniLayout();bumpIdle();
  }
  function onUp(ev){
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onUp);
    document.body.style.userSelect='';
    document.body.style.webkitUserSelect='';
    document.body.classList.remove('dragging-node');
    bumpIdle();
    if(Math.abs(ev.clientX-startX)<3&&Math.abs(ev.clientY-startY)<3){
      // Click (not drag) -> jump to node
      doJump(nodeId);
    }else{
      // Persist manual position so re-renders don't reset it
      manualPositions[nodeId]={x:p.x, y:p.y};
    }
  }
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
}

/* ===== Context Menu ===== */
function onNodeContextMenu(e,nodeId){
  e.preventDefault();e.stopPropagation();
  ctxMenuNode=nodeId;
  const menu=document.getElementById('ctxMenu');
  const n=tree.nodes.get(nodeId);
  const isRoot=n.depth===0;
  let items=[
    {label:'设为当前节点',action:'setCurrent',icon:'➤'},
    {label:'在对话中打开',action:'openInChat',icon:'🗨'},
  ];
  items.push({divider:true});
  if(n.children&&n.children.some(c=>tree.nodes.has(c))){
    items.push({label:collapsedIds.has(nodeId)?'展开子树':'折叠子树',action:'toggleFold',icon:collapsedIds.has(nodeId)?'▸':'▾'});
    items.push({divider:true});
  }
  // 代理归属 (ekko 模式): 该分支由 Ikaros 伴侣 / Hermes 任务代理作答
  const curAgent=n.agent||'ikaros';
  items.push({label:'代理→Ikaros（伴侣）·含子树',action:'agentIkaros',icon:curAgent==='ikaros'?'✔':' '});
  items.push({label:'代理→Hermes（任务）·含子树',action:'agentHermes',icon:curAgent==='hermes'?'✔':' '});
  items.push({divider:true});
  items.push({label:'重命名',action:'rename',icon:'✎',disabled:isRoot});
  items.push({label:'复制摘要',action:'copy',icon:'⧉'});
  items.push({label:'导出分享卡片',action:'exportCard',icon:'⤓'});
  items.push({label:'查看完整上下文',action:'fullContext',icon:'👁'});
  items.push({divider:true});
  items.push({label:'从此分叉',action:'fork',icon:'⎇'});
  if(n.mergeTarget){
    items.push({label:'取消合并',action:'unmerge',icon:'↩',danger:true});
  }else{
    items.push({label:'合并到主干',action:'merge',icon:'⥂'});
  }
  items.push({divider:true});
  items.push({label:'收尾',action:'conclude',icon:'✓'});
  items.push({label:'舍弃',action:'abandon',icon:'⊘',danger:true});
  items.push({label:'删除本节点',action:'deleteNode',icon:'🗑',danger:true,disabled:isRoot});
  items.push({label:'剪枝子树',action:'prune',icon:'⛏',danger:true,disabled:isRoot});
  menu.innerHTML=items.map(it=>{
    if(it.divider)return '<div class="ctx-divider"></div>';
    const dis=it.disabled?' style="opacity:.4;pointer-events:none"':'';
    return `<div class="ctx-menu-item${it.danger?' danger':''}"${dis} data-action="${it.action}">
      <span style="font-size:13px;width:18px;text-align:center;flex:none">${it.icon||''}</span><span>${it.label}</span></div>`;
  }).join('');
  menu.querySelectorAll('.ctx-menu-item').forEach(el=>{
    el.addEventListener('click',()=>handleCtxAction(el.dataset.action));
  });
  menu.classList.add('show');
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  let x=e.clientX, y=e.clientY;
  if(x+mw>window.innerWidth) x=Math.max(4,window.innerWidth-mw-4);
  if(y+mh>window.innerHeight) y=Math.max(4,window.innerHeight-mh-4);
  menu.style.left=x+'px';
  menu.style.top=y+'px';
  setTimeout(()=>document.addEventListener('click',hideCtxMenu,{once:true}),50);
}

function hideCtxMenu(){document.getElementById('ctxMenu').classList.remove('show');ctxMenuNode=null}

async function handleCtxAction(action){
  const nid=ctxMenuNode;          // 先捕获，避免 hideCtxMenu 将其置空
  hideCtxMenu();
  if(!nid)return;
  switch(action){
    case 'setCurrent':await API.jumpTo(nid);await refresh();break;
    case 'toggleFold':toggleFold(nid);break;
    case 'openInChat':await openInChat(nid);break;
    case 'agentIkaros':await API.setAgent(nid,'ikaros');await refresh();break;
    case 'agentHermes':await API.setAgent(nid,'hermes');await refresh();break;
    case 'copy':copyNodeSummary(nid);break;
    case 'exportCard':exportShareCard();break;
    case 'rename':await renameNodePrompt(nid);break;
    case 'fullContext':await showFullContext(nid);break;
    case 'fork': branchParentId=nid;document.getElementById('inputField').placeholder='↳ Fork from '+nodeText(tree.nodes.get(nid))+'…';focusInput();break;
    case 'conclude':await API.conclude(nid);await refresh();break;
    case 'merge':await API.merge(nid,'__trunk__');await refresh();break;
    case 'unmerge':await API.unmerge(nid);await refresh();break;
    case 'abandon':await API.abandon(nid);await refresh();break;
    case 'deleteNode':if(nid!==tree.rootId){if(confirm('删除该节点？其子节点将重挂到父节点。')){await API.deleteNode(nid);await refresh();}}break;
    case 'prune':if(nid!==tree.rootId){if(confirm('剪枝该子树？将删除本节点及其全部后代。')){await API.prune(nid);await refresh();}}break;
  }
}

/* ── 分享卡片导出 (chattree 借鉴, 零依赖纯 canvas) ── */
const SHARE_COLS=['#13E425','#00D4FF','#FFB020','#FF5DA2','#8B5CF6','#F43F5E'];
function exportShareCard(){
  // 只导出当前可见节点 (折叠状态所见即所得)
  const vis=[];tree.nodes.forEach(n=>{if(nodePositions[n.id])vis.push(n);});
  if(!vis.length){toast('没有可导出的节点');return;}
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  vis.forEach(n=>{const p=nodePositions[n.id];
    minX=Math.min(minX,p.x-NODE_W/2);minY=Math.min(minY,p.y-NODE_H/2);
    maxX=Math.max(maxX,p.x+NODE_W/2);maxY=Math.max(maxY,p.y+NODE_H/2);});
  const PAD=64,HEAD=96;
  let W=maxX-minX+PAD*2,H=maxY-minY+PAD*2+HEAD;
  // 超大树整体缩放 (上限 2200px)
  const cap=Math.max(W,H)/2200;
  if(cap>1){W/=cap;H/=cap;}
  const sc=cap>1?1/cap:1;  // sc = 实际缩放
  const cv=document.createElement('canvas');cv.width=Math.round(W);cv.height=Math.round(H);
  const ctx=cv.getContext('2d');
  const tx=x=>(x-minX+PAD)*sc, ty=y=>(y-minY+PAD+HEAD)*sc;
  // 背景
  ctx.fillStyle='#101010';ctx.fillRect(0,0,W,H);
  // 网格点缀
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let gx=PAD*sc;gx<W;gx+=60*sc){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for(let gy=PAD*sc;gy<H;gy+=60*sc){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
  // 标题
  ctx.fillStyle='#ffffff';ctx.font='700 26px Inter,sans-serif';
  ctx.fillText('Conversation Tree',PAD*sc,44*sc);
  ctx.fillStyle='#999999';ctx.font='13px Inter,sans-serif';
  const root=tree.nodes.get(tree.rootId);
  ctx.fillText('『'+(root?nodeText(root):'')+'』 · '+vis.length+' 节点 · '+new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),PAD*sc,70*sc);
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(PAD*sc,HEAD-14);ctx.lineTo(W-PAD*sc,HEAD-14);ctx.stroke();
  // 边 (贝塞尔, 列色)
  vis.forEach(n=>{
    if(!n.parentId)return;
    const sp=nodePositions[n.parentId],tp=nodePositions[n.id];if(!sp||!tp)return;
    const startY=sp.y+NODE_H/2,endY=tp.y-NODE_H/2,midY=startY+(endY-startY)*0.4;
    ctx.strokeStyle=SHARE_COLS[((tree.nodes.get(n.parentId)||{}).depth||0)%6];
    ctx.globalAlpha=.5;ctx.lineWidth=2*sc;
    ctx.beginPath();ctx.moveTo(tx(sp.x),ty(startY));
    ctx.bezierCurveTo(tx(sp.x),ty(midY),tx(tp.x),ty(midY),tx(tp.x),ty(endY));ctx.stroke();
  });
  ctx.globalAlpha=1;
  // 节点
  vis.forEach(n=>{
    const p=nodePositions[n.id];
    const col=SHARE_COLS[(n.depth||0)%6];
    const x=tx(p.x),y=ty(p.y),w=NODE_W*sc,h=NODE_H*sc;
    // 卡片底
    ctx.fillStyle='#222222';ctx.strokeStyle='#484848';ctx.lineWidth=1.5*sc;
    ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,10*sc);ctx.fill();ctx.stroke();
    // 顶部列色条
    ctx.fillStyle=col;
    ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,3*sc,{tl:10*sc,tr:10*sc,bl:0,br:0});ctx.fill();
    // 当前节点: 品牌色描边
    if(n.id===tree.currentId){
      ctx.strokeStyle='#13E425';ctx.lineWidth=2*sc;
      ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,10*sc);ctx.stroke();
    }
    // 标签
    ctx.fillStyle=n.id===tree.currentId?'#13E425':'#d1d1d1';
    ctx.font='600 11px Inter,sans-serif';
    let lb=nodeText(n);if(lb.length>16)lb=lb.slice(0,16)+'…';
    ctx.fillText(lb,x-w/2+8*sc,y+2*sc,w-16*sc);
    // 深度/代理小字
    ctx.fillStyle='#777777';ctx.font='9px "JetBrains Mono",monospace';

/* ===== Canvas Pan & Zoom ===== */
(function setupCanvas(){
  const wrap=document.getElementById('canvasWrap');
  let panning=false,px=0,py=0;
  wrap.addEventListener('mousedown',e=>{
    cancelAutoAnim();
    if(e.target===wrap||e.target.classList.contains('canvas-grid')){
      panning=true;px=e.clientX-panX;py=e.clientY-panY;
      wrap.classList.add('panning');e.preventDefault();
    }
  });
  window.addEventListener('mousemove',e=>{
    if(panning){panX=e.clientX-px;panY=e.clientY-py;applyTransform();bumpIdle();}
    if(connecting){
      const c=screenToCanvas(e.clientX,e.clientY);
      connecting.toX=c.x;connecting.toY=c.y;updateTempLine();
      document.querySelectorAll('.node-handle.target').forEach(h=>h.classList.remove('dragging'));
      const el=document.elementFromPoint(e.clientX,e.clientY);
      if(el&&el.classList.contains('node-handle')&&el.dataset.side==='target'){
        el.classList.add('dragging');
      }
    }
  });
  window.addEventListener('mouseup',e=>{
    if(panning){panning=false;wrap.classList.remove('panning')}
    if(connecting){
      // Check if dropped on a target handle
      const el=document.elementFromPoint(e.clientX,e.clientY);
      if(el&&el.classList.contains('node-handle')&&el.dataset.side==='target'){
        const targetId=el.dataset.node;
        if(targetId&&targetId!==connecting.fromId){
          createConnection(connecting.fromId,targetId);
        }
      }
      connecting=null;
      document.getElementById('tempLine').style.display='none';
      document.querySelectorAll('.node-handle.dragging').forEach(h=>h.classList.remove('dragging'));
    }
  });
  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    cancelAutoAnim();
    const delta=e.deltaY>0?0.9:1.1;
    const newZoom=Math.min(3,Math.max(0.15,zoom*delta));
    const rect=wrap.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    panX=mx-(mx-panX)*(newZoom/zoom);
    panY=my-(my-panY)*(newZoom/zoom);
    zoom=newZoom;applyTransform();bumpIdle();
  },{passive:false});
  // Touch support
  let touches=[];
  wrap.addEventListener('touchstart',e=>{
    cancelAutoAnim();
    if(e.touches.length===1){panning=true;px=e.touches[0].clientX-panX;py=e.touches[0].clientY-panY}
    else if(e.touches.length===2){touches=[...e.touches]}
    e.preventDefault();
  },{passive:false});
  wrap.addEventListener('touchmove',e=>{
    if(panning&&e.touches.length===1){panX=e.touches[0].clientX-px;panY=e.touches[0].clientY-py;applyTransform();bumpIdle()}
    else if(e.touches.length===2){
      const d0=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
      const d1=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      zoom=Math.min(3,Math.max(0.15,zoom*(d1/d0)));applyTransform();bumpIdle();touches=[...e.touches];
    }
    e.preventDefault();
  },{passive:false});
  wrap.addEventListener('touchend',()=>{panning=false});
})();

/* ===== Minimap 缩略图 + 静止自动归位 (2026-08-03) =====
   交互 (平移/缩放/拖卡) 后静止 6s → 2s 缓动把当前主卡片移到窗口 中下 并缩放到合适大小 */
const IDLE_MS=6000, ANIM_MS=2000;
const MINI={svg:null,vp:null,map:null,scale:0,ox:0,oy:0};
let _idleTimer=null,_animId=null;
const _easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function miniInit(){
  MINI.svg=document.getElementById('miniSvg');
  MINI.vp=document.getElementById('miniViewport');
  MINI.map=document.getElementById('miniMap');
  if(!MINI.svg)return;
  // 缩放后左键点击一次 → 视作鼠标离开 (冻结 hover 跟随), 移出再进入恢复
  let miniFrozen=false, miniWheelArmed=false;
  MINI.map.addEventListener('mousedown',e=>{
    e.stopPropagation();e.preventDefault();
    if(e.button===0&&miniWheelArmed){miniFrozen=true;miniWheelArmed=false;}
  });
  MINI.map.addEventListener('mouseleave',()=>{miniFrozen=false;miniWheelArmed=false;});
  // 实时跟随: 鼠标在缩略图上移动 (无需按下) 视口中心即跟随鼠标指向的位置
  MINI.map.addEventListener('mousemove',e=>{
    e.stopPropagation();
    if(miniFrozen)return;
    if(!MINI.scale)return;
    const r=MINI.map.getBoundingClientRect();
    const cx=(e.clientX-r.left-MINI.ox)/MINI.scale;
    const cy=(e.clientY-r.top-MINI.oy)/MINI.scale;
    const wrap=document.getElementById('canvasWrap');
    panX=wrap.clientWidth/2-cx*zoom;
    panY=wrap.clientHeight/2-cy*zoom;
    applyTransform();
    bumpIdle();
  });
  // 缩略图上滚轮缩放: 锚点 = 鼠标指向的 canvas 点缩放前的屏幕位置
  // (不能用鼠标绝对屏幕位置 — minimap 位于主视口左下角, 那样缩放中心会固定偏到左下)
  MINI.map.addEventListener('wheel',e=>{
    e.preventDefault();e.stopPropagation();
    cancelAutoAnim();
    miniWheelArmed=true;   // 缩放完毕 → 下一次左键点击冻结跟随
    if(!MINI.scale)return;
    const delta=e.deltaY>0?0.9:1.1;
    const newZoom=Math.min(3,Math.max(0.15,zoom*delta));
    const mr=MINI.map.getBoundingClientRect();
    // 鼠标在 minimap 上的位置 → 对应 canvas 坐标
    const cx=(e.clientX-mr.left-MINI.ox)/MINI.scale;
    const cy=(e.clientY-mr.top-MINI.oy)/MINI.scale;
    // 锚点 = 该 canvas 点缩放前的屏幕位置 (指哪以哪为中心, 内容不跳变)
    const sx=panX+cx*zoom, sy=panY+cy*zoom;
    zoom=newZoom;
    panX=sx-cx*newZoom;
    panY=sy-cy*newZoom;
    applyTransform();
    bumpIdle();
  },{passive:false});
  // 容器尺寸变化 (splitter / 折叠 / 窗口 resize) 时刷新视口框
  new ResizeObserver(()=>miniUpdateViewport()).observe(document.getElementById('canvasWrap'));
  // 右下角手柄拖拽调大小 (120-420 x 80-320), 尺寸记忆到 localStorage
  const rz=document.getElementById('miniResize');
  if(rz){
    try{
      const s=JSON.parse(localStorage.getItem('conv-tree-minimap')||'null');
      if(s&&s.w&&s.h){MINI.map.style.width=s.w+'px';MINI.map.style.height=s.h+'px';}
    }catch(e){}
    rz.addEventListener('mousedown',e=>{
      e.stopPropagation();e.preventDefault();
      const sx=e.clientX,sy=e.clientY,sw=MINI.map.offsetWidth,sh=MINI.map.offsetHeight;
      const mv=ev=>{
        const w=Math.min(420,Math.max(120,sw+ev.clientX-sx));
        const h=Math.min(320,Math.max(80,sh+ev.clientY-sy));
        MINI.map.style.width=w+'px';MINI.map.style.height=h+'px';
        miniLayout();
      };
      const up=()=>{
        window.removeEventListener('mousemove',mv);
        window.removeEventListener('mouseup',up);
        try{localStorage.setItem('conv-tree-minimap',JSON.stringify({w:MINI.map.offsetWidth,h:MINI.map.offsetHeight}))}catch(e){}
        bumpIdle();
      };
      window.addEventListener('mousemove',mv);
      window.addEventListener('mouseup',up);
    });
  }
}
function miniLayout(){
  if(!MINI.svg)return;
  const W=MINI.svg.clientWidth||190,H=MINI.svg.clientHeight||130;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  tree.nodes.forEach(n=>{const p=nodePositions[n.id];if(!p)return;
    minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
  if(!isFinite(minX)||maxX<minX)return;
  const pad=6;
  const s=Math.min((W-2*pad)/Math.max(1,maxX-minX),(H-2*pad)/Math.max(1,maxY-minY));
  MINI.scale=s;
  // 映射锚点: 默认以当前卡片中心为画布原点 → 当前卡片固定在小窗居中下 (W/2, H*0.62)
  // 与其他节点(含手动拖动)的相对位置由画布坐标差决定, 不再随整树边界漂移
  const cur=nodePositions[tree.currentId||tree.rootId];
  if(cur){
    MINI.ox=W*0.5-cur.x*s;
    MINI.oy=H*0.62-cur.y*s;
  }else{
    MINI.ox=pad-minX*s;MINI.oy=pad-minY*s;
  }
  const px=x=>x*s+MINI.ox, py=y=>y*s+MINI.oy;
  let e='',n='';
  tree.nodes.forEach(node=>{
    if(node.parentId){
      const a=nodePositions[node.parentId],b=nodePositions[node.id];
      if(a&&b)e+=`<line class="mini-edge" x1="${px(a.x).toFixed(1)}" y1="${py(a.y).toFixed(1)}" x2="${px(b.x).toFixed(1)}" y2="${py(b.y).toFixed(1)}"/>`;
    }
    const a=nodePositions[node.id];if(!a)return;
    n+=`<rect class="mini-node${node.id===tree.currentId?' current':''}" x="${(px(a.x)-2).toFixed(1)}" y="${(py(a.y)-2).toFixed(1)}" width="4" height="4" rx="1"/>`;
  });
  MINI.svg.innerHTML=e+n;
  miniUpdateViewport();
}
function miniUpdateViewport(){
  const vp=MINI.vp;if(!vp||!MINI.scale)return;
  const wrap=document.getElementById('canvasWrap');
  const w=wrap.clientWidth,h=wrap.clientHeight;
  if(!w||!h)return;
  // 当前可见区域在 canvas 坐标系中的范围
  const vx=-panX/zoom,vy=-panY/zoom,vw=w/zoom,vh=h/zoom;
  const x=MINI.ox+vx*MINI.scale,y=MINI.oy+vy*MINI.scale;
  vp.style.left=x+'px';vp.style.top=y+'px';
  vp.style.width=Math.max(8,vw*MINI.scale)+'px';
  vp.style.height=Math.max(5,vh*MINI.scale)+'px';
}
/* 静止计时: 任何画布操作后重置, 6s 无操作触发归位 */
function bumpIdle(){
  clearTimeout(_idleTimer);
  _idleTimer=setTimeout(autoCenterCurrent,IDLE_MS);
}
function cancelAutoAnim(){
  if(_animId){cancelAnimationFrame(_animId);_animId=null;}
}
function autoCenterCurrent(){
  cancelAutoAnim();
  const id=tree.currentId||tree.rootId;
  const p=nodePositions[id];if(!p)return;
  const wrap=document.getElementById('canvasWrap');
  const w=wrap.clientWidth,h=wrap.clientHeight;
  // 目标: 水平居中, 垂直 62% (中下), 卡片显示到合适大小 (窗口越大 zoom 越高, 上限 1.5)
  const tz=Math.min(1.5,Math.max(1.0,Math.min(w/760,h/520)));
  const tx=w*0.5-p.x*tz, ty=h*0.62-p.y*tz;
  // 已在目标附近则直接 snap, 避免反复抖动
  if(Math.hypot(tx-panX,ty-panY)<3&&Math.abs(tz-zoom)<0.02){
    zoom=tz;panX=tx;panY=ty;applyTransform();return;
  }
  const s0=zoom,p0x=panX,p0y=panY,t0=performance.now();
  (function step(now){
    const k=Math.min(1,(now-t0)/ANIM_MS),e=_easeInOutCubic(k);
    zoom=s0+(tz-s0)*e;panX=p0x+(tx-p0x)*e;panY=p0y+(ty-p0y)*e;
    applyTransform();
    if(k<1)_animId=requestAnimationFrame(step);else _animId=null;
  })(t0);
}

/* ===== Resizable Splitters ===== */
(function setupSplitters(){
  const sidebar=document.querySelector('.sidebar');

    if(saved.tw) treePanel.style.setProperty('--tree-w',saved.tw+'px');
  }catch(e){}
  function saveLayout(){
    const sw=parseInt(getComputedStyle(sidebar).width);
    const tw=parseInt(getComputedStyle(treePanel).width);
    try{localStorage.setItem('conv-tree-layout',JSON.stringify({sw,tw}))}catch(e){}
  }
  // Splitter 1: sidebar (--sidebar-w, min 120 / max 300) ↔ tree-panel (--tree-w)
  (function(){
    let dragging=false,startX=0,startSw=0,startTw=0;
    s1.addEventListener('mousedown',e=>{
      dragging=true;s1.classList.add('active');
      startX=e.clientX;startSw=parseInt(getComputedStyle(sidebar).width);
      startTw=parseInt(getComputedStyle(treePanel).width);
      document.body.style.userSelect='none';document.body.style.cursor='col-resize';
      e.preventDefault();
    });
    s1.addEventListener('touchstart',e=>{
      dragging=true;s1.classList.add('active');
      startX=e.touches[0].clientX;startSw=parseInt(getComputedStyle(sidebar).width);
      startTw=parseInt(getComputedStyle(treePanel).width);
      document.body.style.userSelect='none';document.body.style.cursor='col-resize';
    },{passive:false});
    function onMove(e){
      if(!dragging)return;
      const cx=e.touches?e.touches[0].clientX:e.clientX;
      let nw=startSw+(cx-startX);
      if(nw<120)nw=120;if(nw>300)nw=300;
      sidebar.style.setProperty('--sidebar-w',nw+'px');
      treePanel.style.setProperty('--tree-w',(startSw+startTw-nw)+'px');
    }
    function onUp(){
      if(!dragging)return;
      dragging=false;s1.classList.remove('active');
      document.body.style.userSelect='';document.body.style.cursor='';
      saveLayout();
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('touchmove',onMove,{passive:false});
    window.addEventListener('mouseup',onUp);
    window.addEventListener('touchend',onUp);
  })();
  // Splitter 2: tree-panel (--tree-w) ↔ main (flex:1, auto)
  (function(){
    let dragging=false,startX=0,startTw=0;
    s2.addEventListener('mousedown',e=>{
      dragging=true;s2.classList.add('active');
      startX=e.clientX;startTw=parseInt(getComputedStyle(treePanel).width);
      document.body.style.userSelect='none';document.body.style.cursor='col-resize';
      e.preventDefault();
    });
    s2.addEventListener('touchstart',e=>{
      dragging=true;s2.classList.add('active');
      startX=e.touches[0].clientX;startTw=parseInt(getComputedStyle(treePanel).width);
      document.body.style.userSelect='none';document.body.style.cursor='col-resize';
    },{passive:false});
    function onMove(e){
      if(!dragging)return;
      const cx=e.touches?e.touches[0].clientX:e.clientX;
      let nw=startTw+(cx-startX);
      treePanel.style.setProperty('--tree-w',nw+'px');
    }
    function onUp(){
      if(!dragging)return;
      dragging=false;s2.classList.remove('active');
      document.body.style.userSelect='';document.body.style.cursor='';
      saveLayout();
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('touchmove',onMove,{passive:false});
    window.addEventListener('mouseup',onUp);
    window.addEventListener('touchend',onUp);
  })();
  saveLayout();
})();

async function createConnection(fromId,targetId){
  // Determine action based on tree structure
  const from=tree.nodes.get(fromId),target=tree.nodes.get(targetId);
  if(!from||!target)return;
  // If target is a trunk ancestor and from is a branch -> merge
  const targetPath=tree.getPath(targetId);
  const isTrunk=target.nodeType==='trunk'||target.depth<from.depth;
  if(isTrunk&&from.nodeType==='branch'){
    await API.merge(fromId,targetId);
  }else{
    // Default: fork from target
    branchParentId=targetId;
    document.getElementById('inputField').placeholder='↳ Fork from '+nodeText(target)+'…';
    focusInput();
  }
  await refresh();
}

/* ===== M1: 惰性拉取节点对话内容 (state 改为 inline=0 后, 仅路径节点按需填充) ===== */
let _hydrating=new Set();
async function ensureNodeMessages(node){
  if(!node||node._hydrated||!node.v5_memory_id)return;
  if(node.messages&&node.messages.length)return;  // 已内联 (chat done 全量 state), 无需再拉
  if(_hydrating.has(node.id))return;          // 已在拉取, 避免重复请求
  _hydrating.add(node.id);
  try{
    const c=await API.nodeContent(node.id);
    if(c&&c.messages)node.messages=c.messages;
    node._hydrated=true;
  }catch(e){node._hydrated=true;}            // 失败也标记, 不再重试
  finally{_hydrating.delete(node.id);}
}
async function hydratePath(path){
  const need=path.filter(n=>n.v5_memory_id&&!n._hydrated);
  if(need.length)await Promise.all(need.map(ensureNodeMessages));
}

/* ===== Chat Thread (M1 自修复: 消息未内联时先拉取再渲染) ===== */
function renderThread(){
  const area=document.getElementById('messagesArea');
  const path=tree.getPath();
  if(!path.length){
    // 空态: 无路径时的欢迎界面
    area.innerHTML=`<div class="chat-empty">
      <div class="empty-orb">✦</div>
      <div class="empty-title">伊卡洛斯在这里</div>
      <div class="empty-sub">从下方输入开始一段对话，或点击树中节点继续已有分支</div>
      <div class="empty-suggestions">
        <button class="empty-chip" onclick="quickAsk('你好，伊卡洛斯，介绍一下你自己')">介绍你自己</button>
        <button class="empty-chip" onclick="quickAsk('今天有什么值得关注的？')">今日动态</button>
        <button class="empty-chip" onclick="quickAsk('帮我梳理一下当前项目')">梳理项目</button>
      </div>
    </div>`;
    return;
  }
  // M1 自修复: 路径节点消息尚未内联 (inline=0 且未拉取过) 时, 拉取后再渲染, 避免空白.
  // 注意: chat done 事件回传的是全量 state (已含 messages), 此时不触发拉取, 避免多此一举.
  const needHydrate=path.some(n=>n.v5_memory_id&&!n._hydrated&&!(n.messages&&n.messages.length));
  if(needHydrate){
    area.innerHTML=`<div class="chat-empty"><div class="empty-orb">⏳</div><div class="empty-sub">正在加载对话内容…</div></div>`;
    hydratePath(path).then(()=>renderThread());
    return;
  }
  const total=path.reduce((a,n)=>a+(n.messages||[]).filter(m=>m.role!=='system').length,0);
  if(total===0){
    // 空态: 路径存在但确实无消息
    area.innerHTML=`<div class="chat-empty">
      <div class="empty-orb">✦</div>
      <div class="empty-title">伊卡洛斯在这里</div>
      <div class="empty-sub">从下方输入开始一段对话，或点击树中节点继续已有分支</div>
      <div class="empty-suggestions">
        <button class="empty-chip" onclick="quickAsk('你好，伊卡洛斯，介绍一下你自己')">介绍你自己</button>
        <button class="empty-chip" onclick="quickAsk('今天有什么值得关注的？')">今日动态</button>
        <button class="empty-chip" onclick="quickAsk('帮我梳理一下当前项目')">梳理项目</button>
      </div>
    </div>`;
    return;
  }
  let html=`<div class="ctx-note">⟡ 上下文 · ${path.length} 节点 · ${total} 条消息（根 → 当前）</div>`;
  path.forEach((n,idx)=>{
    const isCur=n.id===tree.currentId;
    const hasSib=tree.siblings(n.id).length>0;
    const brTag=n.branchLabel&&n.branchLabel!=='main'?`<span class="turn-branch-tag">branch: ${n.branchLabel}</span>`:'';
    let body='';
    n.messages.filter(m=>m.role!=='system').forEach((m,mi)=>{
      if(m.role==='user'){
        body+=`<div class="bubble-wrap">
          <div class="bubble-actions">
            <button class="bubble-act" title="复制原文" onclick="copyMsgRaw('${n.id}',${mi})">⧉</button>
            <button class="bubble-act" title="编辑重发（创建新分支）" onclick="editAndResend('${n.id}',${mi})">✎</button>
          </div>
          <div class="bubble bubble-user">${escapeHtml(m.content)}</div></div>`;
      }
      else body+=aiCardHtml(m.content,isCur,n,mi);
    });
    if(idx>0&&hasSib)html+=`<div class="branch-divider"></div>`;
    html+=`<div class="turn ${isCur?'current animate-fadeIn':''}" data-node="${n.id}">
      <div class="turn-head"><span class="turn-badge ${n.branchLabel&&n.branchLabel!=='main'?'branch':''}">#${n.depth} ${n.branchLabel||'main'}</span>
      <span class="turn-time">${new Date(n.createdAt).toLocaleTimeString()}</span>${brTag}
      ${isCur?'<span class="turn-branch-tag" style="color:var(--brand)">● current</span>':''}</div>${body}${extrasHtml(n)}</div>`;
  });
  // L4: 重建时保留滚动位置 — 仅当用户原本已在底部才自动滚到底, 否则停在原位 (读历史不跳)
  const atBottomBefore = area.scrollHeight - area.scrollTop - area.clientHeight < 60;
  area.innerHTML=html;
  if(atBottomBefore) area.scrollTop=area.scrollHeight;
}

/* ===== 思考块 + 工具卡片 (chat 可视化) ===== */
function thinkBlockHtml(thinking){
  if(!thinking||!thinking.trim())return '';
  return `<details class="think-block" open><summary>💭 思考过程 <span class="think-len">${thinking.length} 字</span></summary><div class="think-body">${escapeHtml(thinking)}</div></details>`;
}
function toolCardHtml(tc){
  // 兼容持久化(ToolCall: name/params/result_summary/success) 与 实时(tool_call/tool_result: name/args/result/ok)
  const name=tc.name||(tc.function&&tc.function.name)||'未知工具';
  const args=tc.params!=null?tc.params:(tc.args!=null?tc.args:{});
  const rawRes=tc.result_summary!=null?tc.result_summary:(tc.result!=null?tc.result:'');
  const res=typeof rawRes==='string'?rawRes:JSON.stringify(rawRes,null,2);
  const ok=tc.success!=null?tc.success:(tc.ok!=null?tc.ok:null);
  const argsStr=JSON.stringify(args,null,2);
  // 三态: null=调用中, true=完成, false=失败
  let stateHtml, cardCls;
  if(ok===null){cardCls='running';stateHtml='<span class="tool-state running"><span class="spinner"></span>调用中</span>';}
  else{cardCls=ok?'ok':'fail';stateHtml=`<span class="tool-state">${ok?'✓ 完成':'✗ 失败'}</span>`;}
  return `<div class="tool-card ${cardCls}">
    <div class="tool-head"><span class="tool-icon">🔧</span><span class="tool-name">${escapeHtml(name)}</span>
      ${stateHtml}</div>
    <details class="tool-detail"><summary>参数</summary><pre class="tool-args">${escapeHtml(argsStr)}</pre></details>
    ${ok!==null?`<details class="tool-detail"><summary>结果</summary><pre class="tool-result">${escapeHtml((res||'').slice(0,2000))}</pre></details>`:''}
  </div>`;
}
function extrasHtml(node){
  let h='';
  if(node.thinking&&node.thinking.trim())h+=thinkBlockHtml(node.thinking);
  // 工具卡片不再内嵌对话流 — 统一收进 toolDock (updateToolDock 由 renderAll 调用)
  h+=usageLineHtml(node);
  return h?`<div class="ai-extras">${h}</div>`:'';
}
function renderExtras(container,live){
  let h='';
  if(live.thinking&&live.thinking.trim())h+=thinkBlockHtml(live.thinking);
  // live 工具调用实时进 toolDock, 不内嵌对话流
  if(live.tools){
    liveToolCalls=Object.values(live.tools);
    updateToolDock();
  }
  container.innerHTML=h;
}

/* ===== 工具调用小窗逻辑 ===== */
let liveToolCalls=[];   // 当前实时对话的工具调用 (与路径历史合并显示)
let dockDrag=null;      // {side,startY,startH,startTop,bottom} — 边界高度调整
let dockMove=null;      // {startX,startY,left,top,parentW,parentH} — 整体移动
function collectToolCalls(){
  const list=[];
  tree.getPath().forEach(n=>{(n.toolCalls||[]).forEach(t=>list.push(t));});
  return list.concat(liveToolCalls);
}
function updateToolDock(){
  const body=document.getElementById('toolDockBody');
  const list=collectToolCalls();
  document.getElementById('toolDockCount').textContent=list.length;
  body.innerHTML=list.length
    ? list.map(toolCardHtml).join('')
    : '<div class="tool-dock-empty">暂无工具调用 — 对话中使用工具后会出现在这里</div>';
}
function toggleToolDock(){
  document.getElementById('toolDock').classList.toggle('collapsed');
}
function dockResizeStart(e,side){
  e.stopPropagation();e.preventDefault();
  const dock=document.getElementById('toolDock');
  if(dock.classList.contains('collapsed'))return;
  dockDrag={side,startY:e.clientY,startH:dock.offsetHeight,startTop:dock.offsetTop,bottom:dock.offsetTop+dock.offsetHeight};
  dock.classList.add('resizing');
  document.body.style.userSelect='none';
  window.addEventListener('mousemove',dockResizeMove);
  window.addEventListener('mouseup',dockResizeEnd);
}
function dockResizeMove(e){
  if(!dockDrag)return;
  const dock=document.getElementById('toolDock');
  const parentH=dock.parentElement.clientHeight;
  const dy=e.clientY-dockDrag.startY;
  const MIN=120;
  const MAX=dockDrag.side==='bottom'
    ? Math.max(MIN,parentH-dockDrag.startTop-8)   // 拖下边界: 底边最多到 parentH-8
    : Math.max(MIN,dockDrag.bottom-8);            // 拖上边界: 顶边最少到 8 (高度最大=bottom-8)
  if(dockDrag.side==='bottom'){
    // 拖下边界: 顶边固定, 调高度
    dock.style.height=Math.max(MIN,Math.min(MAX,dockDrag.startH+dy))+'px';
  }else{
    // 拖上边界: 底边固定 (bottom 不变), 顶边移动, 高度反变
    const h=Math.max(MIN,Math.min(MAX,dockDrag.startH-dy));
    dock.style.height=h+'px';
    dock.style.top=(dockDrag.bottom-h)+'px';
  }
}
function dockResizeEnd(){
  dockDrag=null;
  document.body.style.userSelect='';
  document.getElementById('toolDock').classList.remove('resizing');
  window.removeEventListener('mousemove',dockResizeMove);
  window.removeEventListener('mouseup',dockResizeEnd);
}
// 标题栏拖动: 移动整个小窗; 位移 <4px 视为点击 → 折叠/展开
function dockMoveStart(e){
  if(e.button!==0)return;
  e.preventDefault();
  const dock=document.getElementById('toolDock');
  dockMove={startX:e.clientX,startY:e.clientY,left:dock.offsetLeft,top:dock.offsetTop,
    parentW:dock.parentElement.clientWidth,parentH:dock.parentElement.clientHeight,moved:false};
  dock.classList.add('moving');
  document.body.classList.add('dock-moving');
  document.body.style.userSelect='none';
  window.addEventListener('mousemove',dockMoveMove);
  window.addEventListener('mouseup',dockMoveEnd);
}
function dockMoveMove(e){
  if(!dockMove)return;
  const dock=document.getElementById('toolDock');
  const dx=e.clientX-dockMove.startX, dy=e.clientY-dockMove.startY;
  if(Math.abs(dx)>3||Math.abs(dy)>3)dockMove.moved=true;
  if(!dockMove.moved)return;
  const W=dock.offsetWidth,H=dock.offsetHeight;
  dock.style.left=Math.max(8,Math.min(dockMove.parentW-W-8,dockMove.left+dx))+'px';
  dock.style.top=Math.max(8,Math.min(dockMove.parentH-H-8,dockMove.top+dy))+'px';
}
function dockMoveEnd(){
  const m=dockMove;
  dockMove=null;
  document.getElementById('toolDock').classList.remove('moving');
  document.body.classList.remove('dock-moving');
  document.body.style.userSelect='';
  window.removeEventListener('mousemove',dockMoveMove);
  window.removeEventListener('mouseup',dockMoveEnd);
  if(m&&!m.moved)toggleToolDock();   // 纯点击 → 折叠/展开
}

/* ===== 上下文用量 + 缓存可视化 (chat 底部状态条 + 历史节点小行) ===== */
// 与 server.py 的 CT_CONTEXT_WINDOW 默认值保持一致 (env 可覆盖); 真实窗口优先用 CT_CTX_LIVE (模型元数据).
const CT_CTX=64000;
let CT_CTX_LIVE=0; // 2026-08-03: 从 hermes 模型元数据获取的实际 context window
function fmtTok(n){
  n=Math.round(Number(n)||0);
  if(n>=1000)return (n/1000).toFixed(n>=10000?0:1)+'K';
  return String(n);
}
function updateUsageBar(usage, model, ctxWin){
  const u=usage||{}, pt=u.prompt_tokens||0, ct=u.completion_tokens||0;
  const tot=u.total_tokens||(pt+ct);
  const hit=u.prompt_cache_hit_tokens||0, miss=u.prompt_cache_miss_tokens||0;
  const reason=(u.completion_tokens_details&&u.completion_tokens_details.reasoning_tokens)||0;
  const win=ctxWin||CT_CTX_LIVE||CT_CTX;
  const pct=win>0?Math.min(100,pt/win*100):0;
  const fill=document.getElementById('ctxFill');
  if(fill){fill.style.width=pct.toFixed(1)+'%';
    fill.style.background=pct>90?'#ef4444':pct>70?'#eab308':'var(--brand)';}
  const ctxEl=document.getElementById('ctxText');
  if(ctxEl)ctxEl.textContent=fmtTok(pt)+' / '+fmtTok(win)+' ('+pct.toFixed(0)+'%)';
  const badge=document.getElementById('cacheBadge');
  if(badge){
    const rate=pt>0?hit/pt*100:0;
    let cls='',txt='—';
    if(pt>0){
      if(rate>=85){cls='good';}else if(rate>=70){cls='warn';}else{cls='bad';}
      txt='命中 '+rate.toFixed(0)+'%';
    }
    badge.className='usage-badge '+cls;badge.textContent=txt;
  }
  const cacheEl=document.getElementById('cacheText');
  if(cacheEl)cacheEl.textContent=pt>0?('命中 '+fmtTok(hit)+' · 未命中 '+fmtTok(miss)):'';
  const tokEl=document.getElementById('tokenText');
  if(tokEl)tokEl.innerHTML='总计 <b>'+fmtTok(tot)+'</b> · 输入 <b>'+fmtTok(pt)+'</b> · 输出 <b>'
    +fmtTok(ct)+'</b>'+(reason?' · 思考 <b>'+fmtTok(reason)+'</b>':'')
    +(model?' · '+escapeHtml(model):'');
}
function usageLineHtml(node){
  const u=node.usage||{};
  if(!u||!u.prompt_tokens)return '';
  const pt=u.prompt_tokens||0, ct=u.completion_tokens||0, tot=u.total_tokens||(pt+ct);
  const hit=u.prompt_cache_hit_tokens||0, miss=u.prompt_cache_miss_tokens||0;
  const reason=(u.completion_tokens_details&&u.completion_tokens_details.reasoning_tokens)||0;
  const rate=pt>0?Math.round(hit/pt*100):0;
  return '<div class="usage-line">⚡ 上下文 '+fmtTok(pt)+'/'+fmtTok(CT_CTX_LIVE||CT_CTX)
    +' · 缓存 '+rate+'% ('+fmtTok(hit)+'/'+fmtTok(miss)+') · 总 '+fmtTok(tot)
    +(reason?' · 思考 '+fmtTok(reason):'')+'</div>';
}
function aiCardHtml(content,isCur,n,mi){
  // marked 渲染 markdown (代码块/列表/标题/加粗全支持), 再叠加概念高亮
  let h=mdRender(content);
  h=highlightConcepts(h,isCur);
  const sbCls=isCur?'streaming-border-effect':'';
  const fav=isFavNode(n&&n.id)?'★':'☆';
  const nid=n&&n.id?n.id:'';
  return `<div class="ai-card ${sbCls}"><div class="card-header"><div class="card-avatar">✦</div><span class="card-label">伊卡洛斯 · Ikaros</span></div>
    <div class="card-body">${h}</div><div class="card-footer">
    <button class="card-action-btn" onclick="copyMsgRaw('${nid}',${mi})">⧉ Copy</button>
    <button class="card-action-btn" onclick="retryNode('${nid}')">⟳ Retry</button>
    <button class="card-action-btn" onclick="branchFromNode('${nid}')">↳ Branch</button>
    <button class="card-action-btn" style="margin-left:auto" onclick="toggleFavNode('${nid}')">${fav} Fav</button>
    </div></div>`;
}
function branchFromNode(nid){
  const n=tree.nodes.get(nid);if(!n)return;
  branchParentId=nid;
  document.getElementById('inputField').placeholder='↳ Fork from '+nodeText(n)+'…';
  focusInput();
}
function highlightConcepts(s,isCur){
  const cls=isCur?'concept-term highlight-text-flash':'concept-term';
  return s.replace(/(GTO|Nash equilibrium|neural network|attention|self-play|policy|equilibrium|game theory)/gi,'<span class="'+cls+'">$1</span>');
}
function renderHeader(){
  const path=tree.getPath();
  const crumbs=path.map((n,i)=>i===path.length-1?`<span class="cur">${escapeHtml(nodeText(n))}</span>`:`<b>${escapeHtml(nodeText(n))}</b>`);
  document.getElementById('breadcrumb').innerHTML='Path: '+crumbs.join(' <span style="opacity:.4">›</span> ');
  document.getElementById('branchBanner').classList.toggle('show',!tree.isLeaf(tree.currentId));
  const cur=tree.current;
  document.getElementById('treeInfo').innerHTML=
    `<div><b>Current</b> #${cur.depth} · ${cur.branchLabel||'main'} · ${cur.children.length} children</div>
     <div style="margin-top:2px;font-size:10px">Path <b>${path.length}</b> · Siblings <b>${tree.siblings(cur.id).length}</b> · Total <b>${tree.nodes.size}</b> nodes</div>`;
  const mp=document.getElementById('memPath'),mc=document.getElementById('memCross');
  mp.innerHTML=currentMem.path&&currentMem.path.length?currentMem.path.map(x=>memItem(x,'path')).join(''):'<div class="mem-item" style="opacity:.45">No path memories</div>';
  mc.innerHTML=currentMem.cross&&currentMem.cross.length?currentMem.cross.map(x=>memItem(x,'cross')).join(''):'<div class="mem-item" style="opacity:.45">No cross-branch memories</div>';
  document.getElementById('branchList').innerHTML=tree.nodes.size+' nodes · '+(path[0]?path[0].branchLabel||'main':'');
}
function memItem(x,kind){
  const m=x.mem;const tags=(m.tags||[]).slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('');
  return `<div class="mem-item ${kind}"><span class="src">${kind==='path'?'path':'cross'}</span>${escapeHtml(m.text)}${tags}</div>`;
}

/* ===== Interactions ===== */
async function boot(){
  miniInit();
  try{const s=await API.state();installState(s);await refreshMem();selectedNode=tree.currentId;renderAll();centerOnCurrent();await renderSessions();}
  catch(e){console.error(e)}
  connectEventStream();  // B2: 订阅任务事件流, 实时更新节点状态徽标 (替代轮询)
}
/* ===== 多会话 (左侧栏 新建/切换/删除/归档/重命名) ===== */
let _activeSessionId=null;
async function renderSessions(){
  try{
    const d=await API.sessions();
    const list=d.sessions||[];_activeSessionId=d.active_id;
    const el=document.getElementById('sessionList');
    if(!el)return;
    const active=list.filter(s=>!s.archived);
    const archived=list.filter(s=>s.archived);
    const html=[];
    active.forEach(s=>html.push(sessionItemHTML(s)));
    if(archived.length){html.push('<div class="session-group-label">已归档</div>');archived.forEach(s=>html.push(sessionItemHTML(s)));}
    el.innerHTML=html.join('');
  }catch(e){console.warn('renderSessions failed',e);}
}
function sessionItemHTML(s){
  const isActive=s.id===_activeSessionId;
  const title=escapeHtml(s.title||'未命名会话');
  const sub=s.current_title?escapeHtml(s.current_title):(s.updated_at?relTime(s.updated_at):'空会话');
  const archBtn=s.archived?'↩':'🗄';
  const archTitle=s.archived?'取消归档':'归档';
  return `<div class="session-item ${isActive?'active':''} ${s.archived?'archived':''}" data-id="${s.id}" `
    +`onclick="switchSession('${s.id}')" ondblclick="renameSession('${s.id}')" title="双击重命名">`
    +`<div class="sess-body"><div class="sess-title">${title}</div><div class="sess-meta">${sub}</div></div>`
    +`<div class="sess-actions">`
    +`<button class="sess-act" title="${archTitle}" onclick="event.stopPropagation();archiveSession('${s.id}')">${archBtn}</button>`
    +`<button class="sess-act danger" title="删除会话" onclick="event.stopPropagation();deleteSession('${s.id}')">🗑</button>`
    +`</div></div>`;
}
function relTime(ts){
  const diff=Math.floor((Date.now()-ts*1000)/1000);
  if(diff<60)return '刚刚';
  if(diff<3600)return Math.floor(diff/60)+' 分钟前';
  if(diff<86400)return Math.floor(diff/3600)+' 小时前';
  if(diff<604800)return Math.floor(diff/86400)+' 天前';
  const d=new Date(ts*1000);return (d.getMonth()+1)+'/'+d.getDate();
}
function _applySessionState(d){
  installState(d.state);selectedNode=tree.currentId;
  Promise.resolve(refreshMem()).then(()=>{renderAll();centerOnCurrent();});
}
async function createSession(){
  try{
    const d=await API.sessionCreate({});
    _applySessionState(d);await renderSessions();toast('已新建会话');
  }catch(e){alert('新建会话失败：'+(e.message||e));}
}
async function switchSession(id){
  if(id===_activeSessionId)return;
  abortActiveChat();
  try{
    const d=await API.sessionSwitch(id);
    _applySessionState(d);await renderSessions();
  }catch(e){alert('切换会话失败：'+(e.message||e));}
}
async function deleteSession(id){
  if(!confirm('删除该会话？其对话树与记忆将被永久移除，且不可恢复。'))return;
  abortActiveChat();
  try{
    const d=await API.sessionDelete({id:id});
    _applySessionState(d);await renderSessions();toast('已删除会话');
  }catch(e){alert('删除失败：'+(e.message||e));}
}
async function archiveSession(id){
  try{await API.sessionArchive({id:id});await renderSessions();}
  catch(e){alert('归档失败：'+(e.message||e));}
}
async function renameSession(id){
  const title=prompt('重命名会话：','');
  if(title===null)return;
  try{await API.sessionRename({id:id,title:title});await renderSessions();}
  catch(e){alert('重命名失败：'+(e.message||e));}
}
/* ===== B2: 事件流订阅 (对应 herdr events.subscribe) ===== */
function connectEventStream(){
  if(typeof EventSource==='undefined')return;
  try{
    const es=new EventSource('/api/events');
    es.onmessage=ev=>{
      let d;try{d=JSON.parse(ev.data);}catch(_){return;}
      if(d&&d.type==='node.exec_state_changed')applyExecEvent(d.data||{});
    };
    es.onerror=()=>{/* 连接断开时浏览器会自动重连 */};
  }catch(e){console.warn('EventSource init failed',e);}
}
function applyExecEvent(d){
  if(!tree||!d.node_id)return;
  const n=tree.nodes.get(d.node_id);
  if(!n)return;
  n.execState=d.exec_state||n.execState;
  if(typeof d.progress==='number')n.execProgress=d.progress;
  if(d.detail!=null)n.execDetail=d.detail;
  // 定向更新该卡片的徽标 (不重渲整棵树, 避免打断拖拽)
  const card=document.querySelector('.node-card[data-id="'+CSS.escape(d.node_id)+'"]');
  if(!card)return;
  let wrap=card.querySelector('.exec-state-wrap');

async function sendMessage(){
  const f=document.getElementById('inputField');const text=f.value.trim();
  // 阶段 5.1: 单飞 —— 发送期间禁用输入框/回车, 防止同父节点下并发插入
  if((!text&&!_pendingAttaches.length)||chatSending)return;
  // 附件拼进消息 (图片 markdown / 文件链接), 空文本仅附件也可发送
  const fullText=_pendingAttaches.length
    ? (text?text+'\n\n':'')+attachMarkdown()
    : text;
  const branchLabel=tree.current?(tree.current.branchLabel||'main'):'main';
  const parentId=branchParentId||undefined;
  pushInputHist(text);
  // 乐观创建: 用户气泡 + 空 AI 卡 + 空 extras 容器 (思考/工具实时注入)
  const area=document.getElementById('messagesArea');
  const depth=tree.current?tree.current.depth+1:1;
  const turn=document.createElement('div');turn.className='turn';
  const userBubbleHtml=mdRender(fullText)||escapeHtml(fullText);
  turn.innerHTML=`<div class="turn-head"><span class="turn-badge">#${depth} ${branchLabel||'main'}</span></div>
    <div class="bubble-wrap">
      <div class="bubble-actions">
        <button class="bubble-act" title="复制原文" onclick="copyText(${JSON.stringify(fullText)})">⧉</button>
        <button class="bubble-act" title="编辑重发" onclick="editResendDraft(${JSON.stringify(fullText)})">✎</button>
      </div>
      <div class="bubble bubble-user">${userBubbleHtml}</div></div>
    <div class="ai-card answer-live"><div class="card-header"><div class="card-avatar">✦</div><span class="card-label">伊卡洛斯 · Ikaros</span>
      <span class="card-state"><span class="spinner"></span>生成中</span></div>
      <div class="card-body answer-body"></div></div>
    <div class="ai-extras"></div>`;
  area.appendChild(turn);area.scrollTop=area.scrollHeight;
  const answerBody=turn.querySelector('.answer-body');
  const extras=turn.querySelector('.ai-extras');
  const cardState=turn.querySelector('.card-state');
  const live={thinking:'',tools:{}};
  let accAnswer='';
  // 流式渲染限流: SSE delta 可能高频到达, 用 rAF 批处理避免每帧全量 mdRender 卡顿
  let _pendingMd=false;
  function flushMd(){
    _pendingMd=false;
    answerBody.innerHTML=mdRender(accAnswer)+(accAnswer?'<span class="typing-cursor"></span>':'');
    area.scrollTop=area.scrollHeight;
  }
  f.value='';f.style.height='auto';
  if(f.placeholder.indexOf('Fork')>=0)f.placeholder='从当前节点继续，或点树中节点跳转…';
  chatSending=true;f.disabled=true;
  const sb=document.getElementById('sendBtn');
  sb.style.background='var(--brand-danger)';
  sb.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
  sb.title='停止生成 (Esc)';
  sb.onclick=stopGenerating;
  const ac=new AbortController();activeChat=ac;
  try{
    await API.chatStream({message:fullText,parent_id:parentId,branch_label:branchLabel},(ev)=>{
      if(ev.type==='thinking'){
        live.thinking+=ev.delta;renderExtras(extras,live);area.scrollTop=area.scrollHeight;
      }else if(ev.type==='content'){
        accAnswer+=ev.delta;
        if(!_pendingMd){_pendingMd=true;requestAnimationFrame(flushMd)}
      }else if(ev.type==='tool_call'){
        live.tools[ev.id]={name:ev.name,args:ev.args||{},result:'',ok:null};
        renderExtras(extras,live);area.scrollTop=area.scrollHeight;
      }else if(ev.type==='tool_result'){
        if(live.tools[ev.id]){live.tools[ev.id].result=ev.result||'';live.tools[ev.id].ok=ev.ok;}
        renderExtras(extras,live);area.scrollTop=area.scrollHeight;
      }else if(ev.type==='usage'){
        // 上下文用量 + 缓存命中: 流式结束后由 usage 块推送
        live.usage=ev.usage||{};
        updateUsageBar(ev.usage, ev.model, ev.context_window);
      }else if(ev.type==='warn'){
        // 降级可见化: 黄色提示条, 不中断流
        showWarnBanner(turn,ev.message||'');
      }else if(ev.type==='done'){
        if(_pendingMd){_pendingMd=false;answerBody.innerHTML=mdRender(accAnswer)}
        if(cardState)cardState.remove();
        turn.querySelector('.ai-card')?.classList.remove('answer-live');
        // 用 store 渲染覆盖 live (含持久化 thinking/工具), 重渲染画布
        installState(ev.state);selectedNode=tree.currentId;
        branchParentId=null;
        Promise.resolve(refreshMem()).then(()=>{renderAll();fitView();});
        renderSessions();  // 刷新左侧栏会话预览 (当前节点摘要)
      }else if(ev.type==='error'){
        if(cardState)cardState.innerHTML='<span class="card-state stopped">⚠ 出错</span>';
        answerBody.innerHTML='<p style="color:#ef4444">[错误] '+escapeHtml(ev.message||'未知错误')+'</p>';
      }
    },ac.signal);
  }catch(e){
    if(e&&e.name==='AbortError'){
      // 主动中断 (Esc/切换节点): 温和提示, 树状态由后续 refresh 接管, 不会脏
      if(cardState)cardState.innerHTML='<span class="card-state stopped">■ 已停止</span>';
      answerBody.innerHTML=(accAnswer?mdRender(accAnswer):'<p style="opacity:.55">（已中断）</p>');
      if(accAnswer&&_pendingMd){_pendingMd=false;}
    }else{
      if(cardState)cardState.remove();
      answerBody.innerHTML='<p style="color:#ef4444">[请求失败] '+escapeHtml(e.message||String(e))+'</p>';
    }
  }
  chatSending=false;f.disabled=false;
  sb.style.background='var(--brand)';
  sb.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
  sb.title='Send';
  sb.onclick=sendMessage;
  clearAttaches();
  if(activeChat===ac)activeChat=null;
  branchParentId=null;
}

let _inputHist=[],_histIdx=-1;
function pushInputHist(t){
  if(!t)return;
  if(_inputHist[_inputHist.length-1]===t)return;
  _inputHist.push(t);if(_inputHist.length>50)_inputHist.shift();
  _histIdx=_inputHist.length;
}
function navHist(dir){
  const f=document.getElementById('inputField');
  if(dir<0){ // ↑
    if(_histIdx<=0)return;
    _histIdx--;f.value=_inputHist[_histIdx];autoResize(f);
  }else{     // ↓
    if(_histIdx>=_inputHist.length)return;
    _histIdx++;
    f.value=_histIdx===_inputHist.length?'':_inputHist[_histIdx];autoResize(f);
  }
}

function stopGenerating(){

function handleKey(e){
  // Enter / Ctrl+Enter 发送; Shift+Enter 换行; ↑↓ 输入历史; Esc 停止生成
  if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();sendMessage();}
  else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMessage();}
  else if(e.key==='ArrowUp'&&_inputHist.length&&!e.target.value.includes('\n')){e.preventDefault();navHist(-1);}
  else if(e.key==='ArrowDown'&&_histIdx>=0&&!e.target.value.includes('\n')){e.preventDefault();navHist(1);}
  else if(e.key==='Escape'&&chatSending){e.preventDefault();stopGenerating();}
}

/* ===== T7: 树节点键盘导航 (非输入态: ↑↓ 选择 / Enter 跳转 / F2 重命名 / Del 删除) ===== */
function treeNavList(){
  // 按画布 y(深度) 再 x(叶子序) 排序 -> 视觉顺序导航
  return [...tree.nodes.values()].sort((a,b)=>{
    const pa=nodePositions[a.id],pb=nodePositions[b.id];
    if(!pa||!pb)return 0;
    return (pa.y-pb.y)||(pa.x-pb.x);
  });
}
function treeNavSelect(d){
  if(!tree)return;
  const list=treeNavList();if(!list.length)return;
  let idx=list.findIndex(n=>n.id===selectedNode);
  if(idx<0)idx=0;else idx=(idx+d+list.length)%list.length;
  selectedNode=list[idx].id;
  renderNodes();renderEdges();
  // 选中卡片滚动到可视区
  const card=document.querySelector('.node-card[data-id="'+CSS.escape(selectedNode)+'"]');

document.addEventListener('keydown',e=>{

  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea')return;
  if(document.getElementById('cmdOverlay').classList.contains('show'))return;
  const k=e.key;
  if(k==='ArrowDown'){e.preventDefault();treeNavSelect(1);}
  else if(k==='ArrowUp'){e.preventDefault();treeNavSelect(-1);}
  else if(k==='ArrowRight'){e.preventDefault();if(selectedNode&&tree.nodes.get(selectedNode)&&tree.nodes.get(selectedNode).children.length){treeNavSelect(1);}}
  else if(k==='ArrowLeft'){e.preventDefault();treeNavSelect(-1);}
  else if(k==='Enter'&&selectedNode){e.preventDefault();doJump(selectedNode);}
  else if(k==='F2'&&selectedNode){e.preventDefault();renameNodePrompt(selectedNode);}
  else if(k==='Delete'&&selectedNode){
    const n=tree.nodes.get(selectedNode);
    if(n&&n.id!==tree.rootId&&confirm('删除该节点？其子节点将重挂到父节点。')){API.deleteNode(selectedNode).then(refresh);}
  }
});

let _cmdItems=[],_cmdIdx=0,_cmdSessions=[];
function cmdOpen(prefill){

function cmdFilter(){
  const q=document.getElementById('cmdInput').value.trim().toLowerCase();
  _cmdItems=[];
  // 1) 操作组（始终展示，匹配时过滤）
  const ops=[
    {icon:'＋',title:'新建会话',sub:'',kbd:'Ctrl+N',run:()=>createSession()},
    {icon:'🗄',title:'归档当前会话',sub:_cmdSessions.find(s=>s.id===_activeSessionId)?'归档后从列表隐藏':'—',run:()=>archiveSession(_activeSessionId)},
    {icon:'⇱',title:'聚焦输入框',sub:'发送消息',kbd:'Ctrl+F',run:focusInput},
    {icon:'⌕',title:'搜索会话',sub:'左侧栏过滤',kbd:'Ctrl+L',run:()=>{document.getElementById('sessionSearchInput').focus();}},
    {icon:'🎨',title:'切换主题',sub:'dark / warm / system 循环',run:()=>{const order=['dark','warm','system'];const i=order.indexOf(_themePref);switchTheme(order[(i+1)%3]);toast('主题：'+order[(i+1)%3]);}},
    {icon:'⟳',title:'重置画布视图',sub:'fit + 复位 pan/zoom',run:resetAll},
    {icon:'?',title:'快捷键帮助',sub:'本面板支持的所有快捷键',run:showHotkeys},
  ];
  if(!q||ops.some(o=>o.title.toLowerCase().includes(q)||(o.sub||'').toLowerCase().includes(q))){
    ops.forEach(o=>{if(!q||o.title.toLowerCase().includes(q)||(o.sub||'').toLowerCase().includes(q))_cmdItems.push({type:'op',...o});});
  }
  // 2) 会话组
  if(!q||_cmdSessions.some(s=>(s.title||'').toLowerCase().includes(q)||(s.current_title||'').toLowerCase().includes(q))){
    _cmdSessions.filter(s=>(!q||(s.title||'').toLowerCase().includes(q)||(s.current_title||'').toLowerCase().includes(q)))
      .slice(0,6).forEach(s=>{
        _cmdItems.push({type:'session',icon:s.id===_activeSessionId?'●':'○',title:s.title||'未命名会话',
          sub:(s.archived?'归档 · ':'')+(s.current_title||relTime(s.updated_at)),run:()=>switchSession(s.id)});
      });
  }
  // 3) 节点组（当前会话树）
  if(tree){
    let nodes=[...tree.nodes.values()];
    if(q)nodes=nodes.filter(n=>nodeText(n).toLowerCase().includes(q)||(n.branchLabel||'').toLowerCase().includes(q));
    nodes.slice(0,8).forEach(n=>{
      const isCur=n.id===tree.currentId;
      _cmdItems.push({type:'node',icon:isCur?'➤':'·',title:nodeText(n),
        sub:'#'+n.depth+' '+n.branchLabel+(isCur?' · current':'')+(n.meta&&n.meta.title?' · '+escapeHtml(n.meta.title):''),
        run:async()=>{cmdClose();await doJump(n.id);toast('已跳转：'+nodeText(n));}});
    });
  }
  _cmdIdx=0;cmdRender();
}
function cmdRender(){
  const list=document.getElementById('cmdList');
  if(!_cmdItems.length){list.innerHTML='<div class="cmd-empty">没有匹配结果 — Enter 直接发送该内容？</div>';return;}
  let html='';let lastType='';
  const typeLabel={op:'操作',session:'会话',node:'节点'};
  _cmdItems.forEach((it,i)=>{
    if(it.type!==lastType){html+=`<div class="cmd-group">${typeLabel[it.type]||''}</div>`;lastType=it.type;}
    html+=`<div class="cmd-item ${i===_cmdIdx?'active':''}" data-i="${i}" onmousemove="cmdHover(${i})" onclick="cmdExec(${i})">
      <span class="cmd-item-icon">${it.icon}</span>
      <div class="cmd-item-body"><div class="cmd-item-title">${escapeHtml(it.title)}</div>
      ${it.sub?`<div class="cmd-item-sub">${it.sub}</div>`:''}</div>
      ${it.kbd?`<span class="cmd-item-kbd">${it.kbd}</span>`:''}</div>`;
  });
  list.innerHTML=html;
  const act=list.querySelector('.cmd-item.active');
  if(act)act.scrollIntoView({block:'nearest'});
}
function cmdHover(i){_cmdIdx=i;cmdRender();}
function cmdNavigate(d){
  if(!_cmdItems.length)return;
  _cmdIdx=(_cmdIdx+d+_cmdItems.length)%_cmdItems.length;cmdRender();
}
function cmdExec(i){
  const it=_cmdItems[i];if(!it)return;
  cmdClose();
  if(it.run)it.run();
}
function cmdOnKey(e){
  if(e.key==='ArrowDown'){e.preventDefault();cmdNavigate(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdNavigate(-1);}
  else if(e.key==='Enter'){
    if(_cmdItems.length){e.preventDefault();cmdExec(_cmdIdx);}
    else{
      // 无匹配 -> 直接作为消息发送
      const q=document.getElementById('cmdInput').value.trim();
      if(q){e.preventDefault();cmdClose();document.getElementById('inputField').value=q;sendMessage();}
    }
  }
  else if(e.key==='Escape'){e.preventDefault();cmdClose();}
}

  const it=CT_MODELS.find(x=>x.model===active);

/* ===== T10: 文件拖拽上传 (拖入 -> base64 -> /api/upload -> 附件 chip -> 随消息发送) ===== */
let _pendingAttaches=[];   // [{url,name,size,isImage}]
const IMG_EXT=/\.(png|jpe?g|gif|webp|svg)$/i;
let _dragDepth=0;
window.addEventListener('dragenter',e=>{
  e.preventDefault();
  if(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')){
    _dragDepth++;
    document.getElementById('dropOverlay').classList.add('show');
  }
});
window.addEventListener('dragover',e=>{e.preventDefault();});
window.addEventListener('dragleave',e=>{
  e.preventDefault();
  _dragDepth=Math.max(0,_dragDepth-1);
  if(_dragDepth===0)document.getElementById('dropOverlay').classList.remove('show');
});
window.addEventListener('drop',async e=>{
  e.preventDefault();
  _dragDepth=0;
  document.getElementById('dropOverlay').classList.remove('show');
  const files=[...(e.dataTransfer&&e.dataTransfer.files||[])];
  if(!files.length)return;
  for(const f of files){
    if(f.size>20*1024*1024){toast('文件过大(>20MB): '+f.name);continue;}
    try{
      const b64=await fileToBase64(f);
      const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:f.name,data_b64:b64})});
      const j=await r.json();
      if(j.ok){
        _pendingAttaches.push({url:j.url,name:f.name,size:f.size,isImage:IMG_EXT.test(f.name)});
        renderAttachChips();
      }else{toast('上传失败: '+f.name);}
    }catch(err){toast('上传出错: '+f.name);}
  }
});
function fileToBase64(f){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{const s=String(rd.result||'');res(s.slice(s.indexOf(',')+1));};
    rd.onerror=rej;rd.readAsDataURL(f);
  });
}
function renderAttachChips(){
  const el=document.getElementById('attachChips');
  if(!el)return;
  el.innerHTML=_pendingAttaches.map((a,i)=>`<span class="attach-chip">
    ${a.isImage?`<img src="${a.url}" alt="">`:''}
    <span class="at-name">${escapeHtml(a.name)}</span>
    <span class="at-size">${(a.size/1024).toFixed(0)}KB</span>
    <span class="rm" title="移除" onclick="removeAttach(${i})">✕</span>
  </span>`).join('');
  el.style.display=_pendingAttaches.length?'':'none';
}
function removeAttach(i){_pendingAttaches.splice(i,1);renderAttachChips();}
function attachMarkdown(){
  return _pendingAttaches.map(a=>a.isImage?`![${a.name}](${a.url})`:`[📎 ${a.name}](${a.url})`).join('\n');
}
function clearAttaches(){_pendingAttaches=[];renderAttachChips();}

/* ===== 消息操作 (T2) ===== */
function copyText(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(msg||'已复制')).catch(()=>toast('复制失败'));
  }else{toast('复制不可用');}
}
async function copyMsgRaw(nodeId,idx){
  const n=tree.nodes.get(nodeId);if(!n)return;
  await ensureNodeMessages(n);            // M1: 确保对话内容已拉取
  const m=(n.messages||[]).filter(x=>x.role!=='system')[idx];
  if(!m)return;
  copyText(typeof m.content==='string'?m.content:JSON.stringify(m.content),'已复制消息原文');
}
async function editAndResend(nodeId,idx){
  // 把该节点的 user 消息载入输入框, 定位到其父节点 -> 编辑重发形成新分支
  const n=tree.nodes.get(nodeId);if(!n)return;
  await ensureNodeMessages(n);            // M1: 确保对话内容已拉取
  const msgs=(n.messages||[]).filter(x=>x.role!=='system');
  const m=msgs[idx];if(!m||m.role!=='user')return;
  const f=document.getElementById('inputField');
  f.value=typeof m.content==='string'?m.content:JSON.stringify(m.content);
  autoResize(f);
  const target=n.parentId&&tree.nodes.get(n.parentId)?n.parentId:tree.rootId;
  if(target&&target!==tree.currentId){
    doJump(target).then(()=>{
      branchParentId=tree.currentId;
      f.placeholder='↳ Fork from '+nodeText(tree.nodes.get(target))+'… (编辑重发)';
      focusInput();
    });
  }else{
    branchParentId=n.parentId||null;
    f.placeholder='↳ Fork from '+nodeText(n)+'… (编辑重发)';
    focusInput();
  }
  toast('已载入编辑模式 — 修改后 Enter 发送将创建新分支');
}
async function retryNode(nodeId){
  // 重试: 跳回父节点, 用该节点的 user 消息重新发送
  const n=tree.nodes.get(nodeId);if(!n)return;
  await ensureNodeMessages(n);            // M1: 确保对话内容已拉取
  const um=(n.messages||[]).find(m=>m.role==='user');
  if(!um){toast('没有可重试的用户消息');return;}
  const parentId=n.parentId&&tree.nodes.get(n.parentId)?n.parentId:tree.rootId;
  doJump(parentId).then(()=>{
    const f=document.getElementById('inputField');
    f.value=typeof um.content==='string'?um.content:JSON.stringify(um.content);
    autoResize(f);sendMessage();
  });
}
function toggleFavNode(nodeId){
  try{
    const favs=JSON.parse(localStorage.getItem('conv-tree-favs')||'[]');
    const i=favs.indexOf(nodeId);
    if(i>=0){favs.splice(i,1);toast('已取消收藏');}
    else{favs.push(nodeId);toast('已收藏节点 ★');}
    localStorage.setItem('conv-tree-favs',JSON.stringify(favs));
  }catch(e){toast('收藏失败');}
}
function isFavNode(nodeId){
  try{return JSON.parse(localStorage.getItem('conv-tree-favs')||'[]').includes(nodeId)}catch(e){return false}
}

/* ═══ 特效层 v3 JS (2026-08-03) ═══ */
/* ── 粒子系统 v3: 多色尾迹 / 点击迸发 / 环形冲击波 / 星火 + 可见性暂停 ── */
(function fxParticles(){
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (mq.matches) return;
  var cv = document.createElement('canvas');
  cv.id = 'fx-canvas-ct';
  document.body.appendChild(cv);
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = Math.min(1.75, window.devicePixelRatio || 1);

  /* 从 CSS 变量读品牌色 (支持主题切换 / 自定义强调色) */
  var brandRGB = '19,228,37', oppositeRGB = '236,27,218';
  function readBrand(){
    try{
      var bv = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim();
      if(bv && bv[0]==='#'){
        var h=parseInt(bv.slice(1,3),16), s=parseInt(bv.slice(3,5),16), l=parseInt(bv.slice(5,7),16);
        brandRGB = h+','+s+','+l;
      }
      var ov = getComputedStyle(document.documentElement).getPropertyValue('--brand-opposite').trim();
      if(ov && ov[0]==='#'){
        var h2=parseInt(ov.slice(1,3),16), s2=parseInt(ov.slice(3,5),16), l2=parseInt(ov.slice(5,7),16);
        oppositeRGB = h2+','+s2+','+l2;
      }
    }catch(e){}
  }
  readBrand();
  /* 主题切换后刷新颜色 */
  new MutationObserver(readBrand).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','style']});

  function resize(){
    W = cv.width = Math.floor(innerWidth * DPR);
    H = cv.height = Math.floor(innerHeight * DPR);
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  }
  resize(); addEventListener('resize', resize);

  /* 对象池: 扩容至 280, 支持 richer 效果 */
  var POOL = 280, parts = [], pool = [];
  for (var i = 0; i < POOL; i++) pool.push({on:false});
  function get(){
    for (var i = 0; i < POOL; i++) if (!pool[i].on) return pool[i];
    return null;
  }
  /* spawn: n 个粒子, spread 速度散布, hueMode: 0=品牌绿, 1=对偶色(粉), 2=混合彩虹 */
  function spawn(x, y, n, spread, hueMode){
    for (var i = 0; i < n; i++){
      var p = get(); if (!p) return;
      var a = Math.random() * Math.PI * 2, sp = Math.random() * spread + 0.5;
      p.on = true;
      p.x = x * DPR; p.y = y * DPR;
      p.vx = Math.cos(a) * sp * DPR; p.vy = Math.sin(a) * sp * DPR - 0.5 * DPR;
      p.life = 1; p.decay = 0.014 + Math.random() * 0.022;
      p.r = (1 + Math.random() * 2.5) * DPR;
      p.spark = Math.random() < 0.15; /* 15% 星火粒子 (发光更亮) */
      /* 颜色: 60% 品牌, 25% 对偶色, 15% 白色点缀 */
      var cr = Math.random();
      if(hueMode===1) p.rgb = oppositeRGB;
      else if(hueMode===2) p.rgb = cr<.5?brandRGB:oppositeRGB;
      else p.rgb = cr<.6?brandRGB:(cr<.85?oppositeRGB:'255,255,255');
      parts.push(p);
    }
  }
  /* 环形冲击波 (点击时) */
  var rings = [];
  function ringBurst(x, y, maxR){
    rings.push({x:x*DPR,y:y*DPR,r:maxR*0.1*DPR,maxR:maxR*DPR,life:1,decay:0.035});
  }
  function frame(){
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    /* 粒子 */
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.024 * DPR; p.vx *= 0.988;
      p.life -= p.decay;
      if (p.life <= 0 || p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30){
        p.on = false; parts.splice(i, 1); continue;
      }
      var alpha = p.life * (p.spark ? 0.85 : 0.55);
      var rad = Math.max(0.3, p.r * p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.rgb + ',' + alpha.toFixed(3) + ')';
      ctx.fill();
      /* 星火: 额外光晕 */
      if(p.spark){
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.rgb + ',' + (alpha * 0.15).toFixed(3) + ')';
        ctx.fill();
      }
    }
    /* 冲击环 */
    for (var j = rings.length - 1; j >= 0; j--){
      var r = rings[j];
      r.r += (r.maxR - r.r) * 0.12;
      r.life -= r.decay;
      if (r.life <= 0){ rings.splice(j, 1); continue; }
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(' + brandRGB + ',' + (r.life * 0.4).toFixed(3) + ')';
      ctx.lineWidth = 2 * r.life * DPR;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    raf = requestAnimationFrame(frame);
  }
  var raf = null, running = false;
  function start(){ if (!running && !mq.matches){ running = true; raf = requestAnimationFrame(frame); } }
  function stop(){ if (running){ running = false; cancelAnimationFrame(raf); } }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stop(); else start();
  });
  start();

  /* 鼠标尾迹 v3: 移动越快粒子越多, 带速度感知 */
  var lx = -99, ly = -99, lastT = 0;
  addEventListener('pointermove', function(e){
    var now = Date.now();
    if (now - lastT < 16) return; lastT = now;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 6) return;
    lx = e.clientX; ly = e.clientY;
    /* 按速度生成 1-3 粒子 (更快 = 更多) */
    var n = dist > 40 ? 3 : (dist > 18 ? 2 : 1);
    spawn(e.clientX, e.clientY, n, dist > 30 ? 1.8 : 1.2);
  }, { passive: true });

  /* 点击迸发: 粒子 + 冲击环 */
  addEventListener('pointerdown', function(e){
    spawn(e.clientX, e.clientY, 8, 2.8);
    ringBurst(e.clientX, e.clientY, 28);
  }, { passive: true });

  /* 树节点拖拽迸发: 双色 (品牌+对偶) + 更大环 */
  document.addEventListener('pointerdown', function(e){
    var t = e.target;
    if (t && t.closest && t.closest('.node-card, .node-handle')){
      spawn(e.clientX, e.clientY, 14, 3.5, 2);
      ringBurst(e.clientX, e.clientY, 40);
    }
  }, { passive: true });

  /* 发送按钮特殊迸发 (品牌绿向上飞) */
  document.addEventListener('click', function(e){
    if(e.target.closest && e.target.closest('.send-btn')){
      spawn(e.clientX, e.clientY, 16, 3.0, 0);
      ringBurst(e.clientX, e.clientY, 36);
      /* 向上飞的粒子 */
      var rect = e.target.closest('.send-btn').getBoundingClientRect();
      for(var k=0;k<6;k++){
        var p = get(); if(!p) break;
        p.on = true; p.x = (rect.left + rect.width/2) * DPR;
        p.y = (rect.top + rect.height/2) * DPR;
        p.vx = (Math.random()-0.5) * 2 * DPR;
        p.vy = -(2+Math.random()*3) * DPR;
        p.life = 1; p.decay = 0.02; p.r = (1.5+Math.random()*2)*DPR;
        p.rgb = brandRGB; p.spark = true;
        parts.push(p);
      }
    }
  }, { passive: true });
})();
