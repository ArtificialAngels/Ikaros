<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Explore — Conversation Tree v3</title>
<link rel="icon" href="data:,">
<!-- 不引用外部 Google Fonts: 离线/代理环境连不上会阻塞标签页 load 事件导致一直转圈,
     改用系统字体栈 (Inter→系统无衬线, JetBrains Mono→等宽) 优雅降级。 -->
<style>
/* ===== Design Tokens ===== */
/* 自托管字体 (explore.poker 同款, 零外部依赖) */
@font-face{font-family:'Space Grotesk';src:url('/assets/space-grotesk.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Inter';src:url('/assets/inter.woff2') format('woff2');font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('/assets/jetbrains-mono.woff2') format('woff2');font-display:swap}
:root{
  --brand:#13E425;--brand-secondary:#13E425;--brand-danger:#EF4444;--brand-opposite:#EC1BDA;
  --bg:#101010;--bg-modal:#222;--bg-card:#222;--bg-card-up:#222;--bg-card-down:#222;
  --bg-floating:#2f2f2f;--bg-btn:#3c3c3c;--bg-btn-hover:#5e5e5e;--bg-item:#363636;--bg-item-hover:#484848;
  --bg-usermsg:#4c4c4c;--bg-input:#3a3a3a;--bg-bar:#5a5a5a;--bg-separator:#848484;
  --bg-quotation:#313131;--bg-usermsg-file:#1c1c1c;
  --border-std:#484848;--border-divider:#373737;--border-turn:#4c4c4c;
  --text-primary:#ffffff;--text-secondary:#d1d1d1;--text-tertiary:#999;--text-quaternary:#777;
  --text-header-secondary:#e5e5e5;--text-turn-title:#aaa;
  --scrollbar-thumb-card:#888;--scrollbar-thumb-usermsg:#ccc;--scrollbar-thumb-inputarea:#bbb;
  --shadow-card:-4px 8px 24px rgba(0,0,0,.4);--shadow-btn:-2px 4px 4px rgba(0,0,0,.5);
    --shadow-usermsg:-2px 4px 12px rgba(0,0,0,.6);
  --color-success:#22c55e;--color-warning:#f59e0b;--color-info:#6366f1;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  /* 列配色 (chattree columnColor): 按深度列分配, 深色底霓虹色板 */
    --col0:#13E425;--col1:#00D4FF;--col2:#FFB020;--col3:#FF5DA2;--col4:#8B5CF6;--col5:#F43F5E;
    /* ── 特效统一令牌 (v3 ─ 参考 ai.explore.poker/chat) ── */
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --glow-brand:0 0 24px rgba(19,228,37,.18);
    --glow-brand-strong:0 0 32px rgba(19,228,37,.34);
    --glow-hover:0 8px 36px rgba(0,0,0,.5),0 0 24px rgba(19,228,37,.10);
    --lift:translateY(-3px);
    --lift-strong:translateY(-5px) scale(1.012);
    --border-glow:0 0 0 1px var(--brand);
    --glass-blur:blur(12px);
    --shimmer:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%);
  }
[data-theme="warm"]{
  --brand:#F45F28;--brand-secondary:#CF9580;--brand-danger:#CD5C5C;--brand-opposite:#4682B4;
  --bg:#F2EADB;--bg-modal:#EBE8E1;--bg-card:#EBE8E1;--bg-card-up:#EBE8E1;--bg-card-down:#EBE8E1;
  --bg-floating:#E1DED7;--bg-btn:#D7D4CD;--bg-btn-hover:#AFA593;--bg-item:#DCD9D2;--bg-item-hover:#D2CFC8;
  --bg-usermsg:#D7CDB9;--bg-input:#E6E3DC;--bg-bar:#E1DED7;--bg-separator:#BEB9AF;
  --bg-quotation:#E1DEDA;--bg-usermsg-file:#EBE8E1;
  --border-std:#D7D2C8;--border-divider:#CDC8BE;--border-turn:#D2CDC3;
  --text-primary:#50320A;--text-secondary:#5F504B;--text-tertiary:#918782;--text-quaternary:#AAA098;
  --text-header-secondary:#554641;--text-turn-title:#877870;
  --scrollbar-thumb-card:#B4AFA5;--scrollbar-thumb-usermsg:#B9B1A5;--scrollbar-thumb-inputarea:#BEB9AF;
  --shadow-card:-4px 8px 24px rgba(0,0,0,.08);--shadow-btn:-2px 4px 4px rgba(0,0,0,.12);
    --shadow-usermsg:0 2px 12px rgba(0,0,0,.1);
}
[data-theme="midnight"]{
  --brand:#8B9CFF;--brand-secondary:#8B9CFF;--brand-danger:#FF6B6B;--brand-opposite:#FF7BD5;
  --bg:#0E1116;--bg-modal:#171C26;--bg-card:#171C26;--bg-card-up:#1A2130;--bg-card-down:#141924;
  --bg-floating:#232B3C;--bg-btn:#2C3549;--bg-btn-hover:#3B4761;--bg-item:#252E42;--bg-item-hover:#33405A;
  --bg-usermsg:#3A4254;--bg-input:#212838;--bg-bar:#2A3244;--bg-separator:#3D4A66;
  --bg-quotation:#1B2231;--bg-usermsg-file:#141924;
  --border-std:#2F3850;--border-divider:#232B3C;--border-turn:#39456A;
  --text-primary:#E8ECF8;--text-secondary:#C3CBDF;--text-tertiary:#8B95AD;--text-quaternary:#5F6B85;
  --text-header-secondary:#D6DCEC;--text-turn-title:#9AA5BD;
  --scrollbar-thumb-card:#55618A;--scrollbar-thumb-usermsg:#8B95AD;--scrollbar-thumb-inputarea:#6B7798;
  --shadow-card:-4px 8px 24px rgba(0,0,0,.5);--shadow-btn:-2px 4px 4px rgba(0,0,0,.55);
    --shadow-usermsg:-2px 4px 12px rgba(0,0,0,.6);
}
[data-theme="forest"]{
  --brand:#7BC47F;--brand-secondary:#7BC47F;--brand-danger:#E06C5A;--brand-opposite:#E0A458;
  --bg:#101412;--bg-modal:#181E1A;--bg-card:#181E1A;--bg-card-up:#1C241F;--bg-card-down:#141A16;
  --bg-floating:#232C26;--bg-btn:#2C382F;--bg-btn-hover:#3C4C40;--bg-item:#263128;--bg-item-hover:#34453A;
  --bg-usermsg:#3A463D;--bg-input:#202821;--bg-bar:#2A342C;--bg-separator:#3C4C40;
  --bg-quotation:#1A211C;--bg-usermsg-file:#141A16;
  --border-std:#2E3A32;--border-divider:#222C25;--border-turn:#3A4A3F;
  --text-primary:#EAF3EA;--text-secondary:#C4D2C5;--text-tertiary:#8DA18F;--text-quaternary:#5F7361;
  --text-header-secondary:#D5E2D6;--text-turn-title:#98AB9A;
  --scrollbar-thumb-card:#54685A;--scrollbar-thumb-usermsg:#8DA18F;--scrollbar-thumb-inputarea:#6B8070;
  --shadow-card:-4px 8px 24px rgba(0,0,0,.5);--shadow-btn:-2px 4px 4px rgba(0,0,0,.55);
    --shadow-usermsg:-2px 4px 12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
color:var(--text-primary);display:flex;height:100vh;transition:background .3s,color .3s;}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb-card,#888);border-radius:6px}
.messages-area::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb-usermsg,#ccc)}
.input-field::-webkit-scrollbar-thumb,textarea::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb-inputarea,#bbb)}
.app{display:flex;width:100%;height:100%}
:root{--sidebar-w:180px;--tree-w:300px}

/* ===== Resizable Splitter ===== */
.splitter{width:6px;min-width:6px;background:transparent;cursor:col-resize;position:relative;
z-index:50;flex-shrink:0;transition:background .15s}
.splitter::after{content:'';position:absolute;top:0;bottom:0;left:2px;right:2px;
background:var(--border-divider);border-radius:1px;transition:background .15s}
.splitter:hover::after,.splitter.active::after{background:var(--brand)}
.splitter.active{background:rgba(19,228,37,.06)}

/* ===== Sidebar ===== */
.sidebar{width:var(--sidebar-w);min-width:120px;max-width:300px;background:var(--bg-modal);
display:flex;flex-direction:column;transition:background .35s var(--ease-out);overflow:hidden;
position:relative}
.sidebar::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;opacity:0;
background:linear-gradient(to bottom,transparent,var(--brand),transparent);
transition:opacity .4s var(--ease-out);pointer-events:none}
.sidebar:hover::after{opacity:.4}
.sidebar-header{padding:16px 14px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border-divider)}
.logo-icon{width:26px;height:26px;background:var(--brand);border-radius:7px;display:flex;align-items:center;
justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#000;flex-shrink:0;
box-shadow:0 0 12px rgba(19,228,37,.35);transition:box-shadow .3s var(--ease-out),transform .3s var(--ease-spring)}
.logo-icon:hover{box-shadow:0 0 20px rgba(19,228,37,.5);transform:scale(1.08)}
.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;letter-spacing:-.3px}
.sidebar-nav{flex:1;padding:8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;
color:var(--text-secondary);font-size:13px;transition:all .2s var(--ease-out);margin-bottom:1px}
.nav-item:hover{background:var(--bg-item-hover);color:var(--text-primary);
box-shadow:inset 2px 0 0 var(--brand),0 0 12px rgba(19,228,37,.08)}
.nav-item.active{background:var(--bg-item);color:var(--text-primary);font-weight:500;
box-shadow:inset 2px 0 0 var(--brand),0 0 14px rgba(19,228,37,.10)}
.nav-icon{width:15px;height:15px;opacity:.7;flex-shrink:0;transition:opacity .2s var(--ease-out)}
.nav-item.active .nav-icon{opacity:1;filter:drop-shadow(0 0 4px rgba(19,228,37,.5))}
.nav-sub{font-size:10px;color:var(--text-quaternary);text-transform:uppercase;letter-spacing:.8px;padding:8px 10px 2px}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--border-divider)}
/* ── 会话列表 (左侧栏 多会话) ── */
.nav-section{margin-top:2px}
.nav-section-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 6px}
.icon-btn{background:transparent;border:1px solid var(--border-divider);color:var(--text-tertiary);
width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;display:flex;
align-items:center;justify-content:center;transition:all .2s var(--ease-out);flex-shrink:0}
.icon-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--bg-item);
box-shadow:0 0 10px rgba(19,228,37,.2)}
.session-list{display:flex;flex-direction:column;gap:1px;padding:2px 2px 4px}
.session-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;
color:var(--text-secondary);position:relative;transition:all .2s var(--ease-out)}
.session-item:hover{background:var(--bg-item-hover);color:var(--text-primary);transform:translateX(2px)}
.session-item.active{background:var(--bg-item);color:var(--text-primary);
box-shadow:inset 2px 0 0 var(--brand),0 0 10px rgba(19,228,37,.08)}
.session-item.active .sess-title{font-weight:500}
.session-item.archived{opacity:.55}
.sess-body{flex:1;min-width:0}
.sess-title{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-meta{font-size:10px;color:var(--text-quaternary);margin-top:1px;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.sess-actions{display:none;gap:1px;align-items:center;flex-shrink:0}
.session-item:hover .sess-actions{display:flex}
.sess-act{background:transparent;border:none;color:var(--text-tertiary);cursor:pointer;
font-size:12px;padding:2px 4px;border-radius:4px;line-height:1}
.sess-act:hover{background:var(--bg-card);color:var(--text-primary)}
.sess-act.danger:hover{color:var(--brand-danger)}
.session-group-label{font-size:10px;color:var(--text-quaternary);text-transform:uppercase;
letter-spacing:.6px;padding:10px 10px 2px}
.theme-switcher{display:flex;gap:4px;margin-bottom:6px}
.theme-btn{flex:1;padding:5px 0;border:1px solid var(--border-std);border-radius:5px;background:transparent;
color:var(--text-secondary);font-size:11px;cursor:pointer;transition:all .2s var(--ease-out);font-family:inherit}
.theme-btn:hover{border-color:var(--text-tertiary);box-shadow:0 0 8px rgba(255,255,255,.06)}
.theme-btn.active{border-color:var(--brand);color:var(--brand);background:rgba(19,228,37,.06);
box-shadow:0 0 12px rgba(19,228,37,.15)}
.reset-btn{width:100%;padding:6px 0;border:1px solid var(--border-std);border-radius:5px;background:transparent;
color:var(--text-tertiary);font-size:11px;cursor:pointer;font-family:inherit;transition:all .2s var(--ease-out)}
.reset-btn:hover{border-color:var(--brand-danger);color:var(--brand-danger);box-shadow:0 0 10px rgba(239,68,68,.12)}

/* ===== Tree Canvas ===== */
.tree-panel{width:var(--tree-w);background:var(--bg);border-right:none;
display:flex;flex-direction:column;transition:background .3s;position:relative;overflow:hidden}
.tree-panel-head{padding:10px 14px;border-bottom:1px solid var(--border-divider);display:flex;
align-items:center;justify-content:space-between;flex-shrink:0}
.tree-panel-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
display:flex;align-items:center;gap:6px}
.tree-panel-title .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);
box-shadow:0 0 8px var(--brand);animation:dotPulse 2.4s var(--ease-out) infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 6px var(--brand)}50%{box-shadow:0 0 14px var(--brand),0 0 24px rgba(19,228,37,.4)}}
.tree-zoom-info{font-size:10px;color:var(--text-quaternary);font-family:'JetBrains Mono',monospace}

.canvas-wrap{flex:1;position:relative;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none}
.canvas-wrap:active{cursor:grabbing}
.canvas-wrap.panning{cursor:grabbing;user-select:none;-webkit-user-select:none}
.canvas-grid{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
background-image:radial-gradient(circle,var(--border-divider) 1px,transparent 1px);
background-size:24px 24px;opacity:.5}
.canvas-layer{position:absolute;top:0;left:0;transform-origin:0 0;z-index:1}
.edges-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:2;overflow:visible}
.nodes-layer{position:absolute;top:0;left:0;z-index:3}
.temp-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:10;overflow:visible}

/* ===== Node Card ===== */
.node-card{position:absolute;background:var(--bg-card);border:1.5px solid var(--border-std);
border-radius:var(--radius-md);padding:8px 10px;width:180px;
box-shadow:var(--shadow-card);cursor:pointer;
transition:border-color .2s var(--ease-out),box-shadow .25s var(--ease-out),opacity .25s,transform .35s cubic-bezier(.22,.9,.28,1);
font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.4;user-select:none;
transform:translate(var(--nx,0),var(--ny,0)) translate(-50%,-50%) scale(var(--scale,1));will-change:transform,box-shadow}
@keyframes nodeIn{from{opacity:0;transform:translate(var(--nx,0),var(--ny,0)) translate(-50%,-50%) scale(calc(var(--scale,1)*0.6))}}
.node-card.node-enter{animation:nodeIn .4s cubic-bezier(.22,.9,.28,1)}
/* 拖拽节点时禁用位置过渡, 保证跟手 */
body.dragging-node .node-card{transition:none}
.node-card:hover{border-color:var(--text-tertiary);box-shadow:var(--glow-hover);z-index:5;opacity:1!important}
.node-card.selected{border-color:var(--text-secondary);box-shadow:0 0 0 1px var(--text-secondary),0 0 18px rgba(255,255,255,.06)}
.node-card.current{border-color:var(--brand)!important;box-shadow:0 0 20px rgba(19,228,37,.2)!important}

/* 列配色: 节点顶部 2px 色条 (不占 border-left 的类型色) */
.node-card.col-0{border-top:2px solid var(--col0)}
.node-card.col-1{border-top:2px solid var(--col1)}
.node-card.col-2{border-top:2px solid var(--col2)}
.node-card.col-3{border-top:2px solid var(--col3)}
.node-card.col-4{border-top:2px solid var(--col4)}
.node-card.col-5{border-top:2px solid var(--col5)}
/* node type accent bar + colors */
.node-card.trunk{border-left:3px solid #555}
.node-card.branch{border-left:3px solid var(--color-info)}
.node-card.conclusion{border-left:3px solid var(--color-warning)}
.node-card.merge_point{border-left:3px solid var(--brand-opposite)}
.node-card:not(.is-valid){opacity:.45;border-left:3px solid var(--brand-danger)}

.node-card .node-depth{font-size:9px;color:var(--text-quaternary);margin-bottom:3px}
.node-card .node-label{color:var(--text-secondary);font-weight:500;margin-bottom:1px;
display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
overflow:hidden;word-break:break-word;line-height:1.45}
.node-card:hover .node-label,.node-card.selected .node-label{color:var(--text-primary)}
.node-card .node-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.node-card .node-tag{font-size:8.5px;padding:1px 5px;border-radius:3px;line-height:1.4;
white-space:nowrap}
.node-card .tag-branch{background:rgba(99,102,241,.15);color:var(--color-info)}
.node-card .tag-conclusion{background:rgba(245,158,11,.15);color:var(--color-warning)}
.node-card .tag-merged{background:rgba(236,27,218,.12);color:var(--brand-opposite)}
.node-card .tag-abandoned{background:rgba(239,68,68,.12);color:var(--brand-danger)}
.node-card .tag-current{background:rgba(19,228,37,.12);color:var(--brand)}
/* 代理归属徽标 (ekko 模式): Hermes 用 opposite 品牌色, Ikaros 用低调灰 */
.node-card .agent-hermes{color:var(--brand-opposite);font-weight:600}
.node-card .agent-ikaros{color:var(--text-quaternary)}

/* Handle connection points */
.node-handle{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--border-std);
border:1.5px solid var(--bg-card);left:50%;transform:translateX(-50%);z-index:6;cursor:crosshair;
transition:background .15s,transform .15s,box-shadow .15s;opacity:0}
.node-card:hover .node-handle,.node-card.selected .node-handle{opacity:1}
.node-handle:hover{background:var(--brand);transform:translateX(-50%) scale(1.4);box-shadow:0 0 8px var(--brand)}
.node-handle.source{bottom:-6px}
.node-handle.target{top:-6px}
.node-handle.dragging{background:var(--brand);transform:translateX(-50%) scale(1.6);opacity:1;
box-shadow:0 0 14px var(--brand);animation:pulse-handle .6s ease-in-out infinite}
@keyframes pulse-handle{0%,100%{box-shadow:0 0 8px var(--brand)}50%{box-shadow:0 0 18px var(--brand)}}

/* 折叠按钮 (右上角): 展开态 '−' / 折叠态 '+N' (N=子树其他节点数) */
.node-fold{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;
background:var(--bg-floating);border:1.5px solid var(--border-std);color:var(--text-tertiary);
font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
cursor:pointer;z-index:7;transition:all .15s;font-family:'JetBrains Mono',monospace;opacity:.55}
.node-card:hover .node-fold{opacity:1}
.node-fold:hover{border-color:var(--brand);color:var(--brand);background:var(--bg-item)}
.node-fold.collapsed{background:var(--brand);color:#000;border-color:var(--brand);opacity:.95}
.node-fold.collapsed:hover{background:var(--brand);color:#000}
.node-fold .fold-count{font-size:8px;margin-left:0;font-weight:700}

/* Edge (bezier) — 参照 chattree: 透明宽热区触发 hover, 主路径发光, 中点'+'快捷分支 */
.edge-path{fill:none;stroke:var(--border-std);stroke-width:1.5;transition:stroke .2s,stroke-width .2s,filter .2s,opacity .2s}
.edge-hotzone{fill:none;stroke:transparent;stroke-width:18;cursor:pointer;pointer-events:stroke;vector-effect:non-scaling-stroke}
/* 列配色: 边按父节点深度列着色 (半透明), hover 发光时被品牌绿规则覆盖 */
.edge-path.parent-edge.col-0{stroke:var(--col0);opacity:.5}
.edge-path.parent-edge.col-1{stroke:var(--col1);opacity:.5}
.edge-path.parent-edge.col-2{stroke:var(--col2);opacity:.5}
.edge-path.parent-edge.col-3{stroke:var(--col3);opacity:.5}
.edge-path.parent-edge.col-4{stroke:var(--col4);opacity:.5}
.edge-path.parent-edge.col-5{stroke:var(--col5);opacity:.5}
.edge-group:hover .edge-path.parent-edge{stroke:var(--brand);stroke-width:2.2;filter:drop-shadow(0 0 6px var(--brand));opacity:.95}
.edge-group:hover .edge-path.merge-line{stroke:var(--brand-opposite);stroke-width:2.2;opacity:.95;filter:drop-shadow(0 0 6px var(--brand-opposite))}
.edge-add{opacity:0;cursor:pointer;transition:opacity .15s;pointer-events:all}
.edge-group:hover .edge-add{opacity:1}
.edge-add circle{fill:var(--bg-floating);stroke:var(--brand);stroke-width:1.6;transition:fill .15s,stroke .15s}
.edge-add:hover circle{fill:var(--brand);stroke:var(--brand)}
.edge-add .edge-add-plus{stroke:var(--brand);stroke-width:2;fill:none;stroke-linecap:round;transition:stroke .15s}
.edge-add:hover .edge-add-plus{stroke:#000}
.edge-path.highlight{stroke:var(--text-secondary);stroke-width:2.5;filter:drop-shadow(0 0 3px rgba(255,255,255,.1))}
.edge-path.merge-line{stroke:var(--brand-opposite);stroke-width:1.5;stroke-dasharray:6 4;opacity:.5}
.edge-path.temp-line{stroke:var(--brand);stroke-width:2;stroke-dasharray:8 4;opacity:.8}
.edge-path.selected-edge{stroke:var(--brand);stroke-width:2.5}
.arrow-marker{fill:var(--border-std)}

/* ===== 工具调用小窗 (toolDock): 可折叠 / 上下边界可拖 / 无级滚动 ===== */
#toolDock{position:absolute;right:14px;bottom:120px;width:400px;height:260px;z-index:40;
background:var(--bg-modal);border:1.5px solid var(--border-std);border-radius:12px;
display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden;
transition:height .18s var(--ease-out),box-shadow .25s var(--ease-out),border-color .25s var(--ease-out)}
#toolDock:hover{border-color:rgba(19,228,37,.3);box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 24px rgba(19,228,37,.08)}
#toolDock.resizing{transition:none}
#toolDock.moving{transition:none}
body.dock-moving{cursor:grabbing}
#toolDock.collapsed{height:32px!important}
.tool-dock-head{height:32px;min-height:32px;flex:none;display:flex;align-items:center;gap:6px;
padding:0 6px 0 12px;cursor:grab;border-bottom:1px solid var(--border-divider);
font-size:12px;color:var(--text-secondary);user-select:none;
background:color-mix(in srgb,var(--bg-card) 60%,transparent)}
#toolDock.collapsed .tool-dock-head{border-bottom:none}
.tool-dock-head:hover{color:var(--text-primary)}
.tool-dock-icon{font-size:11px}
.tool-dock-title{font-weight:600}
.tool-dock-count{background:var(--bg-item);color:var(--text-tertiary);font-size:10px;padding:1px 7px;border-radius:10px;font-family:'JetBrains Mono',monospace}
.tool-dock-arrow{margin-left:auto;font-size:10px;color:var(--text-tertiary);transition:transform .18s}
#toolDock.collapsed .tool-dock-arrow{transform:rotate(-90deg)}
.tool-dock-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.tool-dock-body .tool-card{flex:none}
.tool-dock-empty{font-size:11px;color:var(--text-quaternary);padding:14px 4px;text-align:center}
/* 上下边界拖动手柄 (各 7px 热区; 放 dock 内部边缘, 避免被 overflow:hidden 裁剪) */
.tool-dock-resize{position:absolute;left:0;right:0;height:7px;cursor:ns-resize;z-index:6}
.tool-dock-resize.top{top:0}
.tool-dock-resize.bottom{bottom:0}
.tool-dock-resize.top:hover,.tool-dock-resize.bottom:hover{background:rgba(19,228,37,.12)}
#toolDock.collapsed .tool-dock-resize{display:none}

/* ===== Tree Info + Memory ===== */
.tree-info{padding:8px 12px;border-top:1px solid var(--border-divider);font-size:11px;color:var(--text-tertiary);flex-shrink:0}
.tree-info b{color:var(--text-secondary);font-weight:500}
.mem-head{padding:8px 12px 4px;border-top:1px solid var(--border-divider);font-size:10px;
text-transform:uppercase;letter-spacing:.6px;color:var(--text-quaternary);display:flex;align-items:center;gap:5px;flex-shrink:0}
.mem-list{max-height:140px;overflow-y:auto;padding:0 8px 8px;flex-shrink:0}
.mem-item{background:var(--bg-modal);border:1px solid var(--border-divider);border-radius:6px;padding:6px 7px;
margin-bottom:4px;font-size:10.5px;line-height:1.4;color:var(--text-secondary);
transition:border-color .2s var(--ease-out),box-shadow .2s var(--ease-out)}
.mem-item:hover{border-color:var(--border-std);box-shadow:0 0 10px rgba(19,228,37,.06)}
.mem-item.path:hover{border-color:rgba(19,228,37,.3);box-shadow:0 0 10px rgba(19,228,37,.10)}
.mem-item.cross:hover{border-color:rgba(236,27,218,.3);box-shadow:0 0 10px rgba(236,27,218,.10)}
.mem-item .tag{display:inline-block;font-size:8.5px;padding:1px 4px;border-radius:3px;margin-top:3px;margin-right:2px}
.mem-item.path .tag{background:rgba(19,228,37,.14);color:var(--brand)}
.mem-item.cross .tag{background:rgba(236,27,218,.14);color:var(--brand-opposite)}
.mem-item .src{font-size:8px;color:var(--text-quaternary);float:right;text-transform:uppercase}

/* ===== Context Menu ===== */
.ctx-menu{position:fixed;background:var(--bg-floating);border:1.5px solid var(--border-std);border-radius:var(--radius-sm);
box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:100;min-width:140px;padding:4px;display:none}
.ctx-menu.show{display:block}
.ctx-menu-item{padding:7px 12px;font-size:12px;color:var(--text-secondary);cursor:pointer;border-radius:4px;
display:flex;align-items:center;gap:8px;transition:all .1s;font-family:inherit}
.ctx-menu-item:hover{background:var(--bg-item-hover);color:var(--text-primary)}
.ctx-menu-item.danger{color:var(--brand-danger)}
.ctx-menu-item.danger:hover{background:rgba(239,68,68,.12)}
.ctx-divider{height:1px;background:var(--border-divider);margin:4px 6px}

/* ===== Minimap 缩略图小窗 ===== */
.mini-map{position:absolute;left:14px;bottom:14px;width:190px;height:130px;z-index:50;
  background:rgba(13,13,13,.78);border:1.5px solid var(--border-std);border-radius:var(--radius-md);
  box-shadow:0 8px 32px rgba(0,0,0,.5);cursor:pointer;overflow:hidden;user-select:none;
  transition:border-color .2s var(--ease-out),box-shadow .2s var(--ease-out)}
.mini-map:hover{border-color:rgba(19,228,37,.4);box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 18px rgba(19,228,37,.12)}
.mini-svg{position:absolute;inset:0;width:100%;height:100%}
.mini-edge{stroke:var(--border-std);stroke-width:1;opacity:.55}
.mini-node{fill:var(--text-tertiary);opacity:.8}
.mini-node.current{fill:var(--brand);opacity:1}
.mini-viewport{position:absolute;border:1.5px solid var(--brand);border-radius:3px;
  background:rgba(19,228,37,.05);box-shadow:0 0 8px rgba(19,228,37,.4);pointer-events:none;opacity:.85}
.mini-resize{position:absolute;right:2px;bottom:2px;width:12px;height:12px;cursor:se-resize;z-index:3;
  opacity:.5;transition:opacity .15s;
  background:
    linear-gradient(135deg,transparent 46%,var(--text-quaternary) 46%,var(--text-quaternary) 56%,transparent 56%),
    linear-gradient(135deg,transparent 64%,var(--text-quaternary) 64%,var(--text-quaternary) 74%,transparent 74%)}
.mini-map:hover .mini-resize{opacity:1}

/* ===== Modal & Toast ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg-floating);border:1.5px solid var(--border-std);border-radius:var(--radius);max-width:720px;width:90%;max-height:80vh;display:flex;flex-direction:column;
box-shadow:0 12px 48px rgba(0,0,0,.6),0 0 30px rgba(19,228,37,.06)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-divider);font-weight:600;color:var(--text-primary)}
.modal-close{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:14px;line-height:1}
.modal-close:hover{color:var(--text-primary)}
.modal-body{padding:16px;overflow:auto;color:var(--text-secondary);font-size:13px;line-height:1.65;white-space:pre-wrap}
.fc-msg{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border-divider)}
.fc-msg:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.fc-role{display:inline-block;font-size:10px;text-transform:uppercase;font-weight:700;color:var(--brand);margin-right:8px;letter-spacing:.03em}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-floating);border:1.5px solid var(--border-std);color:var(--text-primary);padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;opacity:0;transition:opacity .2s;z-index:300;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1}

/* ===== Main Chat ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);
background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(19,228,37,.04),transparent 70%);
position:relative}
.chat-header{height:44px;min-height:44px;display:flex;align-items:center;justify-content:space-between;
padding:0 14px;border-bottom:1px solid var(--border-divider);flex-shrink:0;
background:color-mix(in srgb,var(--bg-card) 40%,transparent);position:relative}
.chat-header::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:1px;
background:linear-gradient(90deg,transparent,var(--brand),transparent);opacity:0;
transition:opacity .3s var(--ease-out)}
.chat-header:hover::after{opacity:.25}
.breadcrumb{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-tertiary);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.breadcrumb b{color:var(--text-secondary)}
.breadcrumb .cur{color:var(--brand);text-shadow:0 0 8px rgba(19,228,37,.4)}
.chat-header-actions{display:flex;gap:6px}
.header-btn{width:28px;height:28px;border:none;border-radius:5px;background:transparent;color:var(--text-tertiary);
cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease-out)}
.header-btn:hover{background:var(--bg-item);color:var(--text-primary);box-shadow:0 0 10px rgba(19,228,37,.08)}
.branch-banner{padding:6px 16px;background:rgba(19,228,37,.07);border-bottom:1px solid var(--border-divider);
font-size:11px;color:var(--brand);display:none;align-items:center;gap:7px}
.branch-banner.show{display:flex}

.messages-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.ctx-note{font-size:11px;color:var(--text-quaternary);text-align:center;font-family:'JetBrains Mono',monospace}
/* 空态欢迎界面 */
.chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
margin:auto;padding:40px 20px;text-align:center;animation:fadeIn .4s ease-out}
.empty-orb{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:28px;color:#000;background:radial-gradient(circle at 30% 30%,var(--brand),#0a8f14);
box-shadow:0 0 40px rgba(19,228,37,.35),inset 0 0 12px rgba(0,0,0,.2);animation:orb-pulse 3s ease-in-out infinite}
@keyframes orb-pulse{0%,100%{box-shadow:0 0 30px rgba(19,228,37,.3),inset 0 0 12px rgba(0,0,0,.2)}
50%{box-shadow:0 0 55px rgba(19,228,37,.5),inset 0 0 12px rgba(0,0,0,.2)}}
.empty-title{font-size:17px;font-weight:600;color:var(--text-primary)}
.empty-sub{font-size:12.5px;color:var(--text-tertiary);max-width:340px;line-height:1.6}
.empty-suggestions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.empty-chip{padding:6px 13px;border:1.5px solid var(--border-std);border-radius:16px;background:var(--bg-btn);
color:var(--text-secondary);font-size:12px;cursor:pointer;transition:all .2s var(--ease-out);font-family:inherit}
.empty-chip:hover{background:var(--bg-btn-hover);border-color:var(--brand);color:var(--brand);
box-shadow:0 0 14px rgba(19,228,37,.15);transform:var(--lift)}
.turn{display:flex;flex-direction:column;gap:6px;max-width:700px;width:100%;align-self:center}
.turn-head{display:flex;align-items:center;gap:6px;padding:0 2px}
.turn-badge{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:4px;
background:var(--bg-item);color:var(--text-tertiary);border:1px solid var(--border-divider)}
.turn-badge.branch{color:var(--brand-opposite);border-color:rgba(236,27,218,.4)}
.turn.current .turn-badge{color:var(--brand);border-color:var(--brand)}
.turn-time{font-size:10px;color:var(--text-quaternary)}
.turn-branch-tag{font-size:9.5px;color:var(--text-quaternary);margin-left:auto}
.branch-divider{height:2px;width:100%;max-width:700px;align-self:center;margin:2px 0;
background:linear-gradient(to right,transparent,var(--brand),transparent);opacity:.5;border-radius:2px}

.bubble{padding:12px 15px;border-radius:16px 4px 16px 16px;max-width:82%;line-height:1.6;font-size:14px;word-break:break-word}
.bubble-user{background:linear-gradient(135deg,var(--bg-usermsg),var(--bg-card-up));box-shadow:var(--shadow-usermsg);color:var(--text-primary);align-self:flex-end;
border:1.5px solid var(--border-std);transition:box-shadow .2s var(--ease-out),border-color .2s var(--ease-out)}
.bubble-user:hover{box-shadow:-3px 6px 18px rgba(0,0,0,.65)}
.ai-card{background:linear-gradient(180deg,var(--bg-card-up),var(--bg-card-down));border:1.5px solid var(--border-std);
border-radius:14px;box-shadow:var(--shadow-card);overflow:hidden;max-width:680px;width:100%;
position:relative;transition:border-color .2s var(--ease-out),box-shadow .25s var(--ease-out),transform .25s var(--ease-out);will-change:transform,box-shadow}
.ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(90deg,var(--brand),transparent 70%);opacity:.6;pointer-events:none}
.ai-card:hover{border-color:var(--border-turn);box-shadow:-4px 10px 32px rgba(0,0,0,.4),0 0 0 1px rgba(19,228,37,.06),0 0 24px rgba(19,228,37,.06);transform:translateY(-2px)}
.card-header{padding:10px 14px 7px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border-divider)}
.card-avatar{width:22px;height:22px;background:linear-gradient(135deg,var(--brand),#0a8f14);border-radius:6px;display:flex;align-items:center;
justify-content:center;font-weight:700;font-size:11px;color:#000;flex-shrink:0;
box-shadow:0 0 8px rgba(19,228,37,.3);transition:box-shadow .3s var(--ease-out)}
.ai-card:hover .card-avatar{box-shadow:0 0 16px rgba(19,228,37,.5)}
.card-label{font-size:12px;font-weight:600;color:var(--text-secondary)}
.card-body{padding:12px 14px}
.card-body p{font-size:13.5px;line-height:1.65;color:var(--text-primary);margin-bottom:8px}
.card-body p:last-child{margin-bottom:0}
.concept-term{border-bottom:1.5px dotted var(--text-tertiary);cursor:pointer;transition:border-color .2s,padding-bottom .2s;padding-bottom:1px}
.concept-term:hover{border-bottom-style:solid;border-bottom-color:var(--text-primary);text-shadow:0 0 8px rgba(255,255,255,.15)}
.code-block{background:var(--bg);border:1px solid var(--border-divider);border-radius:6px;padding:9px 11px;
margin:8px 0;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;overflow-x:auto;
white-space:pre-wrap;word-break:break-all;color:var(--text-secondary)}
/* marked 输出适配: <pre><code> 与行内 code */
.card-body pre{background:var(--bg);border:1px solid var(--border-divider);border-radius:8px;padding:10px 12px;
margin:8px 0;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.55;
white-space:pre-wrap;word-break:break-all;color:var(--text-secondary)}
.card-body pre code{background:transparent;padding:0;border:none;font-family:inherit;font-size:inherit;color:inherit}
.card-body code{background:var(--bg-item);border:1px solid var(--border-divider);border-radius:4px;
padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--brand)}
.card-body h1,.card-body h2,.card-body h3{color:var(--text-primary);margin:10px 0 6px;line-height:1.3}
.card-body h1{font-size:16px}.card-body h2{font-size:15px}.card-body h3{font-size:14px}
.card-body ul,.card-body ol{padding-left:20px;margin:6px 0}
.card-body li{margin:3px 0}
.card-body blockquote{border-left:3px solid var(--brand);padding:2px 12px;margin:8px 0;
background:var(--bg-quotation);border-radius:0 6px 6px 0;color:var(--text-secondary)}
.card-body table{border-collapse:collapse;margin:8px 0;width:100%;font-size:12.5px}
.card-body th,.card-body td{border:1px solid var(--border-divider);padding:5px 9px;text-align:left}
.card-body th{background:var(--bg-item);color:var(--text-secondary)}
.card-body a{color:var(--brand);text-decoration:underline dotted}
.card-body hr{border:none;border-top:1px dashed var(--border-divider);margin:10px 0}
.card-footer{padding:7px 14px 10px;display:flex;gap:5px;border-top:1px solid var(--border-divider)}
.card-action-btn{padding:4px 9px;border:1.5px solid var(--border-std);border-radius:5px;background:var(--bg-btn);
color:var(--text-secondary);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px;
transition:all .2s var(--ease-out);font-family:inherit}
.card-action-btn:hover{background:var(--bg-btn-hover);color:var(--text-primary);
box-shadow:0 0 10px rgba(19,228,37,.08);border-color:var(--border-turn)}

/* ── 思考块 + 工具卡片 (chat 可视化: 思考过程 / 工具调用) ── */
.ai-extras{display:flex;flex-direction:column;gap:8px;max-width:680px;width:100%;margin-top:8px}
.think-block{border:1px solid var(--border-std);border-left:3px solid var(--brand);
  border-radius:8px;background:var(--bg-card-down);overflow:hidden}
.think-block>summary{cursor:pointer;padding:8px 12px;font-size:12px;font-weight:600;
  color:var(--text-secondary);list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
.think-block>summary::-webkit-details-marker{display:none}
.think-block>summary::before{content:"▸";transition:transform .15s;font-size:10px;color:var(--text-tertiary)}
.think-block[open]>summary::before{transform:rotate(90deg)}
.think-len{margin-left:auto;font-weight:400;color:var(--text-tertiary);font-size:11px}
.think-body{padding:0 12px 10px;font-size:12.5px;line-height:1.6;color:var(--text-tertiary);
  white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto}
.tool-list{display:flex;flex-direction:column;gap:6px}
.tool-card{border:1px solid var(--border-std);border-radius:8px;background:var(--bg-card-down);
  overflow:hidden;font-size:12px}
.tool-card.fail{border-color:#ef4444}
.tool-card.running{border-color:var(--brand);box-shadow:0 0 12px rgba(19,228,37,.12)}
.tool-state.running{color:var(--brand)}
.tool-state.running .spinner{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border-std);border-top-color:var(--brand);
animation:spin .8s linear infinite;display:inline-block;vertical-align:-1px;margin-right:3px}
.tool-head{padding:7px 11px;display:flex;align-items:center;gap:6px;background:rgba(127,127,127,.06)}
.tool-icon{font-size:13px}
.tool-name{font-weight:600;color:var(--text-primary);font-family:'JetBrains Mono',monospace}
.tool-state{margin-left:auto;font-size:11px;color:var(--text-tertiary)}
.tool-card.ok .tool-state{color:#22c55e}
.tool-card.fail .tool-state{color:#ef4444}
.tool-detail{border-top:1px solid var(--border-divider)}
.tool-detail>summary{cursor:pointer;padding:5px 11px;font-size:11px;color:var(--text-secondary);
  list-style:none;user-select:none}
.tool-detail>summary::-webkit-details-marker{display:none}
.tool-detail>summary::before{content:"▸";margin-right:5px;font-size:9px;color:var(--text-tertiary)}
.tool-detail[open]>summary::before{content:"▾"}
.tool-args,.tool-result{margin:0;padding:7px 11px;font-family:'JetBrains Mono',monospace;font-size:11px;
  line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--text-secondary);
  max-height:240px;overflow-y:auto;background:var(--bg)}
/* 阶段 4.1: 降级/警告黄色提示条 (非 error 红色, 不中断流) */
.warn-banner{max-width:680px;width:100%;margin:6px 0 2px;padding:6px 11px;border-radius:8px;
  border:1px solid #eab308;border-left:3px solid #eab308;background:rgba(234,179,8,.10);
  color:var(--text-secondary);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}


/* 上下文用量 + 缓存可视化 (chat 底部状态条) */
.chat-usage-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;
  padding:7px 16px;border-top:1px solid var(--border-divider);flex-shrink:0;
  font-size:11px;color:var(--text-tertiary);background:var(--bg-card-down);
  font-family:'JetBrains Mono',monospace;line-height:1.4}
.usage-row{display:flex;align-items:center;gap:6px}
.usage-label{color:var(--text-secondary);font-weight:600;letter-spacing:.03em}
.usage-gauge{width:92px;height:6px;border-radius:3px;background:var(--bg-input);
  border:1px solid var(--border-std);overflow:hidden;flex-shrink:0}
.usage-gauge-fill{height:100%;width:0;background:var(--brand);transition:width .3s ease,background .3s ease}
.usage-ctx{color:var(--text-primary);font-size:11px}
.usage-badge{padding:1px 8px;border-radius:10px;font-weight:600;font-size:10.5px;color:var(--text-tertiary)}
.usage-badge.good{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.4)}
.usage-badge.warn{background:rgba(234,179,8,.15);color:#eab308;border:1px solid rgba(234,179,8,.4)}
.usage-badge.bad{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.4)}
.usage-cache{color:var(--text-tertiary)}
.usage-tokens{margin-left:auto;color:var(--text-tertiary)}
.usage-tokens b{color:var(--text-secondary);font-weight:600}
/* 历史节点的持久化用量小行 */
.usage-line{font-size:11px;color:var(--text-tertiary);font-family:'JetBrains Mono',monospace;
  padding:4px 0 1px;border-top:1px dashed var(--border-divider);margin-top:2px}

/* Input */
.input-area{padding:12px 16px 14px;border-top:1px solid var(--border-divider);flex-shrink:0;
background:color-mix(in srgb,var(--bg-card) 40%,transparent)}
.input-wrapper{max-width:700px;margin:0 auto;background:var(--bg-input);border:1.5px solid var(--border-std);
border-radius:14px;display:flex;align-items:flex-end;padding:8px 12px;gap:7px;transition:border-color .2s,box-shadow .2s;
box-shadow:0 4px 20px rgba(0,0,0,.25)}
.input-wrapper:focus-within{border-color:var(--brand);
box-shadow:0 0 0 3px rgba(19,228,37,.12),0 4px 24px rgba(0,0,0,.3),0 0 20px rgba(19,228,37,.10)}
.input-field{flex:1;background:transparent;border:none;outline:none;color:var(--text-primary);font-size:14px;
font-family:inherit;line-height:1.5;resize:none;max-height:120px;min-height:20px;padding:3px 0}
.input-field::placeholder{color:var(--text-quaternary)}
.send-btn{width:30px;height:30px;border:none;border-radius:7px;background:var(--brand);color:#000;cursor:pointer;
display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s var(--ease-out);font-size:14px;
box-shadow:0 0 10px rgba(19,228,37,.2)}
.send-btn:hover{filter:brightness(1.1);transform:scale(1.06);box-shadow:0 0 18px rgba(19,228,37,.4)}
.send-btn:active{transform:scale(.94)}
.input-toolbar{max-width:700px;margin:5px auto 0;display:flex;gap:3px}
.tool-btn{width:26px;height:26px;border:none;border-radius:5px;background:transparent;color:var(--text-quaternary);
cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease-out);font-size:13px}
.tool-btn:hover{background:var(--bg-item);color:var(--text-secondary);box-shadow:0 0 8px rgba(19,228,37,.08)}

/* ===== 命令面板 (Ctrl+K) ===== */
.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
display:none;align-items:flex-start;justify-content:center;z-index:250;padding-top:12vh}
.cmd-overlay.show{display:flex;animation:fadeIn .12s ease-out}
.cmd-panel{width:min(600px,92vw);background:var(--bg-floating);border:1.5px solid var(--border-std);border-radius:14px;
box-shadow:0 24px 80px rgba(0,0,0,.55),0 0 30px rgba(19,228,37,.06);overflow:hidden;display:flex;flex-direction:column;max-height:60vh}
.cmd-input-row{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border-divider)}
.cmd-search-icon{font-size:15px;color:var(--brand);flex-shrink:0}
.cmd-input{flex:1;background:transparent;border:none;outline:none;color:var(--text-primary);font-size:14px;font-family:inherit}
.cmd-input::placeholder{color:var(--text-quaternary)}
.cmd-kbd-hint{font-size:10px;color:var(--text-quaternary);font-family:'JetBrains Mono',monospace;border:1px solid var(--border-std);
padding:2px 6px;border-radius:4px;flex-shrink:0}
.cmd-list{overflow-y:auto;padding:6px}
.cmd-group{font-size:10px;color:var(--text-quaternary);text-transform:uppercase;letter-spacing:.8px;padding:7px 10px 3px}
.cmd-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text-secondary)}
.cmd-item:hover{background:var(--bg-item-hover);color:var(--text-primary)}
.cmd-item.active{background:var(--bg-item);color:var(--text-primary);box-shadow:inset 2px 0 0 var(--brand)}
.cmd-item.active .cmd-item-title{color:var(--brand);text-shadow:0 0 6px rgba(19,228,37,.3)}
.cmd-item-icon{width:16px;text-align:center;flex-shrink:0;opacity:.8;font-size:13px}
.cmd-item-body{flex:1;min-width:0}
.cmd-item-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-item-sub{font-size:10.5px;color:var(--text-quaternary);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
font-family:'JetBrains Mono',monospace}
.cmd-item-kbd{margin-left:8px;font-size:10px;color:var(--text-quaternary);font-family:'JetBrains Mono',monospace;
border:1px solid var(--border-divider);padding:1px 5px;border-radius:4px;flex-shrink:0}
.cmd-empty{padding:22px;text-align:center;color:var(--text-quaternary);font-size:12.5px}

/* ===== 消息操作 (气泡 hover / AI 卡 footer 增强) ===== */
.bubble-wrap{position:relative;display:inline-flex;max-width:82%;align-self:flex-end;flex-direction:column;align-items:flex-end}
.bubble-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s;margin-bottom:2px}
.bubble-wrap:hover .bubble-actions{opacity:1}
.bubble-act{width:22px;height:22px;border:1px solid var(--border-divider);border-radius:5px;background:var(--bg-floating);
color:var(--text-tertiary);font-size:10.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s var(--ease-out)}
.bubble-act:hover{color:var(--brand);border-color:var(--brand);box-shadow:0 0 8px rgba(19,228,37,.2)}
.bubble-act.danger:hover{color:var(--brand-danger);border-color:var(--brand-danger);box-shadow:0 0 8px rgba(239,68,68,.2)}
.card-action-btn:disabled{opacity:.4;pointer-events:none}
.ai-card.retrying{opacity:.75;border-color:var(--brand)}
/* AI 卡状态徽标（流式中/已停止） */
.card-state{font-size:10px;margin-left:auto;color:var(--text-tertiary);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:4px}
.card-state .spinner{width:10px;height:10px;border-radius:50%;border:2px solid var(--border-std);border-top-color:var(--brand);
animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(1turn)}}
.card-state.stopped{color:var(--color-warning)}

/* 打字机光标 */
.typing-cursor{display:inline-block;width:2px;height:1.1em;background:var(--brand);vertical-align:text-bottom;
margin-left:1px;animation:curBlink .8s step-end infinite}
@keyframes curBlink{0%,100%{opacity:1}50%{opacity:0}}

/* 输入区字数统计 */
.input-meta{max-width:700px;margin:4px auto 0;display:flex;justify-content:space-between;font-size:10px;
color:var(--text-quaternary);font-family:'JetBrains Mono',monospace;padding:0 4px}
.input-meta .kbd-tip{opacity:.75}
.input-meta b{color:var(--text-tertiary);font-weight:500}
.input-meta .warn{color:var(--color-warning)}

/* / 命令提示 chips */
.cmd-chips{max-width:700px;margin:5px auto 0;display:flex;flex-wrap:wrap;gap:4px}
.cmd-chip{font-size:11px;padding:3px 10px;border:1.5px solid var(--border-std);border-radius:12px;background:var(--bg-btn);
color:var(--text-secondary);cursor:pointer;transition:all .15s var(--ease-out);font-family:inherit}
.cmd-chip:hover{background:var(--bg-btn-hover);border-color:var(--brand);color:var(--brand);
box-shadow:0 0 10px rgba(19,228,37,.12)}
.cmd-chip b{color:var(--brand);font-weight:600}

/* 文件拖拽上传 */
.drop-overlay{position:fixed;inset:0;background:rgba(19,228,37,.08);border:2px dashed var(--brand);
display:none;align-items:center;justify-content:center;z-index:400;pointer-events:none;
font-family:'Space Grotesk',sans-serif;font-size:18px;color:var(--brand)}
.drop-overlay.show{display:flex}
.attach-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-usermsg-file);
border:1px solid var(--border-std);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--text-secondary);
margin-bottom:6px}
.attach-chip img{width:26px;height:26px;object-fit:cover;border-radius:5px}
.attach-chip .rm{cursor:pointer;color:var(--text-quaternary);font-size:13px;line-height:1}
.attach-chip .rm:hover{color:var(--brand-danger)}
.attach-chip .at-name{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-chip .at-size{font-size:10px;color:var(--text-quaternary);font-family:'JetBrains Mono',monospace}
/* 图片消息 */
.bubble-user img.msg-img,.card-body img.msg-img{max-width:100%;max-height:320px;border-radius:10px;
border:1px solid var(--border-std);cursor:zoom-in;display:block;margin:4px 0}
.attach-file{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--border-std);
border-radius:9px;background:var(--bg-item);font-size:12px;color:var(--text-secondary);text-decoration:none;margin:3px 0}
.attach-file:hover{border-color:var(--brand);color:var(--brand)}

/* 会话搜索框（侧栏） */
.session-search{display:flex;align-items:center;gap:6px;padding:6px 8px;margin:2px 2px 4px;background:var(--bg-input);
border:1.5px solid var(--border-std);border-radius:7px}
.session-search input{flex:1;background:transparent;border:none;outline:none;color:var(--text-primary);font-size:12px;font-family:inherit}
.session-search input::placeholder{color:var(--text-quaternary)}
.session-search .ss-icon{font-size:11px;color:var(--text-quaternary)}

@keyframes fadeIn{0%{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.animate-fadeIn{animation:fadeIn .3s ease-out forwards}
::selection{background:rgba(19,228,37,.25);color:var(--text-primary)}
@media(max-width:900px){.sidebar,.splitter,.tree-panel{display:none}}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">E</div>
      <span class="logo-text">Explore</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Chat</span>
      </div>
      <div class="nav-section">
        <div class="nav-section-head">
          <span class="nav-sub">会话</span>
          <button class="icon-btn" title="新建会话" onclick="createSession()">＋</button>
        </div>
        <div class="session-search" id="sessionSearch">
          <span class="ss-icon">⌕</span>
          <input id="sessionSearchInput" placeholder="搜索会话…" autocomplete="off" spellcheck="false">
        </div>
        <div id="sessionList" class="session-list"></div>
      </div>
      <div class="nav-section">
        <div class="nav-sub">当前会话分支</div>
        <div class="nav-item" style="font-size:12px" id="branchList"></div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="theme-switcher" id="themeSwitcher"></div>
      <div style="display:flex;gap:5px;margin-bottom:6px">
        <input type="color" id="accentPicker" value="#13E425" title="自定义强调色"
          style="width:34px;height:22px;border:1px solid var(--border-std);border-radius:5px;background:transparent;padding:1px;cursor:pointer">
        <button class="reset-btn" title="重置强调色" onclick="resetAccent()">重置强调色</button>
      </div>
      <button class="reset-btn" title="重置布局与设置" onclick="resetAll()">⟳ 重置画布</button>
    </div>
  </aside>

  <div class="splitter" id="splitter1" data-side="left"></div>

  <!-- Tree Canvas Panel -->
  <section class="tree-panel">
    <div class="tree-panel-head">
      <div class="tree-panel-title"><span class="dot"></span>Conv Tree <span class="tree-zoom-info" id="zoomInfo"></span></div>
      <div style="display:flex;gap:4px">
        <button class="tool-btn" title="Fit view" onclick="fitView()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button class="tool-btn" title="Reset" onclick="resetAll()" style="color:var(--brand-danger)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <div class="canvas-grid"></div>
      <div class="canvas-layer" id="canvasLayer">
        <svg class="edges-svg" id="edgesSvg">
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" class="arrow-marker"/>
            </marker>
            <marker id="arrowhead-merge" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="var(--brand-opposite)" opacity=".6"/>
            </marker>
          </defs>
        </svg>
        <svg class="temp-svg" id="tempSvg"><path id="tempLine" class="edge-path temp-line" style="display:none"/></svg>
        <div class="nodes-layer" id="nodesLayer"></div>
      </div>
      <div class="mini-map" id="miniMap" title="缩略图 · 点击跳转视口">
        <svg class="mini-svg" id="miniSvg"></svg>
        <div class="mini-viewport" id="miniViewport"></div>
        <div class="mini-resize" id="miniResize" title="拖拽调整大小"></div>
      </div>
      <div class="ctx-menu" id="ctxMenu"></div>
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <div class="modal-head"><span id="modalTitle"></span><button class="modal-close" onclick="hideModal()">✕</button></div>
          <div class="modal-body" id="modalBody"></div>
        </div>
      </div>
      <div class="toast" id="toast"></div>
      <!-- 命令面板 (Ctrl+K) -->
      <div class="cmd-overlay" id="cmdOverlay" onclick="if(event.target===this)cmdClose()">
        <div class="cmd-panel">
          <div class="cmd-input-row">
            <span class="cmd-search-icon">⌘</span>
            <input class="cmd-input" id="cmdInput" placeholder="搜索会话 / 节点，或输入命令…" autocomplete="off" spellcheck="false">
            <span class="cmd-kbd-hint">↑↓ 选择 · Enter 执行 · Esc 关闭</span>
          </div>
          <div class="cmd-list" id="cmdList"></div>
        </div>
      </div>
    </div>
    <div class="tree-info" id="treeInfo"></div>
    <div class="mem-head"><span style="color:var(--brand)">⟡</span> Path Memories</div>
    <div class="mem-list" id="memPath"></div>
    <div class="mem-head"><span style="color:var(--brand-opposite)">⟡</span> Cross-Branch</div>
    <div class="mem-list" id="memCross"></div>
  </section>

  <div class="splitter" id="splitter2" data-side="right"></div>

  <!-- Main Chat -->
  <main class="main">
    <header class="chat-header">
      <span class="breadcrumb" id="breadcrumb"></span>
      <div class="chat-header-actions">
        <button class="header-btn" title="Branch from current" onclick="branchFromCurrent()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/><circle cx="18" cy="6" r="3"/></svg>
        </button>
        <button class="header-btn" title="Prune" onclick="pruneCurrent()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </header>
    <div class="branch-banner" id="branchBanner">
      <span>↳ 正在从历史节点继续 — 发送将在此处创建<b style="margin:0 3px">新分支</b></span>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <!-- 工具调用小窗: 对话流中的工具卡片统一收进这里 (可折叠/上下边界拖动/无级滚动) -->
    <div id="toolDock">
      <div class="tool-dock-resize top" onmousedown="dockResizeStart(event,'top')" title="拖动调整高度"></div>
      <div class="tool-dock-head" onmousedown="dockMoveStart(event)" title="拖动移动位置 · 点击折叠/展开">
        <span class="tool-dock-icon">🔧</span>
        <span class="tool-dock-title">工具调用</span>
        <span class="tool-dock-count" id="toolDockCount">0</span>
        <span class="tool-dock-arrow">▾</span>
      </div>
      <div class="tool-dock-body" id="toolDockBody"></div>
      <div class="tool-dock-resize bottom" onmousedown="dockResizeStart(event,'bottom')" title="拖动调整高度"></div>
    </div>
    <div class="chat-usage-bar" id="usageBar" title="本次请求的上下文用量与缓存命中情况">
      <div class="usage-row">
        <span class="usage-label">通道</span>
        <span class="usage-badge" id="connBadge" title="模型通道连接状态">—</span>
        <button id="modelPicker" class="model-picker" title="切换模型（走 Hermes Gateway）">—</button>
        <div class="model-overlay" id="modelOverlay" hidden></div>
        <div class="model-dropdown" id="modelDropdown" role="listbox" hidden>
          <div class="model-dropdown-head">选择模型</div>
          <div class="model-dropdown-body" id="modelDropdownBody"></div>
        </div>
      </div>
      <div class="usage-row">
        <span class="usage-label">上下文</span>
        <div class="usage-gauge"><div class="usage-gauge-fill" id="ctxFill"></div></div>
        <span class="usage-ctx" id="ctxText">—</span>
      </div>
      <div class="usage-row">
        <span class="usage-label">缓存</span>
        <span class="usage-badge" id="cacheBadge">—</span>
        <span class="usage-cache" id="cacheText"></span>
      </div>
      <div class="usage-row usage-tokens" id="tokenText">—</div>
    </div>
    <div class="input-area">
      <div id="attachChips" style="max-width:700px;margin:0 auto 6px;display:none"></div>
      <div class="input-wrapper">
        <textarea class="input-field" id="inputField" rows="1" placeholder="从当前节点继续，或点树中节点跳转… (Enter 发送 · Shift+Enter 换行)" onkeydown="handleKey(event)" oninput="autoResize(this);updateInputMeta(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-meta">
        <span class="kbd-tip">/ 命令 · Ctrl+K 面板 · ↑↓ 历史 · 拖拽文件发送</span>
        <span id="inputCount">0 字</span>
      </div>
      <div class="cmd-chips" id="cmdChips"></div>
    </div>
    <div class="drop-overlay" id="dropOverlay">⇩ 松开以上传附件</div>
  </main>
</div>

<script>/**

<script>
'use strict';

/* ===== Markdown 渲染 (marked v12, 内嵌) ===== */
// 安全加固: ① 原始 HTML 注入 → 转义输出 (不执行) ② 链接协议白名单
marked.setOptions({breaks:true,gfm:true});
(function(){
  const r = new marked.Renderer();
  const origHtml = r.html.bind(r);
  r.html = (html) => escapeHtml(html);                       // 防 <script>/<img onerror>
  const origLink = r.link.bind(r);
  r.link = (href, title, text) => {
    try{
      const u = new URL(href, 'http://local');
      if(!/^(https?:|mailto:)$/.test(u.protocol)) return text; // 禁 javascript:/data:
    }catch(e){ return text; }
    return origLink(href, title, text);
  };
  marked.use({renderer:r});
})();
function mdRender(src){
  try{return marked.parse(src)}catch(e){return `<p>${escapeHtml(src)}</p>`}
}

/* ===== API Client ===== */
const API = {
  async _get(p){ const r=await fetch(p); return r.json(); },
  async _post(p,b){ const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}); return r.json(); },
  state(){return this._get('/api/state?inline=0')},  // M1: 拓扑轻量, 消息按需 /api/node_content 惰性拉
  addTurn(b){return this._post('/api/add_turn',b)},
  branchFrom(b){return this._post('/api/branch_from',b)},
  jumpTo(id){return this._post('/api/jump_to',{node_id:id})},
  prune(id){return this._post('/api/prune',{node_id:id})},
  memory(id){return this._get('/api/memory?node_id='+encodeURIComponent(id))},
  reset(){return this._post('/api/reset',{})},
  // B6: 流式 chat (SSE). onEvent(event) 收到 {type:thinking|content|tool_call|tool_result|warn|usage|done|error}
  // signal: 可选 AbortController.signal, 用于切换节点/重置时中止在飞请求
  chatStream(b,onEvent,signal){
    return fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(b||{}),signal}).then(r=>{
      if(!r.ok)throw new Error('HTTP '+r.status);
      const reader=r.body.getReader();const dec=new TextDecoder('utf-8');
      let buf='';
      const pump=()=>reader.read().then(({done,value})=>{
        if(done)return;
        buf+=dec.decode(value,{stream:true});
        let idx;
        while((idx=buf.indexOf('\n\n'))>=0){
          const frame=buf.slice(0,idx);buf=buf.slice(idx+2);
          const line=frame.split('\n').find(l=>l.indexOf('data:')===0);
          if(line){const payload=line.slice(5).trim();if(payload){try{onEvent(JSON.parse(payload))}catch(e){}}}
        }
        return pump();
      });
      return pump();
    });
  },
  // v2 APIs
  fork(b){return this._post('/api/fork',b)},
  conclude(id){return this._post('/api/conclude',{node_id:id})},
  merge(from,target){return this._post('/api/merge',{source_id:from,target_id:target})},
  unmerge(id){return this._post('/api/unmerge',{node_id:id})},
  abandon(id){return this._post('/api/abandon',{node_id:id})},
  rename(id,title){return this._post('/api/rename',{node_id:id,title:title})},
  deleteNode(id){return this._post('/api/delete_node',{node_id:id})},
  setAgent(id,agent,cascade=true){return this._post('/api/set_agent',{node_id:id,agent:agent,cascade:cascade})},
  fullContext(id){return this._get('/api/full_context?node_id='+encodeURIComponent(id))},
  nodeContent(id){return this._get('/api/node_content?node_id='+encodeURIComponent(id))},
  // B2: 设置节点执行状态 (supervisor / 测试)
  setExecState(b){return this._post('/api/node/exec_state',b)},
  // 多会话管理 (左侧栏)
  sessions(){return this._get('/api/sessions')},
  sessionCreate(b){return this._post('/api/sessions/create',b||{})},
  sessionSwitch(id){return this._post('/api/sessions/switch',{id:id})},
  sessionDelete(id){return this._post('/api/sessions/delete',{id:id})},
  sessionArchive(id){return this._post('/api/sessions/archive',{id:id})},
  sessionRename(id,title){return this._post('/api/sessions/rename',{id:id,title:title})}
};

/* ===== Data Model ===== */
class ConvNode{
  constructor(o){o=o||{};this.id=o.id;this.parentId=o.parentId||null;this.children=o.children||[];
  this.depth=o.depth||0;this.branchLabel=o.branchLabel||null;this.messages=o.messages||[];
  this.state=o.state||{};this.config=o.config||{};this.meta=o.meta||{};this.createdAt=o.createdAt||Date.now();
  this.nodeType=o.nodeType||'trunk';this.isValid=o.isValid!==false;
  this.mergeTarget=o.mergeTarget||null;this.mergedFrom=o.mergedFrom||[];
  this.skillsUsed=o.skillsUsed||[];this.toolCalls=o.toolCalls||[];this.conclusions=o.conclusions||[];
  this.thinking=o.thinking||'';this.usage=o.usage||{};
  this.summary=o.summary||'';
  this.execState=o.exec_state||'idle';this.execProgress=o.exec_progress||0;this.execDetail=o.exec_detail||'';
  this.agent=o.agent||'ikaros';}
}
class TreeView{
  constructor(nodesMap,rootId,currentId){this.nodes=nodesMap;this.rootId=rootId;this.currentId=currentId;this.version=0}
  get current(){return this.nodes.get(this.currentId)}
  getNode(id){return this.nodes.get(id)}
  getPath(id){id=id||this.currentId;const p=[];let c=this.nodes.get(id);while(c){p.unshift(c);c=c.parentId?this.nodes.get(c.parentId):null}return p}
  getContext(id){return this.getPath(id).reduce((a,n)=>a.concat(n.messages),[])}
  siblings(id){const n=this.nodes.get(id);if(!n||!n.parentId)return[];const p=this.nodes.get(n.parentId);return p.children.filter(c=>c!==id)}

  isLeaf(id){const n=this.nodes.get(id);return n?n.children.length===0:true}
}

let tree=null,currentMem={path:[],cross:[]},branchParentId=null;

function installState(s){
  const m=new Map();
  Object.values(s.nodes).forEach(n=>{
    m.set(n.id,new ConvNode({id:n.id,parentId:n.parent_id,children:n.children,depth:n.depth,
      branchLabel:n.branch_label,messages:n.messages,state:n.state,config:n.config,
      meta:n.meta,createdAt:n.created_at,nodeType:n.node_type,isValid:n.is_valid,
      mergeTarget:n.merge_target,mergedFrom:n.merged_from,      skillsUsed:n.skills_used,
      toolCalls:n.tool_calls,conclusions:n.conclusions,
      execState:n.exec_state,execProgress:n.exec_progress,execDetail:n.exec_detail,
      agent:n.agent||'ikaros',summary:n.summary||''}));
  });
  tree=new TreeView(m,s.root_id,s.current_id);
}

/* ===== Canvas State ===== */
let panX=20,panY=20,zoom=1;
const nodePositions={};      // id -> {x,y} in layout coordinates
const manualPositions={};    // id -> {x,y} manual override (persists across re-renders)

let selectedNode=null;

const collapsedIds=new Set();  // 折叠的节点 id (子树不参与布局, 折叠节点按叶计算)

/* ===== Layout Algorithm ===== */
