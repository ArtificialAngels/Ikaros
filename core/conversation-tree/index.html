<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Explore — Conversation Tree v3</title>
<!-- 不引用外部 Google Fonts: 离线/代理环境连不上会阻塞标签页 load 事件导致一直转圈,
     改用系统字体栈 (Inter→系统无衬线, JetBrains Mono→等宽) 优雅降级。 -->
<style>
/* ===== Design Tokens ===== */
:root{
  --brand:#13E425;--brand-secondary:#13E425;--brand-danger:#EF4444;--brand-opposite:#EC1BDA;
  --bg:#0d0d0d;--bg-modal:#171717;--bg-card:#1c1c1c;--bg-card-up:#222;--bg-card-down:#222;
  --bg-floating:#2a2a2a;--bg-btn:#333;--bg-btn-hover:#555;--bg-item:#2a2a2a;--bg-item-hover:#3a3a3a;
  --bg-usermsg:#3a3a3a;--bg-input:#2a2a2a;--bg-bar:#444;--bg-separator:#666;
  --border-std:#3a3a3a;--border-divider:#2a2a2a;--border-turn:#3a3a3a;
  --text-primary:#f0f0f0;--text-secondary:#c0c0c0;--text-tertiary:#888;--text-quaternary:#666;
  --shadow-card:0 4px 24px rgba(0,0,0,.4);--shadow-btn:0 2px 4px rgba(0,0,0,.5);
  --shadow-usermsg:0 2px 12px rgba(0,0,0,.6);
  --color-success:#22c55e;--color-warning:#f59e0b;--color-info:#6366f1;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
}
[data-theme="warm"]{
  --bg:#f5f0e8;--bg-modal:#ede8df;--bg-card:#e8e3da;--bg-card-up:#e8e3da;--bg-card-down:#e8e3da;
  --bg-floating:#ddd8cf;--bg-btn:#d5d0c7;--bg-btn-hover:#c5c0b7;--bg-item:#d8d3ca;--bg-item-hover:#cec9c0;
  --bg-usermsg:#d5cdb9;--bg-input:#e2ddd4;--bg-bar:#ddd8cf;
  --border-std:#d0cbc2;--border-divider:#c5c0b7;
  --text-primary:#1a1a1a;--text-secondary:#555;--text-tertiary:#888;--text-quaternary:#aaa;
  --shadow-card:0 4px 24px rgba(0,0,0,.08);--shadow-btn:0 2px 4px rgba(0,0,0,.12);
  --shadow-usermsg:0 2px 12px rgba(0,0,0,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
color:var(--text-primary);display:flex;height:100vh;transition:background .3s,color .3s;}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb-card,#888);border-radius:6px}
.app{display:flex;width:100%;height:100%}
:root{--sidebar-w:180px;--tree-w:300px}

/* ===== Resizable Splitter ===== */
.splitter{width:6px;min-width:6px;background:transparent;cursor:col-resize;position:relative;
z-index:50;flex-shrink:0;transition:background .15s}
.splitter::after{content:'';position:absolute;top:0;bottom:0;left:2px;right:2px;
background:var(--border-divider);border-radius:1px;transition:background .15s}
.splitter:hover::after,.splitter.active::after{background:var(--brand)}
.splitter.active{background:rgba(19,228,37,.06)}

/* ===== Sidebar ===== */
.sidebar{width:var(--sidebar-w);min-width:120px;max-width:300px;background:var(--bg-modal);
display:flex;flex-direction:column;transition:background .3s;overflow:hidden}
.sidebar-header{padding:16px 14px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border-divider)}
.logo-icon{width:26px;height:26px;background:var(--brand);border-radius:7px;display:flex;align-items:center;
justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#000;flex-shrink:0}
.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;letter-spacing:-.3px}
.sidebar-nav{flex:1;padding:8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;
color:var(--text-secondary);font-size:13px;transition:all .15s;margin-bottom:1px}
.nav-item:hover{background:var(--bg-item-hover);color:var(--text-primary)}
.nav-item.active{background:var(--bg-item);color:var(--text-primary);font-weight:500}
.nav-icon{width:15px;height:15px;opacity:.7;flex-shrink:0}
.nav-item.active .nav-icon{opacity:1}
.nav-sub{font-size:10px;color:var(--text-quaternary);text-transform:uppercase;letter-spacing:.8px;padding:8px 10px 2px}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--border-divider)}
/* ── 会话列表 (左侧栏 多会话) ── */
.nav-section{margin-top:2px}
.nav-section-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 6px}
.icon-btn{background:transparent;border:1px solid var(--border-divider);color:var(--text-tertiary);
width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;display:flex;
align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.icon-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--bg-item)}
.session-list{display:flex;flex-direction:column;gap:1px;padding:2px 2px 4px}
.session-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;
color:var(--text-secondary);position:relative;transition:background .12s}
.session-item:hover{background:var(--bg-item-hover);color:var(--text-primary)}
.session-item.active{background:var(--bg-item);color:var(--text-primary)}
.session-item.active .sess-title{font-weight:500}
.session-item.archived{opacity:.55}
.sess-body{flex:1;min-width:0}
.sess-title{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-meta{font-size:10px;color:var(--text-quaternary);margin-top:1px;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.sess-actions{display:none;gap:1px;align-items:center;flex-shrink:0}
.session-item:hover .sess-actions{display:flex}
.sess-act{background:transparent;border:none;color:var(--text-tertiary);cursor:pointer;
font-size:12px;padding:2px 4px;border-radius:4px;line-height:1}
.sess-act:hover{background:var(--bg-card);color:var(--text-primary)}
.sess-act.danger:hover{color:var(--brand-danger)}
.session-group-label{font-size:10px;color:var(--text-quaternary);text-transform:uppercase;
letter-spacing:.6px;padding:10px 10px 2px}
.theme-switcher{display:flex;gap:4px;margin-bottom:6px}
.theme-btn{flex:1;padding:5px 0;border:1px solid var(--border-std);border-radius:5px;background:transparent;
color:var(--text-secondary);font-size:11px;cursor:pointer;transition:all .15s;font-family:inherit}
.theme-btn:hover{border-color:var(--text-tertiary)}
.theme-btn.active{border-color:var(--brand);color:var(--brand);background:rgba(19,228,37,.06)}
.reset-btn{width:100%;padding:6px 0;border:1px solid var(--border-std);border-radius:5px;background:transparent;
color:var(--text-tertiary);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
.reset-btn:hover{border-color:var(--brand-danger);color:var(--brand-danger)}

/* ===== Tree Canvas ===== */
.tree-panel{width:var(--tree-w);background:var(--bg);border-right:none;
display:flex;flex-direction:column;transition:background .3s;position:relative;overflow:hidden}
.tree-panel-head{padding:10px 14px;border-bottom:1px solid var(--border-divider);display:flex;
align-items:center;justify-content:space-between;flex-shrink:0}
.tree-panel-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
display:flex;align-items:center;gap:6px}
.tree-panel-title .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand)}
.tree-zoom-info{font-size:10px;color:var(--text-quaternary);font-family:'JetBrains Mono',monospace}

.canvas-wrap{flex:1;position:relative;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none}
.canvas-wrap:active{cursor:grabbing}
.canvas-wrap.panning{cursor:grabbing;user-select:none;-webkit-user-select:none}
.canvas-grid{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
background-image:radial-gradient(circle,var(--border-divider) 1px,transparent 1px);
background-size:24px 24px;opacity:.5}
.canvas-layer{position:absolute;top:0;left:0;transform-origin:0 0;z-index:1}
.edges-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:2;overflow:visible}
.nodes-layer{position:absolute;top:0;left:0;z-index:3}
.temp-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:10;overflow:visible}

/* ===== Node Card ===== */
.node-card{position:absolute;background:var(--bg-card);border:1.5px solid var(--border-std);
border-radius:var(--radius-md);padding:8px 10px;width:160px;
box-shadow:var(--shadow-card);cursor:pointer;transition:border-color .15s,box-shadow .15s,opacity .2s;
font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.4;user-select:none;
transform:translate(-50%,-50%)}
.node-card:hover{border-color:var(--text-tertiary);box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:5}
.node-card.selected{border-color:var(--text-secondary);box-shadow:0 0 0 1px var(--text-secondary)}
.node-card.current{border-color:var(--brand)!important;box-shadow:0 0 20px rgba(19,228,37,.2)!important}

/* node type accent bar + colors */
.node-card.trunk{border-left:3px solid #555}
.node-card.branch{border-left:3px solid var(--color-info)}
.node-card.conclusion{border-left:3px solid var(--color-warning)}
.node-card.merge_point{border-left:3px solid var(--brand-opposite)}
.node-card:not(.is-valid){opacity:.45;border-left:3px solid var(--brand-danger)}

.node-card .node-depth{font-size:9px;color:var(--text-quaternary);margin-bottom:3px}
.node-card .node-label{color:var(--text-secondary);font-weight:500;margin-bottom:1px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-card .node-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.node-card .node-tag{font-size:8.5px;padding:1px 5px;border-radius:3px;line-height:1.4;
white-space:nowrap}
.node-card .tag-branch{background:rgba(99,102,241,.15);color:var(--color-info)}
.node-card .tag-conclusion{background:rgba(245,158,11,.15);color:var(--color-warning)}
.node-card .tag-merged{background:rgba(236,27,218,.12);color:var(--brand-opposite)}
.node-card .tag-abandoned{background:rgba(239,68,68,.12);color:var(--brand-danger)}
.node-card .tag-current{background:rgba(19,228,37,.12);color:var(--brand)}
/* 代理归属徽标 (ekko 模式): Hermes 用 opposite 品牌色, Ikaros 用低调灰 */
.node-card .agent-hermes{color:var(--brand-opposite);font-weight:600}
.node-card .agent-ikaros{color:var(--text-quaternary)}

/* Handle connection points */
.node-handle{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--border-std);
border:1.5px solid var(--bg-card);left:50%;transform:translateX(-50%);z-index:6;cursor:crosshair;
transition:background .15s,transform .15s,box-shadow .15s;opacity:0}
.node-card:hover .node-handle,.node-card.selected .node-handle{opacity:1}
.node-handle:hover{background:var(--brand);transform:translateX(-50%) scale(1.4);box-shadow:0 0 8px var(--brand)}
.node-handle.source{bottom:-6px}
.node-handle.target{top:-6px}
.node-handle.dragging{background:var(--brand);transform:translateX(-50%) scale(1.6);opacity:1;
box-shadow:0 0 14px var(--brand);animation:pulse-handle .6s ease-in-out infinite}
@keyframes pulse-handle{0%,100%{box-shadow:0 0 8px var(--brand)}50%{box-shadow:0 0 18px var(--brand)}}

/* Edge (bezier) */
.edge-path{fill:none;stroke:var(--border-std);stroke-width:1.5;transition:stroke .2s,stroke-width .2s}
.edge-path:hover{stroke:var(--text-tertiary);stroke-width:2.5}
.edge-path.highlight{stroke:var(--text-secondary);stroke-width:2.5;filter:drop-shadow(0 0 3px rgba(255,255,255,.1))}
.edge-path.merge-line{stroke:var(--brand-opposite);stroke-width:1.5;stroke-dasharray:6 4;opacity:.5}
.edge-path.temp-line{stroke:var(--brand);stroke-width:2;stroke-dasharray:8 4;opacity:.8}
.edge-path.selected-edge{stroke:var(--brand);stroke-width:2.5}
.arrow-marker{fill:var(--border-std)}

/* ===== Tree Info + Memory ===== */
.tree-info{padding:8px 12px;border-top:1px solid var(--border-divider);font-size:11px;color:var(--text-tertiary);flex-shrink:0}
.tree-info b{color:var(--text-secondary);font-weight:500}
.mem-head{padding:8px 12px 4px;border-top:1px solid var(--border-divider);font-size:10px;
text-transform:uppercase;letter-spacing:.6px;color:var(--text-quaternary);display:flex;align-items:center;gap:5px;flex-shrink:0}
.mem-list{max-height:140px;overflow-y:auto;padding:0 8px 8px;flex-shrink:0}
.mem-item{background:var(--bg-modal);border:1px solid var(--border-divider);border-radius:6px;padding:6px 7px;
margin-bottom:4px;font-size:10.5px;line-height:1.4;color:var(--text-secondary)}
.mem-item .tag{display:inline-block;font-size:8.5px;padding:1px 4px;border-radius:3px;margin-top:3px;margin-right:2px}
.mem-item.path .tag{background:rgba(19,228,37,.14);color:var(--brand)}
.mem-item.cross .tag{background:rgba(236,27,218,.14);color:var(--brand-opposite)}
.mem-item .src{font-size:8px;color:var(--text-quaternary);float:right;text-transform:uppercase}

/* ===== Context Menu ===== */
.ctx-menu{position:fixed;background:var(--bg-floating);border:1px solid var(--border-std);border-radius:var(--radius-sm);
box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:100;min-width:140px;padding:4px;display:none}
.ctx-menu.show{display:block}
.ctx-menu-item{padding:7px 12px;font-size:12px;color:var(--text-secondary);cursor:pointer;border-radius:4px;
display:flex;align-items:center;gap:8px;transition:all .1s;font-family:inherit}
.ctx-menu-item:hover{background:var(--bg-item-hover);color:var(--text-primary)}
.ctx-menu-item.danger{color:var(--brand-danger)}
.ctx-menu-item.danger:hover{background:rgba(239,68,68,.12)}
.ctx-divider{height:1px;background:var(--border-divider);margin:4px 6px}

/* ===== Modal & Toast ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg-floating);border:1px solid var(--border-std);border-radius:var(--radius);max-width:720px;width:90%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.6)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-divider);font-weight:600;color:var(--text-primary)}
.modal-close{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:14px;line-height:1}
.modal-close:hover{color:var(--text-primary)}
.modal-body{padding:16px;overflow:auto;color:var(--text-secondary);font-size:13px;line-height:1.65;white-space:pre-wrap}
.fc-msg{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border-divider)}
.fc-msg:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.fc-role{display:inline-block;font-size:10px;text-transform:uppercase;font-weight:700;color:var(--brand);margin-right:8px;letter-spacing:.03em}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-floating);border:1px solid var(--border-std);color:var(--text-primary);padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;opacity:0;transition:opacity .2s;z-index:300;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1}

/* ===== Main Chat ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{height:44px;min-height:44px;display:flex;align-items:center;justify-content:space-between;
padding:0 16px;border-bottom:1px solid var(--border-divider);flex-shrink:0}
.breadcrumb{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-tertiary);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.breadcrumb b{color:var(--text-secondary)}
.breadcrumb .cur{color:var(--brand)}
.chat-header-actions{display:flex;gap:6px}
.header-btn{width:28px;height:28px;border:none;border-radius:5px;background:transparent;color:var(--text-tertiary);
cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.header-btn:hover{background:var(--bg-item);color:var(--text-primary)}
.branch-banner{padding:6px 16px;background:rgba(19,228,37,.07);border-bottom:1px solid var(--border-divider);
font-size:11px;color:var(--brand);display:none;align-items:center;gap:7px}
.branch-banner.show{display:flex}

.messages-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.ctx-note{font-size:11px;color:var(--text-quaternary);text-align:center;font-family:'JetBrains Mono',monospace}
.turn{display:flex;flex-direction:column;gap:6px;max-width:700px;width:100%;align-self:center}
.turn-head{display:flex;align-items:center;gap:6px;padding:0 2px}
.turn-badge{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:4px;
background:var(--bg-item);color:var(--text-tertiary);border:1px solid var(--border-divider)}
.turn-badge.branch{color:var(--brand-opposite);border-color:rgba(236,27,218,.4)}
.turn.current .turn-badge{color:var(--brand);border-color:var(--brand)}
.turn-time{font-size:10px;color:var(--text-quaternary)}
.turn-branch-tag{font-size:9.5px;color:var(--text-quaternary);margin-left:auto}
.branch-divider{height:2px;width:100%;max-width:700px;align-self:center;margin:2px 0;
background:linear-gradient(to right,transparent,var(--brand),transparent);opacity:.5;border-radius:2px}

.bubble{padding:12px 15px;border-radius:14px 4px 14px 14px;max-width:82%;line-height:1.6;font-size:14px;word-break:break-word}
.bubble-user{background:var(--bg-usermsg);box-shadow:var(--shadow-usermsg);color:var(--text-primary);align-self:flex-end}
.ai-card{background:linear-gradient(180deg,var(--bg-card-up),var(--bg-card-down));border:1px solid var(--border-std);
border-radius:12px;box-shadow:var(--shadow-card);overflow:hidden;max-width:680px;width:100%}
.card-header{padding:10px 14px 7px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border-divider)}
.card-avatar{width:22px;height:22px;background:var(--brand);border-radius:6px;display:flex;align-items:center;
justify-content:center;font-weight:700;font-size:11px;color:#000;flex-shrink:0}
.card-label{font-size:12px;font-weight:600;color:var(--text-secondary)}
.card-body{padding:12px 14px}
.card-body p{font-size:13.5px;line-height:1.65;color:var(--text-primary);margin-bottom:8px}
.card-body p:last-child{margin-bottom:0}
.concept-term{border-bottom:1.5px dotted var(--text-tertiary);cursor:pointer;transition:border-color .2s;padding-bottom:1px}
.concept-term:hover{border-bottom-style:solid;border-bottom-color:var(--text-primary)}
.code-block{background:var(--bg);border:1px solid var(--border-divider);border-radius:6px;padding:9px 11px;
margin:8px 0;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;overflow-x:auto;
white-space:pre-wrap;word-break:break-all;color:var(--text-secondary)}
.card-footer{padding:7px 14px 10px;display:flex;gap:5px;border-top:1px solid var(--border-divider)}
.card-action-btn{padding:4px 9px;border:1px solid var(--border-std);border-radius:5px;background:var(--bg-btn);
color:var(--text-secondary);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px;
transition:all .15s;font-family:inherit}
.card-action-btn:hover{background:var(--bg-btn-hover);color:var(--text-primary)}

/* ── 思考块 + 工具卡片 (chat 可视化: 思考过程 / 工具调用) ── */
.ai-extras{display:flex;flex-direction:column;gap:8px;max-width:680px;width:100%;margin-top:8px}
.think-block{border:1px solid var(--border-std);border-left:3px solid var(--brand);
  border-radius:8px;background:var(--bg-card-down);overflow:hidden}
.think-block>summary{cursor:pointer;padding:8px 12px;font-size:12px;font-weight:600;
  color:var(--text-secondary);list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
.think-block>summary::-webkit-details-marker{display:none}
.think-block>summary::before{content:"▸";transition:transform .15s;font-size:10px;color:var(--text-tertiary)}
.think-block[open]>summary::before{transform:rotate(90deg)}
.think-len{margin-left:auto;font-weight:400;color:var(--text-tertiary);font-size:11px}
.think-body{padding:0 12px 10px;font-size:12.5px;line-height:1.6;color:var(--text-tertiary);
  white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto}
.tool-list{display:flex;flex-direction:column;gap:6px}
.tool-card{border:1px solid var(--border-std);border-radius:8px;background:var(--bg-card-down);
  overflow:hidden;font-size:12px}
.tool-card.fail{border-color:#ef4444}
.tool-head{padding:7px 11px;display:flex;align-items:center;gap:6px;background:rgba(127,127,127,.06)}
.tool-icon{font-size:13px}
.tool-name{font-weight:600;color:var(--text-primary);font-family:'JetBrains Mono',monospace}
.tool-state{margin-left:auto;font-size:11px;color:var(--text-tertiary)}
.tool-card.ok .tool-state{color:#22c55e}
.tool-card.fail .tool-state{color:#ef4444}
.tool-detail{border-top:1px solid var(--border-divider)}
.tool-detail>summary{cursor:pointer;padding:5px 11px;font-size:11px;color:var(--text-secondary);
  list-style:none;user-select:none}

.tool-detail>summary::before{content:"▸";margin-right:5px;font-size:9px;color:var(--text-tertiary)}

/* 阶段 4.1: 降级/警告黄色提示条 (非 error 红色, 不中断流) */

/* 上下文用量 + 缓存可视化 (chat 底部状态条) */
.chat-usage-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;
  padding:7px 16px;border-top:1px solid var(--border-divider);flex-shrink:0;
  font-size:11px;color:var(--text-tertiary);background:var(--bg-card-down);

.usage-gauge{width:92px;height:6px;border-radius:3px;background:var(--bg-input);
  border:1px solid var(--border-std);overflow:hidden;flex-shrink:0}

.usage-badge.warn{background:rgba(234,179,8,.15);color:#eab308;border:1px solid rgba(234,179,8,.4)}

/* 历史节点的持久化用量小行 */
.usage-line{font-size:11px;color:var(--text-tertiary);font-family:'JetBrains Mono',monospace;
  padding:4px 0 1px;border-top:1px dashed var(--border-divider);margin-top:2px}

/* Input */

border-radius:12px;display:flex;align-items:flex-end;padding:7px 11px;gap:7px;transition:border-color .2s}

font-family:inherit;line-height:1.5;resize:none;max-height:120px;min-height:20px;padding:3px 0}

display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:14px}

cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:13px}

@keyframes fadeIn{0%{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

</head>
<body>

<div class="app">
  <!-- Sidebar -->

      <div style="display:flex;gap:4px">
        <button class="tool-btn" title="Fit view" onclick="fitView()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button class="tool-btn" title="Reset" onclick="resetAll()" style="color:var(--brand-danger)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>

  <!-- Main Chat -->
  <main class="main">

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/><circle cx="18" cy="6" r="3"/></svg>
        </button>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>

        <span class="usage-label">缓存</span>

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>

<script>
'use strict';

/* ===== API Client ===== */
const API = {
  async _get(p){ const r=await fetch(p); return r.json(); },
  async _post(p,b){ const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}); return r.json(); },
  state(){return this._get('/api/state')},
  addTurn(b){return this._post('/api/add_turn',b)},
  chat(b){return this._post('/api/chat',b)},
  branchFrom(b){return this._post('/api/branch_from',b)},
  jumpTo(id){return this._post('/api/jump_to',{node_id:id})},
  prune(id){return this._post('/api/prune',{node_id:id})},
  memory(id){return this._get('/api/memory?node_id='+encodeURIComponent(id))},
  reset(){return this._post('/api/reset',{})},
  // B6: 流式 chat (SSE). onEvent(event) 收到 {type:thinking|content|tool_call|tool_result|warn|usage|done|error}
  // signal: 可选 AbortController.signal, 用于切换节点/重置时中止在飞请求
  chatStream(b,onEvent,signal){
    return fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(b||{}),signal}).then(r=>{
      if(!r.ok)throw new Error('HTTP '+r.status);
      const reader=r.body.getReader();const dec=new TextDecoder('utf-8');
      let buf='';
      const pump=()=>reader.read().then(({done,value})=>{
        if(done)return;
        buf+=dec.decode(value,{stream:true});
        let idx;
        while((idx=buf.indexOf('\n\n'))>=0){
          const frame=buf.slice(0,idx);buf=buf.slice(idx+2);
          const line=frame.split('\n').find(l=>l.indexOf('data:')===0);
          if(line){const payload=line.slice(5).trim();if(payload){try{onEvent(JSON.parse(payload))}catch(e){}}}
        }
        return pump();
      });
      return pump();
    });
  },
  // v2 APIs
  fork(b){return this._post('/api/fork',b)},
  conclude(id){return this._post('/api/conclude',{node_id:id})},
  merge(from,target){return this._post('/api/merge',{source_id:from,target_id:target})},
  unmerge(id){return this._post('/api/unmerge',{node_id:id})},
  abandon(id){return this._post('/api/abandon',{node_id:id})},
  rename(id,title){return this._post('/api/rename',{node_id:id,title:title})},
  deleteNode(id){return this._post('/api/delete_node',{node_id:id})},
  setAgent(id,agent,cascade=true){return this._post('/api/set_agent',{node_id:id,agent:agent,cascade:cascade})},
  fullContext(id){return this._get('/api/full_context?node_id='+encodeURIComponent(id))},
  nodeContent(id){return this._get('/api/node_content?node_id='+encodeURIComponent(id))},
  // B2: 设置节点执行状态 (supervisor / 测试)
  setExecState(b){return this._post('/api/node/exec_state',b)},
  // 多会话管理 (左侧栏)
  sessions(){return this._get('/api/sessions')},
  sessionCreate(b){return this._post('/api/sessions/create',b||{})},
  sessionSwitch(id){return this._post('/api/sessions/switch',{id:id})},
  sessionDelete(id){return this._post('/api/sessions/delete',{id:id})},
  sessionArchive(id){return this._post('/api/sessions/archive',{id:id})},
  sessionRename(id,title){return this._post('/api/sessions/rename',{id:id,title:title})}
};

/* ===== Data Model ===== */
class ConvNode{
  constructor(o){o=o||{};this.id=o.id;this.parentId=o.parentId||null;this.children=o.children||[];
  this.depth=o.depth||0;this.branchLabel=o.branchLabel||null;this.messages=o.messages||[];
  this.state=o.state||{};this.config=o.config||{};this.meta=o.meta||{};this.createdAt=o.createdAt||Date.now();
  this.nodeType=o.nodeType||'trunk';this.isValid=o.isValid!==false;
  this.mergeTarget=o.mergeTarget||null;this.mergedFrom=o.mergedFrom||[];
  this.skillsUsed=o.skillsUsed||[];this.toolCalls=o.toolCalls||[];this.conclusions=o.conclusions||[];
  this.thinking=o.thinking||'';this.usage=o.usage||{};
  this.execState=o.exec_state||'idle';this.execProgress=o.exec_progress||0;this.execDetail=o.exec_detail||'';
  this.agent=o.agent||'ikaros';}
}
class TreeView{
  constructor(nodesMap,rootId,currentId){this.nodes=nodesMap;this.rootId=rootId;this.currentId=currentId;this.version=0}
  get current(){return this.nodes.get(this.currentId)}
  getNode(id){return this.nodes.get(id)}
  getPath(id){id=id||this.currentId;const p=[];let c=this.nodes.get(id);while(c){p.unshift(c);c=c.parentId?this.nodes.get(c.parentId):null}return p}
  getContext(id){return this.getPath(id).reduce((a,n)=>a.concat(n.messages),[])}
  siblings(id){const n=this.nodes.get(id);if(!n||!n.parentId)return[];const p=this.nodes.get(n.parentId);return p.children.filter(c=>c!==id)}
  subtree(id){const res=[];const st=[id];while(st.length){const c=st.pop();const n=this.nodes.get(c);if(!n)continue;res.push(n);st.push.apply(st,n.children)}return res}
  isLeaf(id){const n=this.nodes.get(id);return n?n.children.length===0:true}
}

let tree=null,currentMem={path:[],cross:[]},branchParentId=null;

function installState(s){
  const m=new Map();
  Object.values(s.nodes).forEach(n=>{
    m.set(n.id,new ConvNode({id:n.id,parentId:n.parent_id,children:n.children,depth:n.depth,
      branchLabel:n.branch_label,messages:n.messages,state:n.state,config:n.config,
      meta:n.meta,createdAt:n.created_at,nodeType:n.node_type,isValid:n.is_valid,
      mergeTarget:n.merge_target,mergedFrom:n.merged_from,      skillsUsed:n.skills_used,
      toolCalls:n.tool_calls,conclusions:n.conclusions,
      execState:n.exec_state,execProgress:n.exec_progress,execDetail:n.exec_detail,
      agent:n.agent||'ikaros'}));
  });
  tree=new TreeView(m,s.root_id,s.current_id);
}

/* ===== Canvas State ===== */
let panX=20,panY=20,zoom=1;
const nodePositions={};      // id -> {x,y} in layout coordinates
const manualPositions={};    // id -> {x,y} manual override (persists across re-renders)
const NODE_W=160,NODE_H=50;
const H_GAP=100,V_GAP=90;
let selectedNode=null;
let connecting=null;         // {fromId, fromX, fromY, toX, toY}
let ctxMenuNode=null;        // node id for context menu

/* ===== Layout Algorithm ===== */
function calcLayout(){
  // Creation-order index: earlier nodes (by insertion) sort to the left
  const orderIdx={};let oi=0;tree.nodes.forEach((n,id)=>{orderIdx[id]=oi++});
  const pos={};let leaf=0;
  (function dfs(id,depth){
    const n=tree.nodes.get(id);if(!n)return;
    // Sort children by creation order for a predictable, comprehensible spread
    const kids=n.children.filter(c=>tree.nodes.has(c)).sort((a,b)=>orderIdx[a]-orderIdx[b]);
    if(!kids.length){pos[id]={x:leaf++,depth};}
    else{kids.forEach(k=>dfs(k,depth+1));const xs=kids.map(k=>pos[k].x);pos[id]={x:(Math.min(...xs)+Math.max(...xs))/2,depth};}
  })(tree.rootId,0);
  let maxX=0,maxD=0;
  Object.keys(pos).forEach(id=>{maxX=Math.max(maxX,pos[id].x);maxD=Math.max(maxD,pos[id].depth)});
  // Top-down tree: depth → vertical (y), leaf order → horizontal (x)
  const w=maxX*(NODE_W+H_GAP)+NODE_W+60, h=maxD*V_GAP+NODE_H+60;
  // Set canvas dimensions
  const layer=document.getElementById('canvasLayer');
  layer.style.width=w+'px';layer.style.height=h+'px';
  const es=document.getElementById('edgesSvg'),ts=document.getElementById('tempSvg');
  es.setAttribute('width',w);es.setAttribute('height',h);
  es.setAttribute('viewBox','0 0 '+w+' '+h);
  ts.setAttribute('width',w);ts.setAttribute('height',h);
  ts.setAttribute('viewBox','0 0 '+w+' '+h);
  // Node positions (absolute within layer)
  // x = leaf_x * (NODE_W + H_GAP) + offset (horizontal = sibling spread, left→right)
  // y = depth * V_GAP + offset (vertical = depth, top→bottom)
  Object.keys(pos).forEach(id=>{
    const manual=manualPositions[id];
    nodePositions[id]=manual
      ? {x:manual.x,y:manual.y}
      : {x:pos[id].x*(NODE_W+H_GAP)+NODE_W/2+30, y:pos[id].depth*V_GAP+NODE_H/2+30};
  });
  return {maxX:w, maxY:h};
}

/* ===== Canvas Transform ===== */
function applyTransform(){
  const layer=document.getElementById('canvasLayer');
  layer.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById('zoomInfo').textContent=Math.round(zoom*100)+'%';
}
function screenToCanvas(sx,sy){
  const rect=document.getElementById('canvasWrap').getBoundingClientRect();
  return {x:(sx-rect.left-panX)/zoom, y:(sy-rect.top-panY)/zoom};
}

/* ===== Rendering: Nodes ===== */
function renderNodes(){
  const layer=document.getElementById('nodesLayer');
  let html='';
  tree.nodes.forEach(n=>{
    const p=nodePositions[n.id];if(!p)return;
    const isCur=n.id===tree.currentId;
    const isSel=n.id===selectedNode;
    const label=nodeText(n);
    const typeCls=n.nodeType||'trunk';
    const validCls=n.isValid!==false?'is-valid':'';
    let tags='';
    if(!n.isValid)tags+='<span class="node-tag tag-abandoned">abandoned</span>';
    if(n.nodeType==='conclusion')tags+='<span class="node-tag tag-conclusion">conclusion</span>';
    if(n.mergeTarget)tags+='<span class="node-tag tag-merged">merged</span>';
    if(isCur)tags+='<span class="node-tag tag-current">current</span>';
    html+=`<div class="node-card ${typeCls} ${validCls} ${isCur?'current':''} ${isSel?'selected':''}"
      data-id="${n.id}" style="left:${p.x}px;top:${p.y}px"
      onmousedown="onNodeMouseDown(event,'${n.id}')"
      oncontextmenu="onNodeContextMenu(event,'${n.id}')">
      <div class="node-handle target" data-node="${n.id}" data-side="target"
        onmousedown="onHandleMouseDown(event,'${n.id}','target')"></div>
      <div class="node-depth">#${n.depth} · ${n.branchLabel||'main'} · <span class="agent-${n.agent==='hermes'?'hermes':'ikaros'}">${n.agent==='hermes'?'⚙ Hermes':'✦ Ikaros'}</span></div>
      <div class="node-label">${escapeHtml(label)}</div>
      ${tags?`<div class="node-tags">${tags}</div>`:''}
      ${execWrap(n)}
      <div class="node-handle source" data-node="${n.id}" data-side="source"
        onmousedown="onHandleMouseDown(event,'${n.id}','source')"></div>
    </div>`;
  });
  layer.innerHTML=html;
}

function nodeText(n){
  if(n.depth===0)return 'ROOT';
  if(n.meta&&n.meta.title)return n.meta.title;   // 重命名覆盖
  const um=n.messages.find(m=>m.role==='user');
  let s=um?um.content:'turn '+n.depth;
  if(s.length>18)s=s.slice(0,18)+'...';
  if(n.conclusions&&n.conclusions.length){
    s=n.conclusions[0];
    if(s.length>22)s=s.slice(0,22)+'...';
  }
  return s;
}

/* ===== B2: 执行状态徽标 (herdr exec_state 内化) ===== */
const EXEC_LABEL={idle:'idle',pending:'pending',working:'working',blocked:'blocked',done:'done',unknown:'unknown'};
function execInner(n){
  const st=n.execState||'idle';
  let h=`<span class="exec-badge badge-${st}">${EXEC_LABEL[st]||st}</span>`;
  if(st==='working'||st==='blocked'){
    const p=Math.max(0,Math.min(100,(n.execProgress||0)*100));
    h+=`<div class="exec-progress"><div class="exec-progress-fill" style="width:${p}%"></div></div>`;
  }
  if(n.execDetail){h+=`<div class="exec-detail">${escapeHtml(n.execDetail)}</div>`;}
  return h;
}
function execWrap(n){
  const st=n.execState||'idle';
  if(st==='idle')return '';
  return `<div class="exec-state-wrap" data-state="${st}">${execInner(n)}</div>`;
}

/* ===== Rendering: Edges (Bezier) ===== */
function renderEdges(){
  const svg=document.getElementById('edgesSvg');
  let paths='';
  // Parent-child edges (vertical: parent bottom-center → child top-center)
  tree.nodes.forEach(n=>{
    if(!n.parentId)return;
    const sp=nodePositions[n.parentId],tp=nodePositions[n.id];
    if(!sp||!tp)return;
    const startY=sp.y+NODE_H/2, endY=tp.y-NODE_H/2;
    const midY=startY+(endY-startY)*0.4;
    paths+=`<path class="edge-path parent-edge" data-from="${n.parentId}" data-to="${n.id}"
      d="M${sp.x},${startY} C${sp.x},${midY} ${tp.x},${midY} ${tp.x},${endY}"
      marker-end="url(#arrowhead)"/>`;
  });
  // Merge edges (vertical arc: source bottom-center → target top-center)
  tree.nodes.forEach(n=>{
    if(!n.mergeTarget)return;
    const sp=nodePositions[n.id],tp=nodePositions[n.mergeTarget];
    if(!sp||!tp)return;
    const startY=sp.y+NODE_H/2, endY=tp.y-NODE_H/2;
    const midY=(startY+endY)/2;
    paths+=`<path class="edge-path merge-line" data-from="${n.id}" data-to="${n.mergeTarget}"
      d="M${sp.x},${startY} C${sp.x},${midY} ${tp.x},${midY} ${tp.x},${endY}"
      marker-end="url(#arrowhead-merge)"/>`;
  });
  svg.innerHTML=svg.querySelector('defs').outerHTML+paths;
}

/* ===== Drag to Connect ===== */
function onHandleMouseDown(e,nodeId,side){
  e.stopPropagation();e.preventDefault();
  if(side!=='source')return;
  const p=nodePositions[nodeId];if(!p)return;
  connecting={fromId:nodeId, fromX:p.x, fromY:p.y+NODE_H/2, toX:p.x, toY:p.y+NODE_H/2};
  updateTempLine();
  document.getElementById('tempLine').style.display='';
  const handle=document.querySelector(`.node-card[data-id="${nodeId}"] .node-handle.source`);
  if(handle)handle.classList.add('dragging');
}

function onNodeMouseDown(e,nodeId){
  if(e.button!==0)return;
  e.preventDefault(); // prevent text selection / browser drag
  selectedNode=nodeId;
  renderNodes();renderEdges();
  // Start node drag
  const p=nodePositions[nodeId];if(!p)return;
  const startX=e.clientX,startY=e.clientY,startPX=p.x,startPY=p.y;
  document.body.style.userSelect='none';
  document.body.style.webkitUserSelect='none';
  function onMove(ev){
    ev.preventDefault();
    const dx=(ev.clientX-startX)/zoom,dy=(ev.clientY-startY)/zoom;
    p.x=startPX+dx;p.y=startPY+dy;
    renderNodes();renderEdges();
  }
  function onUp(ev){
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onUp);
    document.body.style.userSelect='';
    document.body.style.webkitUserSelect='';
    if(Math.abs(ev.clientX-startX)<3&&Math.abs(ev.clientY-startY)<3){
      // Click (not drag) -> jump to node
      doJump(nodeId);
    }else{
      // Persist manual position so re-renders don't reset it
      manualPositions[nodeId]={x:p.x, y:p.y};
    }
  }
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
}

async function handleCtxAction(action){
  const nid=ctxMenuNode;          // 先捕获，避免 hideCtxMenu 将其置空
  hideCtxMenu();
  if(!nid)return;
  switch(action){
    case 'setCurrent':await API.jumpTo(nid);await refresh();break;
    case 'openInChat':await openInChat(nid);break;
    case 'agentIkaros':await API.setAgent(nid,'ikaros');await refresh();break;
    case 'agentHermes':await API.setAgent(nid,'hermes');await refresh();break;
    case 'copy':copyNodeSummary(nid);break;
    case 'rename':await renameNodePrompt(nid);break;
    case 'fullContext':await showFullContext(nid);break;
    case 'fork': branchParentId=nid;document.getElementById('inputField').placeholder='↳ Fork from '+nodeText(tree.nodes.get(nid))+'…';focusInput();break;
    case 'conclude':await API.conclude(nid);await refresh();break;
    case 'merge':await API.merge(nid,'__trunk__');await refresh();break;
    case 'unmerge':await API.unmerge(nid);await refresh();break;
    case 'abandon':await API.abandon(nid);await refresh();break;
    case 'deleteNode':if(nid!==tree.rootId){if(confirm('删除该节点？其子节点将重挂到父节点。')){await API.deleteNode(nid);await refresh();}}break;
    case 'prune':if(nid!==tree.rootId){if(confirm('剪枝该子树？将删除本节点及其全部后代。')){await API.prune(nid);await refresh();}}break;
  }
}

/* ===== Canvas Pan & Zoom ===== */
(function setupCanvas(){
  const wrap=document.getElementById('canvasWrap');
  let panning=false,px=0,py=0;
  wrap.addEventListener('mousedown',e=>{
    if(e.target===wrap||e.target.classList.contains('canvas-grid')){
      panning=true;px=e.clientX-panX;py=e.clientY-panY;
      wrap.classList.add('panning');e.preventDefault();
    }
  });
  window.addEventListener('mousemove',e=>{
    if(panning){panX=e.clientX-px;panY=e.clientY-py;applyTransform();}
    if(connecting){
      const c=screenToCanvas(e.clientX,e.clientY);
      connecting.toX=c.x;connecting.toY=c.y;updateTempLine();
      document.querySelectorAll('.node-handle.target').forEach(h=>h.classList.remove('dragging'));
      const el=document.elementFromPoint(e.clientX,e.clientY);
      if(el&&el.classList.contains('node-handle')&&el.dataset.side==='target'){
        el.classList.add('dragging');
      }
    }
  });
  window.addEventListener('mouseup',e=>{
    if(panning){panning=false;wrap.classList.remove('panning')}
    if(connecting){
      // Check if dropped on a target handle
      const el=document.elementFromPoint(e.clientX,e.clientY);
      if(el&&el.classList.contains('node-handle')&&el.dataset.side==='target'){
        const targetId=el.dataset.node;
        if(targetId&&targetId!==connecting.fromId){
          createConnection(connecting.fromId,targetId);
        }
      }
      connecting=null;
      document.getElementById('tempLine').style.display='none';
      document.querySelectorAll('.node-handle.dragging').forEach(h=>h.classList.remove('dragging'));
    }
  });
  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const delta=e.deltaY>0?0.9:1.1;
    const newZoom=Math.min(3,Math.max(0.15,zoom*delta));
    const rect=wrap.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    panX=mx-(mx-panX)*(newZoom/zoom);
    panY=my-(my-panY)*(newZoom/zoom);
    zoom=newZoom;applyTransform();
  },{passive:false});
  // Touch support
  let touches=[];
  wrap.addEventListener('touchstart',e=>{
    if(e.touches.length===1){panning=true;px=e.touches[0].clientX-panX;py=e.touches[0].clientY-panY}
    else if(e.touches.length===2){touches=[...e.touches]}
    e.preventDefault();
  },{passive:false});
  wrap.addEventListener('touchmove',e=>{
    if(panning&&e.touches.length===1){panX=e.touches[0].clientX-px;panY=e.touches[0].clientY-py;applyTransform()}
    else if(e.touches.length===2){
      const d0=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
      const d1=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      zoom=Math.min(3,Math.max(0.15,zoom*(d1/d0)));applyTransform();touches=[...e.touches];
    }
    e.preventDefault();
  },{passive:false});
  wrap.addEventListener('touchend',()=>{panning=false});
})();

/* ===== Resizable Splitters ===== */
(function setupSplitters(){
  const sidebar=document.querySelector('.sidebar');
  const treePanel=document.querySelector('.tree-panel');
  const s1=document.getElementById('splitter1');
  const s2=document.getElementById('splitter2');
  // Restore saved widths
  try{
    const saved=JSON.parse(localStorage.getItem('conv-tree-layout')||'{}');
    if(saved.sw&&saved.sw>=120&&saved.sw<=300) sidebar.style.setProperty('--sidebar-w',saved.sw+'px');
    if(saved.tw) treePanel.style.setProperty('--tree-w',saved.tw+'px');
  }catch(e){}
  function saveLayout(){
    const sw=parseInt(getComputedStyle(sidebar).width);
    const tw=parseInt(getComputedStyle(treePanel).width);
    try{localStorage.setItem('conv-tree-layout',JSON.stringify({sw,tw}))}catch(e){}
  }
  // Splitter 1: sidebar (--sidebar-w, min 120 / max 300) ↔ tree-panel (--tree-w)
  (function(){
    let dragging=false,startX=0,startSw=0,startTw=0;
    s1.addEventListener('mousedown',e=>{
      dragging=true;s1.classList.add('active');
      startX=e.clientX;startSw=parseInt(getComputedStyle(sidebar).width);
      startTw=parseInt(getComputedStyle(treePanel).width);
      document.body.style.userSelect='none';document.body.style.cursor='col-resize';
      e.preventDefault();
    });
    s1.addEventListener('touchstart',e=>{
      dragging=true;s1.classList.add('active');
      startX=e.touches[0].clientX;startSw=parseInt(getComputedStyle(sidebar).width);
      startTw=parseInt(getComputedStyle(treePanel).width);
      document.body.style.userSelect='none';document.body.style.cursor='col-resize';
    },{passive:false});
    function onMove(e){
      if(!dragging)return;
      const cx=e.touches?e.touches[0].clientX:e.clientX;
      let nw=startSw+(cx-startX);
      if(nw<120)nw=120;if(nw>300)nw=300;
      sidebar.style.setProperty('--sidebar-w',nw+'px');
      treePanel.style.setProperty('--tree-w',(startSw+startTw-nw)+'px');
    }
    function onUp(){
      if(!dragging)return;
      dragging=false;s1.classList.remove('active');
      document.body.style.userSelect='';document.body.style.cursor='';
      saveLayout();
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('touchmove',onMove,{passive:false});
    window.addEventListener('mouseup',onUp);
    window.addEventListener('touchend',onUp);
  })();
  // Splitter 2: tree-panel (--tree-w) ↔ main (flex:1, auto)
  (function(){
    let dragging=false,startX=0,startTw=0;
    s2.addEventListener('mousedown',e=>{
      dragging=true;s2.classList.add('active');
      startX=e.clientX;startTw=parseInt(getComputedStyle(treePanel).width);
      document.body.style.userSelect='none';document.body.style.cursor='col-resize';
      e.preventDefault();
    });
    s2.addEventListener('touchstart',e=>{
      dragging=true;s2.classList.add('active');
      startX=e.touches[0].clientX;startTw=parseInt(getComputedStyle(treePanel).width);
      document.body.style.userSelect='none';document.body.style.cursor='col-resize';
    },{passive:false});
    function onMove(e){
      if(!dragging)return;
      const cx=e.touches?e.touches[0].clientX:e.clientX;
      let nw=startTw+(cx-startX);
      treePanel.style.setProperty('--tree-w',nw+'px');
    }
    function onUp(){
      if(!dragging)return;
      dragging=false;s2.classList.remove('active');
      document.body.style.userSelect='';document.body.style.cursor='';
      saveLayout();
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('touchmove',onMove,{passive:false});
    window.addEventListener('mouseup',onUp);
    window.addEventListener('touchend',onUp);
  })();
  saveLayout();
})();

function updateTempLine(){

async function createConnection(fromId,targetId){
  // Determine action based on tree structure
  const from=tree.nodes.get(fromId),target=tree.nodes.get(targetId);
  if(!from||!target)return;
  // If target is a trunk ancestor and from is a branch -> merge
  const targetPath=tree.getPath(targetId);
  const isTrunk=target.nodeType==='trunk'||target.depth<from.depth;
  if(isTrunk&&from.nodeType==='branch'){
    await API.merge(fromId,targetId);
  }else{
    // Default: fork from target
    branchParentId=targetId;
    document.getElementById('inputField').placeholder='↳ Fork from '+nodeText(target)+'…';
    focusInput();
  }
  await refresh();
}

/* ===== 思考块 + 工具卡片 (chat 可视化) ===== */
function thinkBlockHtml(thinking){
  if(!thinking||!thinking.trim())return '';
  return `<details class="think-block" open><summary>💭 思考过程 <span class="think-len">${thinking.length} 字</span></summary><div class="think-body">${escapeHtml(thinking)}</div></details>`;

function toolCardHtml(tc){
  // 兼容持久化(ToolCall: name/params/result_summary/success) 与 实时(tool_call/tool_result: name/args/result/ok)
  const name=tc.name||(tc.function&&tc.function.name)||'未知工具';
  const args=tc.params!=null?tc.params:(tc.args!=null?tc.args:{});
  const rawRes=tc.result_summary!=null?tc.result_summary:(tc.result!=null?tc.result:'');
  const res=typeof rawRes==='string'?rawRes:JSON.stringify(rawRes,null,2);
  const ok=tc.success!=null?tc.success:(tc.ok!=null?tc.ok:true);
  const argsStr=JSON.stringify(args,null,2);
  return `<div class="tool-card ${ok?'ok':'fail'}">
    <div class="tool-head"><span class="tool-icon">🔧</span><span class="tool-name">${escapeHtml(name)}</span>
      <span class="tool-state">${ok?'✓ 完成':'✗ 失败'}</span></div>
    <details class="tool-detail"><summary>参数</summary><pre class="tool-args">${escapeHtml(argsStr)}</pre></details>
    <details class="tool-detail"><summary>结果</summary><pre class="tool-result">${escapeHtml((res||'').slice(0,2000))}</pre></details>
  </div>`;
}
function extrasHtml(node){
  let h='';
  if(node.thinking&&node.thinking.trim())h+=thinkBlockHtml(node.thinking);
  const tcs=node.toolCalls||[];
  if(tcs.length)h+='<div class="tool-list">'+tcs.map(toolCardHtml).join('')+'</div>';
  h+=usageLineHtml(node);
  return h?`<div class="ai-extras">${h}</div>`:'';
}
function renderExtras(container,live){
  let h='';
  if(live.thinking&&live.thinking.trim())h+=thinkBlockHtml(live.thinking);
  const tcs=Object.values(live.tools||{});
  if(tcs.length)h+='<div class="tool-list">'+tcs.map(toolCardHtml).join('')+'</div>';
  container.innerHTML=h;
}

/* ===== 上下文用量 + 缓存可视化 (chat 底部状态条 + 历史节点小行) ===== */
// 与 server.py 的 CT_DEEPSEEK_MODEL / CT_CONTEXT_WINDOW 默认值保持一致 (env 可覆盖).
const CT_MODEL='deepseek-v4-flash', CT_CTX=64000;
function fmtTok(n){
  n=Math.round(Number(n)||0);
  if(n>=1000)return (n/1000).toFixed(n>=10000?0:1)+'K';
  return String(n);
}
function updateUsageBar(usage, model, ctxWin){
  const u=usage||{}, pt=u.prompt_tokens||0, ct=u.completion_tokens||0;
  const tot=u.total_tokens||(pt+ct);
  const hit=u.prompt_cache_hit_tokens||0, miss=u.prompt_cache_miss_tokens||0;
  const reason=(u.completion_tokens_details&&u.completion_tokens_details.reasoning_tokens)||0;
  const win=ctxWin||CT_CTX;
  const pct=win>0?Math.min(100,pt/win*100):0;
  const fill=document.getElementById('ctxFill');
  if(fill){fill.style.width=pct.toFixed(1)+'%';
    fill.style.background=pct>90?'#ef4444':pct>70?'#eab308':'var(--brand)';}
  const ctxEl=document.getElementById('ctxText');
  if(ctxEl)ctxEl.textContent=fmtTok(pt)+' / '+fmtTok(win)+' ('+pct.toFixed(0)+'%)';
  const badge=document.getElementById('cacheBadge');
  if(badge){
    const rate=pt>0?hit/pt*100:0;
    let cls='',txt='—';
    if(pt>0){
      if(rate>=85){cls='good';}else if(rate>=70){cls='warn';}else{cls='bad';}
      txt='命中 '+rate.toFixed(0)+'%';
    }
    badge.className='usage-badge '+cls;badge.textContent=txt;
  }
  const cacheEl=document.getElementById('cacheText');
  if(cacheEl)cacheEl.textContent=pt>0?('命中 '+fmtTok(hit)+' · 未命中 '+fmtTok(miss)):'';
  const tokEl=document.getElementById('tokenText');
  if(tokEl)tokEl.innerHTML='总计 <b>'+fmtTok(tot)+'</b> · 输入 <b>'+fmtTok(pt)+'</b> · 输出 <b>'
    +fmtTok(ct)+'</b>'+(reason?' · 思考 <b>'+fmtTok(reason)+'</b>':'')
    +(model?' · '+escapeHtml(model):'');
}
function usageLineHtml(node){
  const u=node.usage||{};
  if(!u||!u.prompt_tokens)return '';
  const pt=u.prompt_tokens||0, ct=u.completion_tokens||0, tot=u.total_tokens||(pt+ct);
  const hit=u.prompt_cache_hit_tokens||0, miss=u.prompt_cache_miss_tokens||0;
  const reason=(u.completion_tokens_details&&u.completion_tokens_details.reasoning_tokens)||0;
  const rate=pt>0?Math.round(hit/pt*100):0;
  return '<div class="usage-line">⚡ 上下文 '+fmtTok(pt)+'/'+fmtTok(CT_CTX)
    +' · 缓存 '+rate+'% ('+fmtTok(hit)+'/'+fmtTok(miss)+') · 总 '+fmtTok(tot)
    +(reason?' · 思考 '+fmtTok(reason):'')+'</div>';
}
function aiCardHtml(content,isCur){
  const parts=content.split(/```/);
  let h='';
  parts.forEach((seg,i)=>{
    if(i%2===1)h+=`<div class="code-block">${escapeHtml(seg.trim())}</div>`;
    else if(seg.trim())h+=`<p>${highlightConcepts(escapeHtml(seg.trim()),isCur)}</p>`;
  });
  const sbCls=isCur?'streaming-border-effect':'';
  return `<div class="ai-card ${sbCls}"><div class="card-header"><div class="card-avatar">E</div><span class="card-label">Explore</span></div>
    <div class="card-body">${h}</div><div class="card-footer">
    <button class="card-action-btn" onclick="copyCard(event)">⧉ Copy</button>
    <button class="card-action-btn" data-branch="1">↳ Branch</button>
    <button class="card-action-btn" style="margin-left:auto" onclick="favoriteCard(this)">★ Favorite</button>
    </div></div>`;
}
function highlightConcepts(s,isCur){
  const cls=isCur?'concept-term highlight-text-flash':'concept-term';
  return s.replace(/(GTO|Nash equilibrium|neural network|attention|self-play|policy|equilibrium|game theory)/gi,'<span class="'+cls+'">$1</span>');
}
function renderHeader(){
  const path=tree.getPath();
  const crumbs=path.map((n,i)=>i===path.length-1?`<span class="cur">${escapeHtml(nodeText(n))}</span>`:`<b>${escapeHtml(nodeText(n))}</b>`);
  document.getElementById('breadcrumb').innerHTML='Path: '+crumbs.join(' <span style="opacity:.4">›</span> ');
  document.getElementById('branchBanner').classList.toggle('show',!tree.isLeaf(tree.currentId));
  const cur=tree.current;
  document.getElementById('treeInfo').innerHTML=
    `<div><b>Current</b> #${cur.depth} · ${cur.branchLabel||'main'} · ${cur.children.length} children</div>
     <div style="margin-top:2px;font-size:10px">Path <b>${path.length}</b> · Siblings <b>${tree.siblings(cur.id).length}</b> · Total <b>${tree.nodes.size}</b> nodes</div>`;
  const mp=document.getElementById('memPath'),mc=document.getElementById('memCross');
  mp.innerHTML=currentMem.path&&currentMem.path.length?currentMem.path.map(x=>memItem(x,'path')).join(''):'<div class="mem-item" style="opacity:.45">No path memories</div>';
  mc.innerHTML=currentMem.cross&&currentMem.cross.length?currentMem.cross.map(x=>memItem(x,'cross')).join(''):'<div class="mem-item" style="opacity:.45">No cross-branch memories</div>';
  document.getElementById('branchList').innerHTML=tree.nodes.size+' nodes · '+(path[0]?path[0].branchLabel||'main':'');
}
function memItem(x,kind){
  const m=x.mem;const tags=(m.tags||[]).slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('');
  return `<div class="mem-item ${kind}"><span class="src">${kind==='path'?'path':'cross'}</span>${escapeHtml(m.text)}${tags}</div>`;
}

/* ===== Interactions ===== */
async function boot(){
  try{const s=await API.state();installState(s);await refreshMem();selectedNode=tree.currentId;renderAll();fitView();await renderSessions();}
  catch(e){console.error(e)}
  connectEventStream();  // B2: 订阅任务事件流, 实时更新节点状态徽标 (替代轮询)
}
/* ===== 多会话 (左侧栏 新建/切换/删除/归档/重命名) ===== */
let _activeSessionId=null;
async function renderSessions(){
  try{
    const d=await API.sessions();
    const list=d.sessions||[];_activeSessionId=d.active_id;
    const el=document.getElementById('sessionList');
    if(!el)return;
    const active=list.filter(s=>!s.archived);
    const archived=list.filter(s=>s.archived);
    const html=[];
    active.forEach(s=>html.push(sessionItemHTML(s)));
    if(archived.length){html.push('<div class="session-group-label">已归档</div>');archived.forEach(s=>html.push(sessionItemHTML(s)));}
    el.innerHTML=html.join('');
  }catch(e){console.warn('renderSessions failed',e);}
}
function sessionItemHTML(s){
  const isActive=s.id===_activeSessionId;
  const title=escapeHtml(s.title||'未命名会话');
  const sub=s.current_title?escapeHtml(s.current_title):(s.updated_at?relTime(s.updated_at):'空会话');
  const archBtn=s.archived?'↩':'🗄';
  const archTitle=s.archived?'取消归档':'归档';
  return `<div class="session-item ${isActive?'active':''} ${s.archived?'archived':''}" data-id="${s.id}" `
    +`onclick="switchSession('${s.id}')" ondblclick="renameSession('${s.id}')" title="双击重命名">`
    +`<div class="sess-body"><div class="sess-title">${title}</div><div class="sess-meta">${sub}</div></div>`
    +`<div class="sess-actions">`
    +`<button class="sess-act" title="${archTitle}" onclick="event.stopPropagation();archiveSession('${s.id}')">${archBtn}</button>`
    +`<button class="sess-act danger" title="删除会话" onclick="event.stopPropagation();deleteSession('${s.id}')">🗑</button>`
    +`</div></div>`;
}
function relTime(ts){
  const diff=Math.floor((Date.now()-ts*1000)/1000);
  if(diff<60)return '刚刚';
  if(diff<3600)return Math.floor(diff/60)+' 分钟前';
  if(diff<86400)return Math.floor(diff/3600)+' 小时前';
  if(diff<604800)return Math.floor(diff/86400)+' 天前';
  const d=new Date(ts*1000);return (d.getMonth()+1)+'/'+d.getDate();
}
function _applySessionState(d){
  installState(d.state);selectedNode=tree.currentId;
  Promise.resolve(refreshMem()).then(()=>{renderAll();fitView();});
}
async function createSession(){
  try{
    const d=await API.sessionCreate({});
    _applySessionState(d);await renderSessions();toast('已新建会话');
  }catch(e){alert('新建会话失败：'+(e.message||e));}
}
async function switchSession(id){
  if(id===_activeSessionId)return;
  abortActiveChat();
  try{
    const d=await API.sessionSwitch(id);
    _applySessionState(d);await renderSessions();
  }catch(e){alert('切换会话失败：'+(e.message||e));}
}
async function deleteSession(id){
  if(!confirm('删除该会话？其对话树与记忆将被永久移除，且不可恢复。'))return;
  abortActiveChat();
  try{
    const d=await API.sessionDelete({id:id});
    _applySessionState(d);await renderSessions();toast('已删除会话');
  }catch(e){alert('删除失败：'+(e.message||e));}
}
async function archiveSession(id){
  try{await API.sessionArchive({id:id});await renderSessions();}
  catch(e){alert('归档失败：'+(e.message||e));}
}
async function renameSession(id){
  const title=prompt('重命名会话：','');
  if(title===null)return;
  try{await API.sessionRename({id:id,title:title});await renderSessions();}
  catch(e){alert('重命名失败：'+(e.message||e));}
}
/* ===== B2: 事件流订阅 (对应 herdr events.subscribe) ===== */
function connectEventStream(){
  if(typeof EventSource==='undefined')return;
  try{
    const es=new EventSource('/api/events');
    es.onmessage=ev=>{
      let d;try{d=JSON.parse(ev.data);}catch(_){return;}
      if(d&&d.type==='node.exec_state_changed')applyExecEvent(d.data||{});
    };
    es.onerror=()=>{/* 连接断开时浏览器会自动重连 */};
  }catch(e){console.warn('EventSource init failed',e);}
}
function applyExecEvent(d){
  if(!tree||!d.node_id)return;
  const n=tree.nodes.get(d.node_id);
  if(!n)return;
  n.execState=d.exec_state||n.execState;
  if(typeof d.progress==='number')n.execProgress=d.progress;
  if(d.detail!=null)n.execDetail=d.detail;
  // 定向更新该卡片的徽标 (不重渲整棵树, 避免打断拖拽)
  const card=document.querySelector('.node-card[data-id="'+CSS.escape(d.node_id)+'"]');
  if(!card)return;
  let wrap=card.querySelector('.exec-state-wrap');
  if(!wrap){wrap=document.createElement('div');wrap.className='exec-state-wrap';card.appendChild(wrap);}
  wrap.setAttribute('data-state',n.execState);
  wrap.innerHTML=execInner(n);
}
async function refreshMem(){currentMem=tree?(await API.memory(tree.currentId)):{path:[],cross:[]}}
async function refresh(){const s=await API.state();installState(s);await refreshMem();renderAll()}
// 阶段 5.2: 全局在飞 chat 请求的 AbortController; 切换节点/重置/切会话时中止 (后端支持断开即中断)
let chatSending=false, activeChat=null;
function abortActiveChat(){
  if(activeChat){try{activeChat.abort()}catch(_){ }activeChat=null;}
}
async function doJump(id){abortActiveChat();await API.jumpTo(id);await refresh()}
function focusInput(){document.getElementById('inputField').focus()}
// 阶段 4.1: 降级/警告黄色提示条 (不中断流, 区别于 error 红色)
function showWarnBanner(turn,msg){
  let b=turn.querySelector('.warn-banner');
  if(!b){b=document.createElement('div');b.className='warn-banner';
    const anchor=turn.querySelector('.ai-card')||turn.firstChild;
    turn.insertBefore(b,anchor);}
  const prev=b.textContent?b.textContent+' ':'';b.textContent=prev+'⚠ '+msg;
}

async function sendMessage(){
  const f=document.getElementById('inputField');const text=f.value.trim();
  // 阶段 5.1: 单飞 —— 发送期间禁用输入框/回车, 防止同父节点下并发插入
  if(!text||chatSending)return;
  const branchLabel=tree.current?(tree.current.branchLabel||'main'):'main';
  const parentId=branchParentId||undefined;
  // 乐观创建: 用户气泡 + 空 AI 卡 + 空 extras 容器 (思考/工具实时注入)
  const area=document.getElementById('messagesArea');
  const depth=tree.current?tree.current.depth+1:1;
  const turn=document.createElement('div');turn.className='turn';
  turn.innerHTML=`<div class="turn-head"><span class="turn-badge">#${depth} ${branchLabel||'main'}</span></div>
    <div class="bubble bubble-user">${escapeHtml(text)}</div>
    <div class="ai-card"><div class="card-body answer-body"></div></div>
    <div class="ai-extras"></div>`;
  area.appendChild(turn);area.scrollTop=area.scrollHeight;
  const answerBody=turn.querySelector('.answer-body');
  const extras=turn.querySelector('.ai-extras');
  const live={thinking:'',tools:{}};
  let accAnswer='';
  f.value='';f.style.height='auto';
  if(f.placeholder.indexOf('Fork')>=0)f.placeholder='从当前节点继续，或点树中节点跳转…';
  chatSending=true;f.disabled=true;
  const ac=new AbortController();activeChat=ac;
  try{
    await API.chatStream({message:text,parent_id:parentId,branch_label:branchLabel},(ev)=>{
      if(ev.type==='thinking'){
        live.thinking+=ev.delta;renderExtras(extras,live);area.scrollTop=area.scrollHeight;
      }else if(ev.type==='content'){
        accAnswer+=ev.delta;answerBody.innerHTML=escapeHtml(accAnswer);
        area.scrollTop=area.scrollHeight;
      }else if(ev.type==='tool_call'){
        live.tools[ev.id]={name:ev.name,args:ev.args||{},result:'',ok:null};
        renderExtras(extras,live);area.scrollTop=area.scrollHeight;
      }else if(ev.type==='tool_result'){
        if(live.tools[ev.id]){live.tools[ev.id].result=ev.result||'';live.tools[ev.id].ok=ev.ok;}
        renderExtras(extras,live);area.scrollTop=area.scrollHeight;
      }else if(ev.type==='usage'){
        // 上下文用量 + 缓存命中: 流式结束后由 usage 块推送
        live.usage=ev.usage||{};
        updateUsageBar(ev.usage, ev.model, ev.context_window);
      }else if(ev.type==='warn'){
        // 降级可见化: 黄色提示条, 不中断流
        showWarnBanner(turn,ev.message||'');
      }else if(ev.type==='done'){
        // 用 store 渲染覆盖 live (含持久化 thinking/工具), 重渲染画布
        installState(ev.state);selectedNode=tree.currentId;
        branchParentId=null;
        Promise.resolve(refreshMem()).then(()=>{renderAll();fitView();});
        renderSessions();  // 刷新左侧栏会话预览 (当前节点摘要)
      }else if(ev.type==='error'){
        answerBody.innerHTML='<p style="color:#ef4444">[错误] '+escapeHtml(ev.message||'未知错误')+'</p>';
      }
    },ac.signal);
  }catch(e){
    if(e&&e.name==='AbortError'){
      // 主动中断 (切换节点/重置): 温和提示, 树状态由后续 refresh 接管, 不会脏
      answerBody.innerHTML='<p style="opacity:.55">（已中断）</p>';
    }else{
      answerBody.innerHTML='<p style="color:#ef4444">[请求失败] '+escapeHtml(e.message||String(e))+'</p>';
    }
  }
  chatSending=false;f.disabled=false;
  if(activeChat===ac)activeChat=null;
  branchParentId=null;
}
async function branchFromCurrent(){
  const cur=tree.current;
  branchParentId=cur.children.length===0&&cur.parentId?cur.parentId:cur.id;
  document.getElementById('inputField').placeholder='↳ Fork from '+nodeText(cur)+'…';focusInput();
}
async function pruneCurrent(){
  if(tree.currentId===tree.rootId){alert('Cannot prune root');return}
  await API.prune(tree.currentId);await refresh();
}
async function resetAll(){branchParentId=null;Object.keys(manualPositions).forEach(k=>delete manualPositions[k]);abortActiveChat();await API.reset();await refresh();fitView()}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function escapeHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function copyCard(e){const b=e.currentTarget;b.innerHTML='✓ Copied';setTimeout(()=>b.innerHTML='⧉ Copy',1600)}
function favoriteCard(btn){const card=btn.closest('.ai-card');
  if(card){card.classList.add('streaming-border-effect','favorite')}
  btn.innerHTML='★ Favorited';setTimeout(()=>btn.innerHTML='★ Favorite',1600)}
/* ===== Theme: 跟随系统 / Dark / Warm + 持久化上次选择 ===== */
const THEME_KEY='conv-tree-theme';
let _themeMql=null,_themePref='dark';
function _getMql(){if(!_themeMql)_themeMql=window.matchMedia('(prefers-color-scheme: dark)');return _themeMql}
function systemTheme(){return _getMql().matches?'dark':'warm'}  // 系统深色→dark, 系统浅色→warm
function applyTheme(pref){
  _themePref=pref;
  try{localStorage.setItem(THEME_KEY,pref)}catch(e){}  // 持久化: 不跟随系统时默认读取此处
  const resolved=pref==='system'?systemTheme():pref;
  document.documentElement.setAttribute('data-theme',resolved);
  document.documentElement.style.colorScheme=resolved==='dark'?'dark':'light';
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===pref));
}
function onSystemThemeChange(){if(_themePref==='system')applyTheme('system')}  // 仅跟随系统时才随系统切换
function switchTheme(t){applyTheme(t)}  // 兼容旧调用
// 立即应用已保存主题(避免初始闪烁) + 注册系统主题监听
(function initTheme(){
  const mql=_getMql();
  if(typeof mql.addEventListener==='function')mql.addEventListener('change',onSystemThemeChange);
  else if(typeof mql.addListener==='function')mql.addListener(onSystemThemeChange);  // 旧 Safari
  let pref=null;try{pref=localStorage.getItem(THEME_KEY)}catch(e){}
  applyTheme(pref||'dark');  // 无保存记录时默认 dark
})();
