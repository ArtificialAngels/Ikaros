<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Explore — Conversation Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--brand:#13E425;--brand-secondary:#13E425;--brand-danger:#D90000;--brand-opposite:#EC1BDA;
--bg:#101010;--bg-modal:#222222;--bg-card-up:#222222;--bg-card-down:#222222;--bg-floating:#2F2F2F;
--bg-btn:#3C3C3C;--bg-btn-hover:#5E5E5E;--bg-item:#363636;--bg-item-hover:#484848;--bg-usermsg:#4C4C4C;
--bg-input:#3A3A3A;--bg-bar:#5A5A5A;--bg-separator:#848484;--border-std:#484848;--border-divider:#373737;
--border-turn:#4C4C4C;--text-primary:#FFFFFF;--text-secondary:#D1D1D1;--text-tertiary:#999999;
--text-quaternary:#777777;--text-header-secondary:#E5E5E5;--text-turn-title:#AAAAAA;
--scrollbar-thumb-card:#888888;--scrollbar-thumb-input:#BBBBBB;--shadow-card:0 4px 24px rgba(0,0,0,.3);
--shadow-btn:0 2px 4px rgba(0,0,0,.4);--shadow-usermsg:0 2px 12px rgba(0,0,0,.6);
--stroke-tree-link:#D9D9D9;--stroke-tree-node:#999999;}
[data-theme="warm"]{--bg:#F2EADB;--bg-modal:#EBE8E1;--bg-card-up:#EBE8E1;--bg-card-down:#EBE8E1;
--bg-floating:#E1DED7;--bg-btn:#D7D4CD;--bg-btn-hover:#AFA591;--bg-item:#DCD9D2;--bg-item-hover:#D2CFC8;
--bg-usermsg:#D7CDB9;--bg-input:#E6E3DC;--bg-bar:#E1DED7;--border-std:#D7D2C8;--border-divider:#CDC8BE;
--text-primary:#1A1A1A;--text-secondary:#555555;--text-tertiary:#888888;--text-quaternary:#AAAAAA;
--text-header-secondary:#333333;--shadow-card:0 4px 24px rgba(0,0,0,.08);--shadow-btn:0 2px 4px rgba(0,0,0,.12);
--shadow-usermsg:0 2px 12px rgba(0,0,0,.1);--stroke-tree-link:#999999;--stroke-tree-node:#555555;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);
color:var(--text-primary);display:flex;height:100vh;transition:background .3s,color .3s;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb-card);border-radius:6px;}
.app{display:flex;width:100%;height:100%;}

/* Sidebar */
.sidebar{width:232px;min-width:232px;background:var(--bg-modal);border-right:1px solid var(--border-divider);
display:flex;flex-direction:column;transition:background .3s;}
.sidebar-header{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-divider);}
.logo-icon{width:30px;height:30px;background:var(--brand);border-radius:8px;display:flex;align-items:center;
justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#000;flex-shrink:0;}
.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;letter-spacing:-.3px;}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;
color:var(--text-secondary);font-size:14px;transition:all .15s;margin-bottom:2px;}
.nav-item:hover{background:var(--bg-item-hover);color:var(--text-primary);}
.nav-item.active{background:var(--bg-item);color:var(--text-primary);font-weight:500;}
.nav-item .nav-icon{width:17px;height:17px;opacity:.7;flex-shrink:0;}
.nav-item.active .nav-icon{opacity:1;}
.nav-sub{font-size:11px;color:var(--text-quaternary);text-transform:uppercase;letter-spacing:.8px;padding:10px 12px 4px;}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--border-divider);}
.theme-switcher{display:flex;gap:6px;margin-bottom:8px;}
.theme-btn{flex:1;padding:6px 0;border:1px solid var(--border-std);border-radius:6px;background:transparent;
color:var(--text-secondary);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit;}
.theme-btn:hover{border-color:var(--text-tertiary);}
.theme-btn.active{border-color:var(--brand);color:var(--brand);background:rgba(19,228,37,.06);}
.reset-btn{width:100%;padding:7px 0;border:1px solid var(--border-std);border-radius:6px;background:transparent;
color:var(--text-tertiary);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;}
.reset-btn:hover{border-color:var(--brand-danger);color:var(--brand-danger);}

/* Tree panel */
.tree-panel{width:248px;min-width:248px;background:var(--bg);border-right:1px solid var(--border-divider);
display:flex;flex-direction:column;transition:background .3s;}
.tree-panel-head{padding:14px 16px 10px;border-bottom:1px solid var(--border-divider);}
.tree-panel-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
display:flex;align-items:center;gap:8px;}
.tree-panel-title .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand);}
.tree-svg-wrap{flex:1;overflow:auto;padding:8px;}
.tree-svg-wrap svg{display:block;}
.tnode{cursor:pointer;}
.tnode circle{transition:all .15s;}
.tnode:hover circle{stroke:var(--text-primary);}
.tnode.current circle{stroke:var(--brand);stroke-width:3;filter:drop-shadow(0 0 5px var(--brand));}
.tnode text{font-size:10px;fill:var(--text-tertiary);font-family:'JetBrains Mono',monospace;}
.tnode.current text{fill:var(--brand);}
.tedge{stroke:var(--stroke-tree-link);stroke-width:1.4;opacity:.5;}
.medge{stroke:var(--color-warning);stroke-width:1.5;stroke-dasharray:6,4;opacity:.6;marker-end:url(#arrowhead);}

.tree-info{padding:10px 14px;border-top:1px solid var(--border-divider);font-size:12px;color:var(--text-tertiary);}
.tree-info b{color:var(--text-secondary);font-weight:500;}
.mem-head{padding:10px 14px 6px;border-top:1px solid var(--border-divider);font-size:11px;
text-transform:uppercase;letter-spacing:.6px;color:var(--text-quaternary);display:flex;align-items:center;gap:6px;}
.mem-list{max-height:180px;overflow-y:auto;padding:0 10px 10px;}
.mem-item{background:var(--bg-modal);border:1px solid var(--border-divider);border-radius:8px;padding:7px 9px;
margin-bottom:6px;font-size:11.5px;line-height:1.45;color:var(--text-secondary);}
.mem-item .tag{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:4px;margin-top:4px;margin-right:3px;}
.mem-item.path .tag{background:rgba(19,228,37,.14);color:var(--brand);}
.mem-item.cross .tag{background:rgba(236,27,218,.14);color:var(--brand-opposite);}
.mem-item .src{font-size:9px;color:var(--text-quaternary);float:right;text-transform:uppercase;}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-header{height:50px;min-height:50px;display:flex;align-items:center;justify-content:space-between;
padding:0 22px;border-bottom:1px solid var(--border-divider);flex-shrink:0;}
.breadcrumb{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-tertiary);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;}
.breadcrumb b{color:var(--text-secondary);}
.breadcrumb .cur{color:var(--brand);}
.chat-header-actions{display:flex;gap:8px;}
.header-btn{width:30px;height:30px;border:none;border-radius:6px;background:transparent;color:var(--text-tertiary);
cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.header-btn:hover{background:var(--bg-item);color:var(--text-primary);}
.branch-banner{padding:7px 22px;background:rgba(19,228,37,.07);border-bottom:1px solid var(--border-divider);
font-size:12px;color:var(--brand);display:none;align-items:center;gap:8px;}
.branch-banner.show{display:flex;}

/* Messages */
.messages-area{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px;}
.ctx-note{font-size:11.5px;color:var(--text-quaternary);text-align:center;font-family:'JetBrains Mono',monospace;}
.turn{display:flex;flex-direction:column;gap:8px;max-width:760px;width:100%;align-self:center;width:100%;}
.turn-head{display:flex;align-items:center;gap:8px;padding:0 2px;}
.turn-badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:5px;
background:var(--bg-item);color:var(--text-tertiary);border:1px solid var(--border-divider);}
.turn-badge.branch{color:var(--brand-opposite);border-color:rgba(236,27,218,.4);}
.turn.current .turn-badge{color:var(--brand);border-color:var(--brand);}
.turn-time{font-size:10.5px;color:var(--text-quaternary);}
.turn-branch-tag{font-size:10px;color:var(--text-quaternary);margin-left:auto;}
.turn.current{position:relative;}
.branch-divider{height:2px;width:100%;max-width:760px;align-self:center;margin:2px 0;
background:linear-gradient(to right,transparent,var(--brand),transparent);opacity:.5;border-radius:2px;}

.bubble{padding:13px 17px;border-radius:16px 4px 16px 16px;max-width:85%;line-height:1.65;font-size:14.5px;word-break:break-word;}
.bubble-user{background:var(--bg-usermsg);box-shadow:var(--shadow-usermsg);color:var(--text-primary);align-self:flex-end;}
.ai-card{background:linear-gradient(180deg,var(--bg-card-up),var(--bg-card-down));border:1px solid var(--border-std);
border-radius:14px;box-shadow:var(--shadow-card);overflow:hidden;max-width:720px;width:100%;}
.card-header{padding:13px 17px 9px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border-divider);}
.card-avatar{width:25px;height:25px;background:var(--brand);border-radius:7px;display:flex;align-items:center;
justify-content:center;font-weight:700;font-size:12px;color:#000;flex-shrink:0;}
.card-label{font-size:12.5px;font-weight:600;color:var(--text-secondary);}
.card-body{padding:15px 17px;}
.card-body p{font-size:14px;line-height:1.7;color:var(--text-primary);margin-bottom:10px;}
.card-body p:last-child{margin-bottom:0;}
.concept-term{border-bottom:1.5px dotted var(--text-tertiary);cursor:pointer;transition:border-color .2s;padding-bottom:1px;}
.concept-term:hover{border-bottom-style:solid;border-bottom-color:var(--text-primary);}
.code-block{background:var(--bg);border:1px solid var(--border-divider);border-radius:8px;padding:11px 13px;
margin:10px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.55;overflow-x:auto;
white-space:pre-wrap;word-break:break-all;color:var(--text-secondary);}
.card-footer{padding:9px 17px 13px;display:flex;gap:7px;border-top:1px solid var(--border-divider);}
.card-action-btn{padding:5px 11px;border:1px solid var(--border-std);border-radius:6px;background:var(--bg-btn);
color:var(--text-secondary);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:4px;
transition:all .15s;font-family:inherit;}
.card-action-btn:hover{background:var(--bg-btn-hover);color:var(--text-primary);}
/* ── 复制自 ai.explore.poker 的动画 (2026-07-27) ── */
@keyframes spin{0%{transform:rotate(0deg)}to{transform:rotate(1turn)}}
@keyframes fadeIn{0%{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes dotFlashing{0%{background-color:var(--text-tertiary)}50%,to{background-color:var(--brand-opposite)}}
@keyframes highlight-fade{0%{background-color:transparent;color:inherit;text-shadow:none}
  10%{background-color:rgba(19,228,37,.3);color:var(--brand);text-shadow:0 0 10px var(--brand)}
  80%{background-color:rgba(19,228,37,.3);color:var(--brand);text-shadow:0 0 10px var(--brand)}
  to{background-color:transparent;color:inherit;text-shadow:none}}
@keyframes flash-normal{0%{border-color:var(--text-primary)}}
@keyframes flash-favorite{0%{border-color:var(--brand)}}
@keyframes flash-fade{0%{background-color:rgba(19,228,37,.35)}to{background-color:transparent}}

/* 旋转描边 (streaming-border-effect) —— 与参考站实现一致:
   :before 绝对铺满 + conic-gradient + mask 只留 2px 环 + spin 旋转 */
.streaming-border-effect{position:relative;}
.streaming-border-effect:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  border-radius:inherit;padding:2px;
  background:conic-gradient(from 0deg,transparent 30%,var(--text-primary) 40%,var(--text-primary) 60%,transparent 70%);
  -webkit-mask:linear-gradient(var(--text-primary) 0 0) content-box,linear-gradient(var(--text-primary) 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 3s linear infinite;pointer-events:none;}
.streaming-border-effect.favorite:before{background:conic-gradient(from 0deg,transparent 30%,var(--brand) 40%,var(--brand) 60%,transparent 70%);}

/* 卡片入场淡入+缩放 */
.animate-fadeIn{animation:fadeIn .3s ease-out forwards;}

/* 概念词一次性品牌色闪光 */
.highlight-text-flash{animation:highlight-fade 3s ease-in-out;box-decoration-break:clone;-webkit-box-decoration-break:clone;}

/* 按钮/卡片闪光 */
.flash-normal{animation:flash-normal .5s ease-out;}
.flash-favorite{animation:flash-favorite .6s ease-out;}
.flash-bg{animation:flash-fade .5s ease-out;}

/* 输入中三点 (dot-flashing) —— 颜色 tertiary→opposite, delay 0/.5/1s */
.dot-flashing{display:inline-flex;gap:4px;padding:4px 0;}
.dot-flashing span{width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);
animation:dotFlashing 1s linear infinite alternate;}
.dot-flashing span:nth-child(2){animation-delay:.5s;}
.dot-flashing span:nth-child(3){animation-delay:1s;}

/* Input */
.input-area{padding:14px 22px 18px;border-top:1px solid var(--border-divider);flex-shrink:0;}
.input-wrapper{max-width:760px;margin:0 auto;background:var(--bg-input);border:1px solid var(--border-std);
border-radius:14px;display:flex;align-items:flex-end;padding:9px 13px;gap:9px;transition:border-color .2s;}
.input-wrapper:focus-within{border-color:var(--brand);}
.input-field{flex:1;background:transparent;border:none;outline:none;color:var(--text-primary);font-size:14.5px;
font-family:inherit;line-height:1.5;resize:none;max-height:150px;min-height:22px;padding:4px 0;}
.input-field::placeholder{color:var(--text-quaternary);}
.send-btn{width:33px;height:33px;border:none;border-radius:8px;background:var(--brand);color:#000;cursor:pointer;
display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:15px;}
.send-btn:hover{filter:brightness(1.1);transform:scale(1.04);}
.send-btn:active{transform:scale(.96);}
.input-toolbar{max-width:760px;margin:7px auto 0;display:flex;gap:4px;}
.tool-btn{width:29px;height:29px;border:none;border-radius:6px;background:transparent;color:var(--text-quaternary);
cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:14px;}
.tool-btn:hover{background:var(--bg-item);color:var(--text-secondary);}
.text-brand{color:var(--brand);}
@media(max-width:900px){.sidebar,.tree-panel{display:none;}}
::selection{background:rgba(19,228,37,.25);color:var(--text-primary);}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">E</div>
      <span class="logo-text">Explore</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Chat</span>
      </div>
      <div class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        <span>Tree</span>
      </div>
      <div class="nav-sub">Branches</div>
      <div class="nav-item" style="font-size:13px;" id="branchList"></div>
    </nav>
    <div class="sidebar-footer">
      <div class="theme-switcher">
        <button class="theme-btn active" data-theme="dark" onclick="switchTheme('dark')">Dark</button>
        <button class="theme-btn" data-theme="warm" onclick="switchTheme('warm')">Warm</button>
      </div>
      <button class="reset-btn" onclick="resetAll()">Reset demo tree</button>
    </div>
  </aside>

  <!-- Tree panel -->
  <section class="tree-panel">
    <div class="tree-panel-head">
      <div class="tree-panel-title"><span class="dot"></span> Conversation Tree</div>
    </div>
    <div class="tree-svg-wrap" id="treeSvgWrap"></div>
    <div class="tree-info" id="treeInfo"></div>
    <div class="mem-head">⟡ Path Memories</div>
    <div class="mem-list" id="memPath"></div>
    <div class="mem-head">⟡ Cross-Branch</div>
    <div class="mem-list" id="memCross"></div>
  </section>

  <!-- Main -->
  <main class="main">
    <header class="chat-header">
      <span class="breadcrumb" id="breadcrumb"></span>
      <div class="chat-header-actions">
        <button class="header-btn" title="New root">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="header-btn" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>
    <div class="branch-banner" id="branchBanner">
      <span>↳ 正在从历史节点继续 — 发送将在此处创建<b style="margin:0 4px;">新分支</b></span>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea class="input-field" id="inputField" rows="1" placeholder="从当前节点继续，或点树中节点跳转…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-toolbar">
        <button class="tool-btn" title="Attach"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <button class="tool-btn" title="Branch from here" onclick="branchFromCurrent()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/><circle cx="18" cy="6" r="3"/></svg></button>
        <button class="tool-btn" title="Prune subtree" onclick="pruneCurrent()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>
    </div>
  </main>
</div>

<script>
/* =====================================================================
 *  对话树面板前端 (API 客户端 + 本地只读镜像)
 *  - 后端 = core/conversation-tree/server.py (conversation_tree 引擎)
 *  - 后端为唯一事实源；前端持有镜像供渲染，写操作走 /api/*
 * ===================================================================== */
'use strict';

/* ---------- API 客户端 ---------- */
const API = {
  async _get(p){ const r = await fetch(p); return r.json(); },
  async _post(p, b){ const r = await fetch(p, {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(b||{})}); return r.json(); },
  state(){ return this._get('/api/state'); },
  addTurn(b){ return this._post('/api/add_turn', b); },
  chat(b){ return this._post('/api/chat', b); },
  branchFrom(b){ return this._post('/api/branch_from', b); },
  jumpTo(id){ return this._post('/api/jump_to', {node_id:id}); },
  prune(id){ return this._post('/api/prune', {node_id:id}); },
  memory(id){ return this._get('/api/memory?node_id='+encodeURIComponent(id)); },
  reset(){ return this._post('/api/reset', {}); }
};

/* ---------- 本地镜像 (只读视图, 字段对齐 ConvNode) ---------- */
class ConvNode{
  constructor(o){o=o||{};this.id=o.id;this.parentId=o.parentId||null;this.children=o.children||[];
  this.depth=o.depth||0;this.branchLabel=o.branchLabel||null;this.messages=o.messages||[];
  this.state=o.state||{};this.config=o.config||{};this.meta=o.meta||{};this.createdAt=o.createdAt||Date.now();
  this.nodeType=o.nodeType||'trunk';this.isValid=o.isValid!==false;
  this.mergeTarget=o.mergeTarget||null;this.mergedFrom=o.mergedFrom||[];
  this.skillsUsed=o.skillsUsed||[];this.toolCalls=o.toolCalls||[];this.conclusions=o.conclusions||[];}
}
class TreeView{
  constructor(nodesMap, rootId, currentId){this.nodes=nodesMap;this.rootId=rootId;this.currentId=currentId;this.version=0;}
  get current(){return this.nodes.get(this.currentId);}
  getNode(id){return this.nodes.get(id);}
  getPath(id){id=id||this.currentId;const p=[];let c=this.nodes.get(id);while(c){p.unshift(c);c=c.parentId?this.nodes.get(c.parentId):null;}return p;}
  getContext(id){return this.getPath(id).reduce((a,n)=>a.concat(n.messages),[]);}
  getContextWithMeta(id){return this.getPath(id).map(n=>({nodeId:n.id,depth:n.depth,branchLabel:n.branchLabel,messages:n.messages}));}
  siblings(id){const n=this.nodes.get(id);if(!n||!n.parentId)return[];const p=this.nodes.get(n.parentId);return p.children.filter(c=>c!==id);}
  subtree(id){const res=[];const st=[id];while(st.length){const c=st.pop();const n=this.nodes.get(c);if(!n)continue;res.push(n);st.push.apply(st,n.children);}return res;}
}

let tree=null;            // TreeView 镜像
let currentMem={path:[],cross:[]};
let branchParentId=null;  // 待发送时的显式父节点 (用于分叉)

function installState(s){
  const m=new Map();
  Object.values(s.nodes).forEach(n=>{
    m.set(n.id, new ConvNode({
      id:n.id, parentId:n.parent_id, children:n.children, depth:n.depth,
      branchLabel:n.branch_label, messages:n.messages, state:n.state, config:n.config,
      meta:n.meta, createdAt:n.created_at,
      nodeType:n.node_type, isValid:n.is_valid, mergeTarget:n.merge_target,
      mergedFrom:n.merged_from, skillsUsed:n.skills_used,
      toolCalls:n.tool_calls, conclusions:n.conclusions
    }));
  });
  tree=new TreeView(m, s.root_id, s.current_id);
}

/* ---------- 启动 / 刷新 ---------- */
async function boot(){
  try{
    const s=await API.state();
    installState(s);
    await refreshMem();
    renderAll();
  }catch(e){ console.error(e); }
}
async function refreshMem(){ currentMem = tree ? (await API.memory(tree.currentId)) : {path:[],cross:[]}; }
async function refresh(){ const s=await API.state(); installState(s); await refreshMem(); renderAll(); }

/* ---------- 渲染：对话树 SVG ---------- */
function renderTree(){
  const wrap=document.getElementById('treeSvgWrap');
  const pos={};let leaf=0;
  const visited=new Set();
  (function dfs(id,depth){
    const n=tree.nodes.get(id);if(!n)return;
    const kids=n.children.filter(c=>tree.nodes.has(c));
    if(!kids.length){pos[id]={x:leaf++,depth};}
    else{kids.forEach(k=>dfs(k,depth+1));const xs=kids.map(k=>pos[k].x);pos[id]={x:(Math.min(...xs)+Math.max(...xs))/2,depth};}
  })(tree.rootId,0);
  const gx=58,gy=66,px=28,py=26;
  const P={};let maxD=0,maxX=0;
  Object.keys(pos).forEach(id=>{P[id]={x:px+pos[id].x*gx,y:py+pos[id].depth*gy};maxD=Math.max(maxD,pos[id].depth);maxX=Math.max(maxX,pos[id].x);});
  const W=px*2+maxX*gx, H=py*2+maxD*gy;
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  tree.nodes.forEach(n=>{if(n.parentId&&P[n.parentId]){const p=P[n.parentId],c=P[n.id];
    svg+=`<line class="tedge" x1="${p.x}" y1="${p.y}" x2="${c.x}" y2="${c.y}"/>`;}});
  // v2: merge edges (dashed)
  tree.nodes.forEach(n=>{if(n.mergeTarget&&P[n.mergeTarget]){const p=P[n.id],c=P[n.mergeTarget];
    svg+=`<line class="medge" x1="${p.x}" y1="${p.y}" x2="${c.x}" y2="${c.y}"/>`;}});
  tree.nodes.forEach(n=>{if(!P[n.id])return;const p=P[n.id];const isCur=n.id===tree.currentId;
    const label=nodeLabel(n);
    const fill=n.nodeType==='branch'?'var(--color-success)'
      :n.nodeType==='conclusion'?'var(--color-warning)'
      :n.nodeType==='merge_point'?'var(--color-danger)'
      :'var(--bg)';
    svg+=`<g class="tnode ${isCur?'current':''}" data-id="${n.id}">
      <circle cx="${p.x}" cy="${p.y}" r="8" fill="${fill}" stroke="var(--stroke-tree-node)" stroke-width="2"/>
      <text x="${p.x+12}" y="${p.y+3}">${escapeHtml(label)}</text></g>`;});
  svg+='</svg>';
  wrap.innerHTML=svg;
  wrap.querySelectorAll('.tnode').forEach(g=>g.addEventListener('click',()=>doJump(g.dataset.id)));
}

function nodeLabel(n){
  if(n.depth===0)return 'root';
  const um=n.messages.find(m=>m.role==='user');
  let s=um?um.content:('turn '+n.depth);
  if(s.length>13)s=s.slice(0,13)+'...';
  const prefix=(n.branchLabel&&n.branchLabel!=='main'?('['+n.branchLabel+'] '):'');
  const suffix=[];
  if(!n.isValid)suffix.push('[Abandoned]');
  if(n.nodeType==='conclusion')suffix.push('[Conclusion]');
  if(n.mergeTarget)suffix.push('[Merged]');
  return prefix+s+(suffix.length?' '+suffix.join(' '):'');
}

/* ---------- 渲染：消息线程（重建上下文） ---------- */
function renderThread(){
  const area=document.getElementById('messagesArea');
  const path=tree.getPath();
  const total=path.reduce((a,n)=>a+n.messages.filter(m=>m.role!=='system').length,0);
  let html=`<div class="ctx-note">⟡ 上下文已重建 · 路径 ${path.length} 节点 · ${total} 条消息（根 → 当前）</div>`;
  path.forEach((n,idx)=>{
    const isCur=n.id===tree.currentId;
    const hasSib=tree.siblings(n.id).length>0;
    const brTag=n.branchLabel&&n.branchLabel!=='main'?`<span class="turn-branch-tag">branch: ${n.branchLabel}</span>`:'';
    let body='';
    n.messages.filter(m=>m.role!=='system').forEach(m=>{
      if(m.role==='user')body+=`<div class="bubble bubble-user">${escapeHtml(m.content)}</div>`;
      else body+=aiCardHtml(m.content, isCur);
    });
    if(idx>0&&hasSib){html+=`<div class="branch-divider"></div>`;}
    html+=`<div class="turn ${isCur?'current animate-fadeIn':''}" data-node="${n.id}">
      <div class="turn-head"><span class="turn-badge ${n.branchLabel&&n.branchLabel!=='main'?'branch':''}">#${n.depth} ${n.branchLabel||'main'}</span>
      <span class="turn-time">${new Date(n.createdAt).toLocaleTimeString()}</span>${brTag}
      ${isCur?'<span class="turn-branch-tag" style="color:var(--brand)">● current</span>':''}</div>${body}</div>`;
  });
  area.innerHTML=html;
  area.querySelectorAll('.turn').forEach(t=>{
    const id=t.dataset.node;
    t.querySelectorAll('[data-branch]').forEach(b=>b.addEventListener('click',()=>{doJump(id);focusInput();}));
  });
  area.scrollTop=area.scrollHeight;
}

function aiCardHtml(content, isCurrent){
  const parts=content.split(/```/);
  let h='';
  parts.forEach((seg,i)=>{
    if(i%2===1){h+=`<div class="code-block">${escapeHtml(seg.trim())}</div>`;}
    else if(seg.trim()){h+=`<p>${highlightConcepts(escapeHtml(seg.trim()), isCurrent)}</p>`;}
  });
  const sbCls = isCurrent ? 'streaming-border-effect' : '';
  return `<div class="ai-card ${sbCls}"><div class="card-header"><div class="card-avatar">E</div><span class="card-label">Explore</span></div>
    <div class="card-body">${h}</div>
    <div class="card-footer">
      <button class="card-action-btn" onclick="copyCard(event)">⧉ Copy</button>
      <button class="card-action-btn" data-branch="1">↳ Branch</button>
      <button class="card-action-btn" style="margin-left:auto;" onclick="favoriteCard(this)">★ Favorite</button>
    </div></div>`;
}
function highlightConcepts(s, isCurrent){
  const cls = isCurrent ? 'concept-term highlight-text-flash' : 'concept-term';
  return s.replace(/(GTO|Nash equilibrium|neural network|attention|self-play|policy|equilibrium|game theory)/gi, '<span class="'+cls+'">$1</span>');
}

/* ---------- 渲染：面包屑 / 信息 / 记忆 ---------- */
function renderHeader(){
  const path=tree.getPath();
  const crumbs=path.map((n,i)=>i===path.length-1?`<span class="cur">${escapeHtml(nodeLabel(n))}</span>`:`<b>${escapeHtml(nodeLabel(n))}</b>`);
  document.getElementById('breadcrumb').innerHTML='路径: '+crumbs.join(' <span style="opacity:.4">›</span> ');
  const isLeaf=tree.current.children.length===0;
  document.getElementById('branchBanner').classList.toggle('show',!isLeaf);
  const cur=tree.current;
  document.getElementById('treeInfo').innerHTML=
    `<div><b>当前节点</b> #${cur.depth} · ${cur.branchLabel||'main'}</div>
     <div style="margin-top:3px;">路径长度 <b>${path.length}</b> · 子节点 <b>${cur.children.length}</b> · 兄弟 <b>${tree.siblings(cur.id).length}</b></div>`;
  const r=currentMem;
  const mp=document.getElementById('memPath'),mc=document.getElementById('memCross');
  mp.innerHTML=r.path&&r.path.length?r.path.map(x=>memItem(x,'path')).join(''):'<div class="mem-item" style="opacity:.5">无路径内记忆</div>';
  mc.innerHTML=r.cross&&r.cross.length?r.cross.map(x=>memItem(x,'cross')).join(''):'<div class="mem-item" style="opacity:.5">无跨分支记忆</div>';
  const branches=new Set(path.map(n=>n.branchLabel).filter(Boolean));
  document.getElementById('branchList').innerHTML=' · '+Array.from(branches).join(' / ')+'  ('+tree.nodes.size+' nodes)';
}
function memItem(x,kind){
  const m=x.mem;const tags=(m.tags||[]).slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('');
  const lm=x.labelMatch||x.label_match;
  return `<div class="mem-item ${kind}"><span class="src">${kind==='path'?'path':'cross'}${lm?' ·branch':''}</span>${escapeHtml(m.text)}${tags}</div>`;
}

/* ---------- 交互 (写操作走后端) ---------- */
function renderAll(){renderTree();renderThread();renderHeader();}
async function doJump(id){ await API.jumpTo(id); await refresh(); }
function focusInput(){const f=document.getElementById('inputField');f.focus();}

async function sendMessage(){
  const f=document.getElementById('inputField');const text=f.value.trim();if(!text)return;
  const branchLabel = tree.current ? (tree.current.branchLabel||'main') : 'main';
  const parentId = branchParentId||undefined;
  // 乐观渲染：用户气泡 + 正在输入 (dot-flashing 可见)
  optimisticThinking(text, branchLabel, parentId);
  // 调真实 LLM (后端 /api/chat)
  let result;
  try {
    result = await API.chat({message: text, parent_id: parentId, branch_label: branchLabel});
  } catch(e) {
    result = {error: e.message||String(e)};
  }
  if(result.error) {
    // LLM 不可用时展示错误提示
    const tt=document.getElementById('thinkingTurn');
    if(tt){ tt.querySelector('.card-body').innerHTML=
      '<p style="color:var(--text-error,red)">[LLM 不可用] '+escapeHtml(result.error)+'</p>'; }
    return;
  }
  branchParentId=null;
  f.value='';f.style.height='auto';
  if(f.placeholder.indexOf('新分支')>=0)f.placeholder='从当前节点继续，或点树中节点跳转…';
  installState(result.state);
  await refreshMem();
  renderAll();
}
/* 临时"正在输入"块 (refresh 后会由服务端状态重建覆盖) */
function optimisticThinking(text, branchLabel, parentId){
  const area=document.getElementById('messagesArea');
  const depth = tree.current ? tree.current.depth+1 : 1;
  const div=document.createElement('div');div.className='turn';div.id='thinkingTurn';
  div.innerHTML=`<div class="turn-head"><span class="turn-badge">#${depth} ${branchLabel||'main'}</span></div>
    <div class="bubble bubble-user">${escapeHtml(text)}</div>
    <div class="ai-card" style="border-style:dashed;"><div class="card-body"><div class="dot-flashing"><span></span><span></span><span></span></div></div></div>`;
  area.appendChild(div);area.scrollTop=area.scrollHeight;
}
async function branchFromCurrent(){
  const cur=tree.current;
  if(cur.children.length===0 && cur.parentId){ branchParentId=cur.parentId; }
  else { branchParentId=cur.id; }
  const f=document.getElementById('inputField');
  f.placeholder='↳ 此处将创建新分支…'; focusInput();
}
async function pruneCurrent(){
  if(tree.currentId===tree.rootId){alert('根节点不可剪枝');return;}
  await API.prune(tree.currentId); await refresh();
}
async function resetAll(){ branchParentId=null; await API.reset(); await refresh(); }
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,150)+'px';}
function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function copyCard(e){const b=e.currentTarget;b.innerHTML='✓ Copied';
  b.classList.add('flash-favorite');setTimeout(()=>b.classList.remove('flash-favorite'),600);
  setTimeout(()=>b.innerHTML='⧉ Copy',1600);}
/* 收藏：卡片常驻绿色旋转描边 + 背景闪光；按钮边框闪光 */
function favoriteCard(btn){
  const card=btn.closest('.ai-card');
  if(card){card.classList.add('streaming-border-effect','favorite');
    card.classList.add('flash-bg');setTimeout(()=>card.classList.remove('flash-bg'),600);}
  btn.innerHTML='★ Favorited';
  btn.classList.add('flash-favorite');setTimeout(()=>btn.classList.remove('flash-favorite'),600);
}
function switchTheme(t){document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'warm');
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===t));}

/* 启动 */
boot();
</script>
