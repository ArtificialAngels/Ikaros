# ============================================================
# llama-server router-mode preset (b9538+) — EXAMPLE / TEMPLATE
# ============================================================
# Copy this file to router-preset.ini and uncomment / customize the
# sections for the GGUF models you actually have in data\models\.
#
# Section name = GGUF filename (case-sensitive). Each section overrides
# the global --host/--port/--jinja with per-model defaults.
#
# Per-model settings supported (any subset):
#   n-gpu-layers  (0 = full CPU; 99 = full GPU offload; n = hybrid)
#   ctx-size      (context window; cap at the model's n_ctx_train)
#   temp          (sampling temperature)
#   top-k, top-p, min-p
#   prompt        (system prompt prefix)
#
# This file is the default-empty template. Hermes will start llama-server
# router fine without any sections; the router will use its built-in
# defaults (n-gpu-layers=99, ctx-size=4096, temp=0.7) for every model.
# Override per model here when you need different trade-offs.
# ============================================================

# ----- 7B class (Q4_K_M, ~5 GB) -----
# Fits in 8 GB VRAM with full offload. Aggressive ctx for long convos.
#[Qwen2.5-7B-Instruct-Q4_K_M.gguf]
#n-gpu-layers = 99
#ctx-size     = 32768
#temp         = 0.7

# ----- 14B class (Q4_K_M, ~9 GB) -----
# 8 GB VRAM: drop to ~30 GPU layers, rest on CPU.
#[Qwen2.5-14B-Instruct-Q4_K_M.gguf]
#n-gpu-layers = 30
#ctx-size     = 16384
#temp         = 0.7

# ----- MoE 35B class (Q4_K_M, ~22 GB) -----
# Won't fit in 8 GB VRAM. Use smart NGL: a few expert layers on GPU
# + rest on CPU. Slow but works for occasional use.
#[Qwen3.5-35B-A3B-Q4_K_M.gguf]
#n-gpu-layers = 16
#ctx-size     = 32768
#temp         = 0.7

# ----- Alias mirror -----
# If you launch llama-server with `--alias my-cool-alias`, also add a
# bare-section entry (no .gguf extension) so the alias-keyed load path
# picks up the same n-gpu-layers / ctx-size as the filename-keyed one.
#[my-cool-alias]
#n-gpu-layers = 99
#ctx-size     = 32768
#temp         = 0.7
