# ============================================================
# llama-server router-mode preset (b9538+)
#
# Section name = GGUF filename. Each section overrides the
# global --host/--port/--jinja with per-model defaults.
#
# Per-model settings supported (any subset):
#   model        (path within --models-dir; default = section name)
#   n-gpu-layers (default 0 = full CPU; 99 = full GPU offload)
#   ctx-size     (context window; cap at the model's n_ctx_train)
#   temp         (sampling temperature)
#   top-k, top-p, min-p
#   prompt       (system prompt prefix)
# ============================================================

# Qwen2.5-3B-Instruct Q4_K_M, ~2 GB file. Fits entirely in 8 GB VRAM.
[Qwen2.5-3B-Instruct-Q4_K_M.gguf]
n-gpu-layers = 99
ctx-size     = 32768
temp         = 0.7

# Qwen2.5-7B-Instruct Q4_K_M, ~4.4 GB file. Fits entirely in 8 GB VRAM.
[Qwen2.5-7B-Instruct-Q4_K_M.gguf]
n-gpu-layers = 99
ctx-size     = 32768
temp         = 0.7

# Qwen3.5-35B-A3B Q4_K_M MoE, ~21 GB file. Doesn't fit 8 GB VRAM.
# 16 layers on GPU + rest on CPU. Acceptable for occasional use.
[Qwen3.5-35B-A3B-Q4_K_M.gguf]
n-gpu-layers = 16
ctx-size     = 32768
temp         = 0.7
